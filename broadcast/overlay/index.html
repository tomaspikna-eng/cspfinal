<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSP Broadcast Overlay</title>
<meta name="robots" content="noindex,nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="/assets/csp-auth.js?v=20261103-broadcast-1"></script>
<style>
:root{--gold:#d4a843;--green:#26d07d;--fg:#fff;--muted:#a8b0b2;--glass:rgba(7,9,10,.94);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--fg)}
body{display:flex;align-items:flex-end;justify-content:center;padding:4.5vh 3vw}
#root{width:100%;display:flex;justify-content:center;transition:.2s opacity,.2s transform}
#root.loading{opacity:0;transform:translateY(10px)}
.overlay{position:relative;background:var(--glass);border:1px solid var(--line);box-shadow:0 20px 55px rgba(0,0,0,.42);overflow:hidden}
.accent{height:7px;background:linear-gradient(90deg,var(--gold),#f0d183)}
.event{min-height:30px;padding:7px 15px;color:#c8cecf;font-size:clamp(10px,.85vw,14px);font-weight:900;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;gap:12px}
.live{display:inline-flex;align-items:center;gap:7px;color:var(--green);font-size:.82em}.live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 11px rgba(38,208,125,.9)}
.scoreline{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);border-top:1px solid rgba(255,255,255,.09);align-items:stretch}
.side{min-width:0;padding:12px 16px 13px}.side.away{text-align:right}.name{font-size:clamp(18px,2vw,34px);font-weight:950;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{margin-top:5px;color:var(--muted);font-size:clamp(9px,.75vw,12px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{min-width:145px;display:grid;place-items:center;padding:8px 18px;background:rgba(212,168,67,.10);color:var(--gold);font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;font-size:clamp(34px,4.3vw,68px);line-height:1;font-weight:950;font-variant-numeric:tabular-nums}
.duel{border-top:1px solid rgba(255,255,255,.08);padding:7px 15px 9px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;color:#e1e5e4}.duel .away{text-align:right}.duel-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(10px,.9vw,15px);font-weight:850}.duel-score{font-family:ui-monospace,monospace;color:var(--green);font-size:clamp(15px,1.5vw,23px);font-weight:950}.duel-meta{text-align:center;color:var(--muted);font-size:clamp(8px,.66vw,10px);margin-top:3px}
.lower-third{width:min(1180px,92vw);border-radius:12px}
.scorebug{width:min(760px,72vw);border-radius:10px}.scorebug .event{min-height:26px;padding:5px 11px}.scorebug .accent{height:5px}.scorebug .side{padding:9px 12px}.scorebug .name{font-size:clamp(15px,1.55vw,25px)}.scorebug .score{min-width:110px;font-size:clamp(28px,3.2vw,48px);padding:7px 13px}.scorebug .meta{font-size:9px}.scorebug .duel{padding:5px 11px 7px}
.center{width:min(920px,82vw);border-radius:18px}.center .event{justify-content:center;min-height:44px}.center .scoreline{grid-template-columns:1fr}.center .side{text-align:center!important;padding:16px 20px}.center .score{min-width:0;font-size:clamp(54px,8vw,108px);padding:14px 20px}.center .duel{grid-template-columns:1fr;text-align:center}.center .duel .away{text-align:center}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="root" class="loading"></div>
<script>
(function(){
'use strict';
const root=document.getElementById('root');
const token=new URLSearchParams(location.search).get('token')||'';
let lastSig='',timer=null,failures=0;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function statusLive(status){return ['active','live','in_progress','ready'].includes(String(status||'').toLowerCase())}
function matchMeta(c,m){
  return [c?.discipline,m?.round_key,m?.match_number?'Match #'+m.match_number:null,m?.race_to?'Race to '+m.race_to:null,m?.station].filter(Boolean).join(' · ');
}
function teamGameMeta(g){
  return [g?.game_type==='doubles'?'Doubles':'Singles',g?.discipline,g?.race_to?'Race to '+g.race_to:null,g?.slot_no?'Duel #'+g.slot_no:null].filter(Boolean).join(' · ');
}
function html(payload){
  const cfg=payload?.config||{},layout=['lower-third','scorebug','center'].includes(cfg.layout)?cfg.layout:'lower-third';
  let event='CONNECT SPORTS PRO',live=false,home='—',away='—',hs=0,as=0,homeMeta='',awayMeta='',duel='';
  if(payload.type==='team_meeting'){
    const c=payload.competition||{},m=payload.meeting||{},g=payload.current_game;
    event=cfg.show_competition===false?'CONNECT SPORTS PRO':(c.name||'TEAM COMPETITION');
    live=statusLive(m.status)||statusLive(g?.status);
    home=m.home_short||m.home_team||'HOME';away=m.away_short||m.away_team||'AWAY';hs=Number(m.home_score||0);as=Number(m.away_score||0);
    homeMeta=cfg.show_meta===false?'':(m.home_team||'');awayMeta=cfg.show_meta===false?'':(m.away_team||'');
    if(g){
      duel='<div class="duel"><div><div class="duel-name">'+esc(g.home_name||'—')+'</div></div><div><div class="duel-score">'+Number(g.home_score||0)+' : '+Number(g.away_score||0)+'</div><div class="duel-meta">'+esc(cfg.show_meta===false?'':teamGameMeta(g))+'</div></div><div class="away"><div class="duel-name">'+esc(g.away_name||'—')+'</div></div></div>';
    }
  }else{
    const c=payload.competition||{},m=payload.match||{};
    event=cfg.show_competition===false?'CONNECT SPORTS PRO':(c.name||'TOURNAMENT');
    live=statusLive(m.status);home=m.home_name||'PLAYER 1';away=m.away_name||'PLAYER 2';hs=Number(m.home_score||0);as=Number(m.away_score||0);
    const meta=cfg.show_meta===false?'':matchMeta(c,m);homeMeta=meta;awayMeta=meta;
  }
  return '<section class="overlay '+layout+'"><div class="accent"></div><div class="event"><span>'+esc(event)+'</span><span class="live '+(live?'':'hidden')+'"><i></i>LIVE</span></div><div class="scoreline"><div class="side"><div class="name">'+esc(home)+'</div><div class="meta">'+esc(homeMeta)+'</div></div><div class="score">'+hs+' : '+as+'</div><div class="side away"><div class="name">'+esc(away)+'</div><div class="meta">'+esc(awayMeta)+'</div></div></div>'+duel+'</section>';
}
async function load(){
  if(!token){root.innerHTML='';return}
  try{
    const r=await cspAuth.client.rpc('get_broadcast_payload',{p_token:token});
    if(r.error)throw r.error;
    const payload=r.data;
    if(!payload){root.innerHTML='';root.classList.remove('loading');return}
    const sig=JSON.stringify(payload);
    if(sig!==lastSig){root.innerHTML=html(payload);lastSig=sig;requestAnimationFrame(()=>root.classList.remove('loading'))}
    failures=0;
  }catch(e){
    failures++;console.error('[broadcast overlay]',e);
    if(failures>4)root.classList.add('loading');
  }
}
load();timer=setInterval(load,900);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
})();
</script>
</body>
</html>
