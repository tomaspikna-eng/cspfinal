<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vyhľadávanie · Connect Sports Pro</title>
<meta name="description" content="Vyhľadávanie hráčov, klubov, turnajov a udalostí v Connect Sports Pro.">
<link rel="icon" href="/assets/csp-logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js" defer></script>
<script async src="https://cse.google.com/cse.js?cx=750832031efc94019"></script>
<style>
:root{--bg:#08080c;--card:#13131a;--card2:#0d0d13;--line:rgba(255,255,255,.08);--fg:#f4f4f6;--muted:#92929e;--gold:#d4a843;--green:#26d07d;--red:#ff656d;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg)}a{color:inherit;text-decoration:none}button,input{font:inherit}
.topbar{position:sticky;top:0;z-index:20;background:rgba(8,8,12,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.topbar-in{max-width:1180px;height:64px;margin:auto;padding:0 22px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900}.brand span{color:var(--gold)}.back{font-size:12px;color:var(--muted)}
.wrap{max-width:1180px;margin:auto;padding:38px 22px 80px}.eyebrow{color:var(--green);font:700 10px var(--mono);letter-spacing:.16em;text-transform:uppercase}.head h1{margin:8px 0 0;font-size:clamp(2rem,4vw,3rem)}.head p{color:var(--muted);max-width:760px;line-height:1.6;font-size:14px}
.searchbar{display:flex;gap:10px;margin-top:24px}.searchbar input{flex:1;min-width:0;height:50px;border:1px solid var(--line);border-radius:11px;background:#0c0c12;color:var(--fg);padding:0 15px;outline:none}.searchbar input:focus{border-color:var(--gold)}.searchbar button{min-width:110px;border:0;border-radius:11px;background:var(--gold);color:#211806;font-weight:900;cursor:pointer}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab{border:1px solid var(--line);border-radius:9px;background:#101016;color:var(--muted);padding:9px 13px;font-size:12px;font-weight:800;cursor:pointer}.tab.active{background:var(--gold);border-color:var(--gold);color:#211806}
.panel{border:1px solid var(--line);border-radius:15px;background:var(--card);padding:16px;min-height:240px}.status{color:var(--muted);font-size:12px}.results{display:grid;gap:10px;margin-top:14px}.result{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:13px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card2);transition:.15s}.result:hover{border-color:rgba(212,168,67,.45);transform:translateY(-1px)}.avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:#252923;border:1px solid rgba(212,168,67,.42);color:var(--gold);font-weight:900}.avatar.square{border-radius:10px}.avatar img{width:100%;height:100%;object-fit:cover}.copy{min-width:0}.copy b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.copy small,.copy em{display:block;margin-top:4px;font-style:normal;color:var(--muted);font-size:11px}.copy em{color:#c6c8cb}.open{font-size:11px;font-weight:900;color:var(--gold);white-space:nowrap}.type{display:inline-flex;margin-left:7px;padding:3px 6px;border-radius:4px;font:700 8px var(--mono);letter-spacing:.08em}.type.player{background:rgba(38,208,125,.09);color:var(--green)}.type.club{background:rgba(212,168,67,.1);color:var(--gold)}.type.tournament{background:rgba(90,151,255,.1);color:#78a9ff}.type.event{background:rgba(185,120,255,.1);color:#c28dff}.empty{padding:32px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.hidden{display:none!important}.web-panel{margin-top:8px}.note{margin-top:12px;color:var(--muted);font-size:11px}
.gsc-control-cse{background:transparent!important;border:0!important;padding:0!important}.gsc-input-box{background:#0c0c12!important;border-color:var(--line)!important}.gsc-search-button-v2{background:var(--gold)!important;border-color:var(--gold)!important}.gs-title,.gs-title *{color:var(--gold)!important}
@media(max-width:650px){.wrap{padding:28px 14px 60px}.searchbar{flex-direction:column}.searchbar button{height:44px}.result{grid-template-columns:48px 1fr}.avatar{width:48px;height:48px}.open{grid-column:2}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in"><a class="brand" href="/"><span>Connect</span>Sports<span>Pro</span></a><a class="back" href="/">← Späť</a></div></header>
<main class="wrap">
<section class="head"><div class="eyebrow">CSP Search</div><h1>Vyhľadávanie</h1><p>Nájdi hráča, klub, turnaj alebo udalosť priamo v databáze Connect Sports Pro.</p></section>

<form class="searchbar" id="searchForm">
  <input id="searchInput" type="search" autocomplete="off" maxlength="80" placeholder="Hľadať hráča, klub, turnaj, šport, mesto...">
  <button type="submit">Hľadať</button>
</form>

<div class="tabs">
  <button class="tab active" data-filter="all">Všetko</button>
  <button class="tab" data-filter="player">Hráči</button>
  <button class="tab" data-filter="club">Kluby</button>
  <button class="tab" data-filter="tournament">Turnaje</button>
  <button class="tab" data-filter="event">Udalosti</button>
  <button class="tab" data-filter="web">Web</button>
</div>

<section class="panel" id="dbPanel"><div class="status" id="status">Zadaj aspoň 2 znaky.</div><div class="results" id="results"></div></section>
<section class="panel hidden web-panel" id="webPanel"><div class="gcse-search"></div><p class="note">Webová záložka používa Google index. CSP položky v ostatných záložkách idú priamo zo Supabase.</p></section>
</main>

<script>
"use strict";
const SUPABASE_URL="https://lcmoykaqvvfybtobhtqg.supabase.co";
const SUPABASE_KEY="sb_publishable_h3_yK3K_GUahLdz13dDWDg_PzxGE6xR";
const $=id=>document.getElementById(id);
let client=null,rows=[],filter="all";

function esc(v){return String(v??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]));}
function initials(name){return String(name||"CSP").trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase();}
function typeLabel(t){return {player:"HRÁČ",club:"KLUB",tournament:"TURNAJ",event:"UDALOSŤ"}[t]||t.toUpperCase();}
function avatar(row){
  if(row.image_url)return '<span class="avatar '+(row.entity_type==="player"?"":"square")+'"><img src="'+esc(row.image_url)+'" alt=""></span>';
  return '<span class="avatar '+(row.entity_type==="player"?"":"square")+'">'+esc(initials(row.title))+'</span>';
}
function render(){
  if(filter==="web"){dbPanel.classList.add("hidden");webPanel.classList.remove("hidden");return}
  dbPanel.classList.remove("hidden");webPanel.classList.add("hidden");
  const visible=filter==="all"?rows:rows.filter(r=>r.entity_type===filter);
  status.textContent=rows.length?visible.length+" výsledkov":"Bez výsledkov";
  results.innerHTML=visible.length?visible.map(r=>
    '<a class="result" href="'+esc(r.href)+'">'+avatar(r)+
    '<span class="copy"><b>'+esc(r.title)+' <span class="type '+esc(r.entity_type)+'">'+esc(typeLabel(r.entity_type))+'</span></b>'+
    '<small>'+esc(r.subtitle||"")+'</small>'+
    (r.meta?'<em>'+esc(r.meta)+'</em>':'')+'</span>'+
    '<span class="open">Otvoriť →</span></a>'
  ).join(""):'<div class="empty">Nenašiel sa žiadny výsledok.</div>';
}
async function search(raw){
  const q=String(raw||"").trim().replace(/\s+/g," ");
  if(q.length<2){rows=[];status.textContent="Zadaj aspoň 2 znaky.";results.innerHTML="";return}
  status.textContent="Hľadám…";results.innerHTML="";
  try{
    if(!client){
      if(!window.supabase)throw new Error("Supabase knižnica sa nenačítala.");
      client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    }
    const safe=q.replace(/[%_]/g,"");
    const {data,error}=await client.rpc("search_public_entities",{p_query:safe,p_limit:12});
    if(error)throw error;
    rows=Array.isArray(data)?data:[];
    const url=new URL(location.href);url.searchParams.set("q",q);history.replaceState(null,"",url);
    render();
  }catch(e){
    console.error("[CSP search]",e);
    rows=[];status.textContent="Vyhľadávanie sa nepodarilo.";results.innerHTML='<div class="empty">Skús vyhľadávanie zopakovať.</div>';
  }
}
searchForm.addEventListener("submit",e=>{e.preventDefault();search(searchInput.value)});
document.querySelectorAll("[data-filter]").forEach(btn=>btn.addEventListener("click",()=>{
  filter=btn.dataset.filter;
  document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===btn));
  render();
}));
document.addEventListener("DOMContentLoaded",()=>{
  const q=new URLSearchParams(location.search).get("q");
  if(q){searchInput.value=q;search(q)}
});
</script>
<script src="/assets/csp-translate.js?v=20260814-3" defer></script>
</body>
</html>
