<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prihlásenie — CSP Club Manager</title><link rel="stylesheet" href="../assets/styles.css"><style>.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px}.login-card input,.login-card button{width:100%;padding:12px;margin-top:10px}.error{color:#ff8e88;min-height:20px}</style></head><body><main class="login"><section class="login-card"><div class="brand"><div class="brand-mark">C</div><div><div class="brand-name"><span>Connect</span>Sports<span>Pro</span></div><div class="brand-sub">Club Manager</div></div></div><h1>Prihlásenie</h1><p>Prihláste sa účtom s aktivovaným prístupom do Club Managera.</p><form id="form"><input id="email" type="email" placeholder="E-mail" required><input id="password" type="password" placeholder="Heslo" required><div class="error" id="error"></div><button class="primary" id="button">Prihlásiť sa</button></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/config.js"></script><script src="../assets/app.js"></script><script>
const A=CSPClubManager;function safeReturn(v){return v&&v.startsWith('/')&&!v.startsWith('//')?v:A.route('dashboard/')}
(async()=>{const s=await A.session();if(s){const p=new URLSearchParams(location.search);location.replace(safeReturn(p.get('returnTo')))}})();
form.onsubmit=async e=>{e.preventDefault();button.disabled=true;error.textContent='';try{const {error:err}=await A.db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(err)throw err;const p=new URLSearchParams(location.search);location.replace(safeReturn(p.get('returnTo')))}catch(err){error.textContent=err.message||'Prihlásenie zlyhalo.';button.disabled=false}}
</script></body></html>
