<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Predplatné · Connect Sports Pro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js" integrity="sha384-AkNSQdptcXlJ0/NBZc4qGk86cDVXcCevwoWgEKIpHOEfbvlXGLlIkimQtONt8KNf" crossorigin="anonymous"></script>
<script src="/assets/csp-auth.js"></script>
<link rel="icon" href="/assets/csp-logo-mark.png">
<style>
:root{--bg:#070807;--panel:#0e1110;--line:#292f2b;--text:#f4f4f2;--muted:#929993;--gold:#d4a843;--green:#22d36b;--red:#ff5b64}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% -10%,rgba(212,168,67,.1),transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}.wrap{width:min(820px,calc(100% - 28px));margin:0 auto;padding:24px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.logo{width:220px;max-width:48vw}.back{padding:9px 12px;border:1px solid var(--line);border-radius:8px;color:#d8dcd8;font-size:13px}.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,rgba(212,168,67,.06),var(--panel) 42%);padding:24px}.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--gold);font-weight:900}.card h1{margin:8px 0 7px;font-size:30px}.sub{margin:0;color:var(--muted);line-height:1.55}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:22px 0}.item{padding:15px;border:1px solid var(--line);border-radius:10px;background:#0a0d0c}.item span{display:block;color:var(--muted);font-size:10px}.item strong{display:block;margin-top:5px;font-size:16px}.notice{padding:14px 15px;border:1px solid rgba(212,168,67,.3);border-radius:10px;background:rgba(212,168,67,.07);color:#ddd;font-size:13px;line-height:1.5}.notice.cancel{border-color:rgba(255,91,100,.35);background:rgba(255,91,100,.07)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:9px;background:#151917;color:#fff;font-weight:800;cursor:pointer}.btn.primary{background:var(--green);border-color:var(--green);color:#06180d}.btn.danger{border-color:rgba(255,91,100,.5);color:#ff8b92;background:#1b1012}.btn:disabled{opacity:.5;cursor:wait}.loading{padding:28px;text-align:center;color:var(--muted)}.hidden{display:none!important}@media(max-width:620px){.grid{grid-template-columns:1fr}.card{padding:18px}.actions .btn{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/"><img class="logo" src="/assets/csp-logo-full.png" alt="Connect Sports Pro"></a><a class="back" href="/profil/">← Späť na profil</a></div>
  <section class="card">
    <div class="eyebrow">ÚČET · FAKTURÁCIA</div>
    <h1>Predplatné</h1>
    <p class="sub">Správa aktívneho plánu Connect Sports Pro.</p>
    <div id="loading" class="loading">Načítavam predplatné…</div>
    <div id="content" class="hidden">
      <div class="grid">
        <div class="item"><span>PLÁN</span><strong id="plan">—</strong></div>
        <div class="item"><span>FAKTURÁCIA</span><strong id="billing">—</strong></div>
        <div class="item"><span>STAV</span><strong id="status">—</strong></div>
        <div class="item"><span>PRÍSTUP DO</span><strong id="periodEnd">—</strong></div>
      </div>
      <div id="notice" class="notice"></div>
      <div class="actions">
        <button id="cancelBtn" class="btn danger" type="button">Zrušiť predplatné</button>
        <button id="resumeBtn" class="btn primary hidden" type="button">Obnoviť automatické predĺženie</button>
        <button id="portalBtn" class="btn" type="button">Otvoriť Stripe fakturáciu</button>
      </div>
    </div>
  </section>
</div>
<script>
'use strict';
const ENDPOINT='https://lcmoykaqvvfybtobhtqg.supabase.co/functions/v1/stripe-billing';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6ImxjbW95a2FxdnZmeWJ0b2JodHFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxNjc0ODUsImV4cCI6MjA5ODc0MzQ4NX0.l4-t_EgXOQh_3PjfracM-ECvrky58CP44LGwBgI9TDA';
const $=id=>document.getElementById(id);
let session=null;
let subscription=null;
function planLabel(v){return v==='pro_plus'?'PRO+':String(v||'free').toUpperCase()}
function billingLabel(v){return v==='annual'?'Ročne':v==='monthly'?'Mesačne':'—'}
function statusLabel(v){return ({active:'Aktívne',trialing:'Skúšobné obdobie',past_due:'Platba po splatnosti',canceled:'Zrušené',pending:'Čaká na platbu'})[v]||String(v||'—')}
function dateLabel(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':new Intl.DateTimeFormat('sk-SK',{day:'numeric',month:'long',year:'numeric'}).format(d)}
async function request(action){
  const res=await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json','apikey':SUPABASE_ANON_KEY,'authorization':'Bearer '+session.access_token},body:JSON.stringify({action})});
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error||'Operácia sa nepodarila.');
  return data;
}
function render(){
  $('loading').classList.add('hidden');$('content').classList.remove('hidden');
  if(!subscription){
    $('plan').textContent='FREE';$('billing').textContent='—';$('status').textContent='Bez predplatného';$('periodEnd').textContent='—';
    $('notice').textContent='Na tomto účte nie je aktívne Stripe predplatné.';
    $('cancelBtn').classList.add('hidden');$('resumeBtn').classList.add('hidden');$('portalBtn').classList.add('hidden');return;
  }
  $('plan').textContent=planLabel(subscription.plan);$('billing').textContent=billingLabel(subscription.billingInterval);
  $('status').textContent=statusLabel(subscription.status);$('periodEnd').textContent=dateLabel(subscription.currentPeriodEnd);
  const cancel=!!subscription.cancelAtPeriodEnd;
  $('cancelBtn').classList.toggle('hidden',cancel);
  $('resumeBtn').classList.toggle('hidden',!cancel);
  $('notice').classList.toggle('cancel',cancel);
  $('notice').textContent=cancel
    ? 'Predplatné je nastavené na zrušenie. Platené funkcie zostanú dostupné do '+dateLabel(subscription.currentPeriodEnd)+'. Potom sa účet automaticky prepne na FREE.'
    : 'Predplatné sa automaticky obnovuje. Zrušenie sa vykoná až na konci už zaplateného obdobia — o zostávajúci prístup neprídeš.';
}
async function load(){
  const r=await cspAuth.getSession();session=r?.data?.session||null;if(!session){location.href='/login/?returnTo=/predplatne/';return}
  try{const data=await request('subscription_status');subscription=data.subscription||null;render()}
  catch(e){$('loading').textContent=e.message||'Predplatné sa nepodarilo načítať.'}
}
$('cancelBtn').onclick=async()=>{
  if(!confirm('Naozaj zrušiť predplatné? Plán zostane aktívny do konca už zaplateného obdobia.'))return;
  $('cancelBtn').disabled=true;
  try{const data=await request('cancel');subscription=data.subscription;render()}catch(e){alert(e.message)}finally{$('cancelBtn').disabled=false}
};
$('resumeBtn').onclick=async()=>{
  $('resumeBtn').disabled=true;
  try{const data=await request('resume');subscription=data.subscription;render()}catch(e){alert(e.message)}finally{$('resumeBtn').disabled=false}
};
$('portalBtn').onclick=async()=>{
  $('portalBtn').disabled=true;
  try{const data=await request('portal');if(data.url)location.href=data.url;else throw new Error('Stripe portal sa nepodarilo otvoriť.')}catch(e){alert(e.message);$('portalBtn').disabled=false}
};
load();
</script>
</body>
</html>
