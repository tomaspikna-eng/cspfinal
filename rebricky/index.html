<style>
:root{--bg:#050505;--panel:#0d0d10;--panel2:#131318;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);--text:#f4f4f5;--muted:#92929c;--gold:#d6ab48;--green:#21d66b;--green-ink:#041b0c;--danger:#ff6b6b}
*{box-sizing:border-box}html{color-scheme:dark;background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;line-height:1.45}a{color:inherit;text-decoration:none}button,input,select{font:inherit}.hidden{display:none!important}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:24px 18px;border-right:1px solid var(--line);background:#080809;z-index:30}.brand{display:block;padding:2px 8px 24px}.brand img{display:block;width:210px;max-width:100%;height:auto}
.nav-section{margin:20px 11px 8px;color:#696972;font-size:.75rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.nav-item{display:flex;align-items:center;gap:11px;min-height:46px;margin:3px 0;padding:0 13px;border:1px solid transparent;border-radius:12px;color:#babac1;font-size:.9rem;font-weight:800}.nav-item:hover{color:var(--text);background:rgba(255,255,255,.025)}.nav-item.active{color:var(--green);border-color:rgba(33,214,107,.25);background:rgba(33,214,107,.075)}.nav-item .icon{display:grid;place-items:center;width:20px;color:inherit}
.main{min-width:0}.topbar{min-height:76px;padding:0 34px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:18px}.mobile-toggle{display:none;width:44px;height:44px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);cursor:pointer}.account-link{display:flex;align-items:center;gap:10px;color:#c9c9ce;font-size:.85rem;font-weight:850}.avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#202028;border:1px solid var(--line);color:var(--gold);font-weight:950}
.page{width:min(1160px,calc(100% - 56px));margin:34px auto 80px}.page-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.eyebrow{color:var(--gold);font-size:.75rem;font-weight:950;letter-spacing:.13em;text-transform:uppercase;margin-bottom:7px}h1{margin:0;font-size:clamp(2rem,4vw,3.6rem);line-height:1;letter-spacing:-.05em}.new-season{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 15px;border-radius:11px;background:var(--green);color:var(--green-ink);font-size:.85rem;font-weight:950}
.search-panel{padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--panel);margin-bottom:16px}.search-row{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:10px}.search-wrap{position:relative}.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--gold);font-size:1rem;pointer-events:none}.search-input,.sport-filter{width:100%;height:50px;border:1px solid var(--line2);border-radius:12px;background:#09090c;color:var(--text);outline:0}.search-input{padding:0 44px}.sport-filter{padding:0 13px}.search-input:focus,.sport-filter:focus{border-color:rgba(33,214,107,.6);box-shadow:0 0 0 3px rgba(33,214,107,.08)}.clear-search{position:absolute;right:7px;top:7px;width:36px;height:36px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer}.clear-search:hover{background:var(--panel2);color:var(--text)}
.filter-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:11px}.filters{display:flex;gap:6px}.filter,.scope-toggle{min-height:40px;padding:0 13px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--muted);font-weight:900;cursor:pointer}.filter.active,.scope-toggle.active{border-color:var(--line);background:var(--panel2);color:var(--text)}.filter b{margin-left:5px;color:var(--gold)}.scope-toggle{border-color:var(--line);color:#c7c7cd}.scope-toggle.active{color:var(--green);border-color:rgba(33,214,107,.28);background:rgba(33,214,107,.07)}.summary{margin-left:auto;color:var(--muted);font-size:.8rem}
.loading,.empty,.error{padding:46px 24px;border:1px solid var(--line);border-radius:18px;background:var(--panel);text-align:center;color:var(--muted)}.error{border-color:rgba(255,107,107,.28);color:#ffd0d0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.ranking-card{position:relative;display:flex;flex-direction:column;min-height:225px;padding:21px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#111115,#0a0a0d);transition:.16s ease;overflow:hidden}.ranking-card::after{content:'';position:absolute;right:-55px;top:-70px;width:170px;height:170px;border-radius:50%;background:rgba(214,171,72,.075);pointer-events:none}.ranking-card:hover{transform:translateY(-2px);border-color:rgba(214,171,72,.38)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.status{display:inline-flex;align-items:center;gap:7px;color:var(--green);font-size:.75rem;font-weight:950;letter-spacing:.08em;text-transform:uppercase}.status::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}.status.completed{color:#9d9da6}.sport{position:relative;z-index:1;color:#b7b7bf;font-size:.8rem;font-weight:850}.ranking-card h2{position:relative;z-index:1;margin:18px 0 7px;font-size:1.42rem;line-height:1.14;letter-spacing:-.025em}.organizer{position:relative;z-index:1;color:var(--muted);font-size:.82rem}.organizer strong{color:#d7d7dc}.card-stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto;padding-top:22px}.stat{padding-right:8px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat small{display:block;color:#777781;font-size:.72rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase}.stat strong{display:block;margin-top:4px;font-size:.94rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat strong.gold{color:var(--gold)}.card-link{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);color:var(--green);font-size:.82rem;font-weight:950}.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20}
@media(max-width:900px){.grid{grid-template-columns:1fr}.shell{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:0;width:min(300px,86vw);transform:translateX(-102%);transition:.2s ease;box-shadow:24px 0 70px rgba(0,0,0,.7)}body.menu-open .sidebar{transform:none}body.menu-open .backdrop{display:block}.mobile-toggle{display:grid;place-items:center}.topbar{padding:0 20px}.page{width:min(100% - 32px,1160px);margin-top:28px}}
@media(max-width:620px){.page{width:min(100% - 20px,1160px);margin-top:22px}.topbar{min-height:66px;padding:0 10px}.account-link span:last-child{display:none}.page-head{align-items:flex-start;flex-direction:column}.new-season{width:100%}.search-row{grid-template-columns:1fr}.filter-row{align-items:stretch;flex-direction:column}.filters{display:grid;grid-template-columns:repeat(3,1fr)}.filter{padding:0 7px}.scope-toggle{width:100%}.summary{margin:0}.ranking-card{min-height:215px;padding:18px}.card-stats{gap:5px}.stat strong{font-size:.84rem}}
</style>

<section class="search-panel" aria-label="Vyhľadávanie rebríčkov"><div class="search-row"><label class="search-wrap"><span class="search-icon">⌕</span><input class="search-input" id="rankingSearch" type="search" autocomplete="off" placeholder="Názov, klub, šport alebo ročník" aria-label="Hľadať rebríček"><button class="clear-search hidden" id="clearSearch" type="button" aria-label="Vymazať hľadanie">×</button></label><select class="sport-filter" id="sportFilter" aria-label="Filtrovať podľa športu"><option value="">Všetky športy</option></select></div><div class="filter-row"><div class="filters" aria-label="Filtrovať podľa stavu"><button class="filter active" type="button" data-filter="all">Všetky <b id="allCount">0</b></button><button class="filter" type="button" data-filter="active">Aktívne <b id="activeCount">0</b></button><button class="filter" type="button" data-filter="completed">Ukončené <b id="completedCount">0</b></button></div><button class="scope-toggle hidden" id="scopeToggle" type="button">Moje rebríčky</button><span class="summary" id="summary"></span></div></section>

<script>
(function(){'use strict';
const db=window.cspAuth?.client,$=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char])),initials=value=>String(value||'CSP').trim().split(/\s+/).map(part=>part[0]||'').join('').slice(0,2).toUpperCase(),normalize=value=>String(value||'').normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase().trim(),formatDate=value=>value?new Intl.DateTimeFormat('sk-SK',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(value)):'—';
const params=new URLSearchParams(location.search);let rows=[],filter='all',scope=params.get('scope')==='mine'?'mine':'all',session=null,canManage=false;
function toggleMenu(open){document.body.classList.toggle('menu-open',open);$('mobileToggle').setAttribute('aria-expanded',String(open))}$('mobileToggle').addEventListener('click',()=>toggleMenu(!document.body.classList.contains('menu-open')));$('backdrop').addEventListener('click',()=>toggleMenu(false));
function normalizedState(item){const total=Number(item.total_rounds)||Number(item.roundCount)||0;if(total>0&&Number(item.completedRounds)>=total)return'completed';return['completed','archived'].includes(String(item.status||'').toLowerCase())?'completed':'active'}
function syncUrl(){const url=new URL(location.href),q=$('rankingSearch').value.trim(),sport=$('sportFilter').value;q?url.searchParams.set('q',q):url.searchParams.delete('q');sport?url.searchParams.set('sport',sport):url.searchParams.delete('sport');filter!=='all'?url.searchParams.set('status',filter):url.searchParams.delete('status');scope==='mine'?url.searchParams.set('scope','mine'):url.searchParams.delete('scope');history.replaceState(null,'',url.pathname+(url.searchParams.toString()?`?${url.searchParams}`:''))}
function render(){const q=normalize($('rankingSearch').value),sport=$('sportFilter').value,scoped=rows.filter(row=>scope!=='mine'||String(row.owner_id)===String(session?.user?.id)),counts={all:scoped.length,active:0,completed:0};scoped.forEach(row=>counts[normalizedState(row)]++);$('allCount').textContent=String(counts.all);$('activeCount').textContent=String(counts.active);$('completedCount').textContent=String(counts.completed);const visible=scoped.filter(row=>{const stateOk=filter==='all'||normalizedState(row)===filter,sportOk=!sport||row.sport===sport,hay=normalize([row.title,row.sport,row.discipline,row.organizer,row.firstRoundAt,row.lastRoundAt].filter(Boolean).join(' '));return stateOk&&sportOk&&(!q||hay.includes(q))});$('clearSearch').classList.toggle('hidden',!$('rankingSearch').value);$('rankingGrid').classList.toggle('hidden',!visible.length);$('emptyBox').classList.toggle('hidden',!!visible.length);$('summary').textContent=`Zobrazené ${visible.length} z ${scoped.length}`;$('emptyBox').textContent=q?'Pre zadaný výraz sa nenašiel žiadny rebríček.':'V tejto časti zatiaľ nie sú žiadne rebríčky.';$('rankingGrid').innerHTML=visible.map(row=>{const state=normalizedState(row),total=Number(row.total_rounds)||row.roundCount||0,leader=row.leader||'Čaká na výsledky',sportLabel=[row.sport,row.discipline].filter(Boolean).join(' · ')||row.event_type||'Turnaj',period=row.firstRoundAt&&row.lastRoundAt?`${formatDate(row.firstRoundAt)} – ${formatDate(row.lastRoundAt)}`:'Termíny sa pripravujú';return`<a class="ranking-card" href="/rebricek/?id=${encodeURIComponent(row.id)}"><div class="card-top"><span class="status ${state}">${state==='completed'?'Ukončený':'Aktívny'}</span><span class="sport">${esc(sportLabel)}</span></div><h2>${esc(row.title||'Turnajový rebríček')}</h2><div class="organizer">${row.organizer?`<strong>${esc(row.organizer)}</strong> · `:''}${esc(period)}</div><div class="card-stats"><div class="stat"><small>Odohrané</small><strong>${Number(row.completedRounds)||0} / ${total}</strong></div><div class="stat"><small>Hráči</small><strong>${Number(row.playerCount)||0}</strong></div><div class="stat"><small>Vedie</small><strong class="gold">${esc(leader)}</strong></div></div><div class="card-link"><span>Otvoriť rebríček</span><span>→</span></div></a>`}).join('');syncUrl()}
function fillSports(){const selected=params.get('sport')||'',sports=[...new Set(rows.map(row=>row.sport).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'sk'));$('sportFilter').innerHTML='<option value="">Všetky športy</option>'+sports.map(sport=>`<option value="${esc(sport)}">${esc(sport)}</option>`).join('');if(sports.includes(selected))$('sportFilter').value=selected}
async function optionalNames(definitions){const ownerIds=[...new Set(definitions.map(item=>item.owner_id).filter(Boolean))],clubIds=[...new Set(definitions.map(item=>item.club_id).filter(Boolean))];const [profiles,clubs]=await Promise.all([ownerIds.length?db.from('profiles').select('id,full_name').in('id',ownerIds).then(result=>result.data||[]).catch(()=>[]):[],clubIds.length?db.from('clubs').select('id,name').in('id',clubIds).then(result=>result.data||[]).catch(()=>[]):[]]);return{owners:new Map(profiles.map(item=>[String(item.id),item.full_name||''])),clubs:new Map(clubs.map(item=>[String(item.id),item.name||'']))}}
async function loadRows(){let query=db.from('event_series').select('id,owner_id,club_id,title,event_type,sport,discipline,total_rounds,status,visibility,ranking_config,created_at').order('created_at',{ascending:false});if(scope==='mine'&&session)query=query.eq('owner_id',session.user.id);else query=query.eq('visibility','public').in('status',['published','completed']);const rankingResult=await query;if(rankingResult.error)throw rankingResult.error;const definitions=(rankingResult.data||[]).filter(item=>String(item.status||'').toLowerCase()!=='cancelled'),ids=definitions.map(item=>item.id);let rounds=[],standings=[];if(ids.length){const [roundResult,standingResult]=await Promise.all([db.from('event_series_public_rounds').select('series_id,starts_at,round_status').in('series_id',ids),db.from('event_series_standings').select('series_id,player_name,standing_position').in('series_id',ids).order('standing_position',{ascending:true})]);if(roundResult.error)throw roundResult.error;if(standingResult.error)throw standingResult.error;rounds=roundResult.data||[];standings=standingResult.data||[]}const names=await optionalNames(definitions);rows=definitions.map(item=>{const itemRounds=rounds.filter(round=>String(round.series_id)===String(item.id)).sort((a,b)=>String(a.starts_at||'').localeCompare(String(b.starts_at||''))),itemStandings=standings.filter(row=>String(row.series_id)===String(item.id));return{...item,organizer:names.clubs.get(String(item.club_id))||names.owners.get(String(item.owner_id))||'',roundCount:itemRounds.length,completedRounds:itemRounds.filter(round=>round.round_status==='completed').length,firstRoundAt:itemRounds[0]?.starts_at||'',lastRoundAt:itemRounds[itemRounds.length-1]?.starts_at||'',playerCount:itemStandings.length,leader:itemStandings.find(row=>Number(row.standing_position)===1)?.player_name||''}})}
async function init(){if(!db){$('loading').classList.add('hidden');$('errorBox').textContent='Pripojenie k Connect Sports Pro nie je dostupné.';$('errorBox').classList.remove('hidden');return}try{const auth=await cspAuth.withTimeout(cspAuth.getSession(),8000,'getSession()');session=auth.data?.session||null;if(session){const profileResult=await cspAuth.withTimeout(cspAuth.getCurrentProfile(session.user),8000,'getCurrentProfile()'),profile=profileResult.data||{},role=String(profile.role||'player').toLowerCase(),plan=String(profile.plan||'').toLowerCase();canManage=profile.is_admin===true||role==='admin'||role==='club'||role==='organization'||plan==='ultra'||plan==='pro_plus';$('profileName').textContent=profile.full_name||session.user.email||'Profil';$('avatar').textContent=initials(profile.full_name||session.user.email);$('accountLink').href=canManage?'/profil-ul/':'/profil/'}if(scope==='mine'&&!canManage){if(!session){location.replace('/login/?returnTo='+encodeURIComponent('/rebricky/?scope=mine'));return}scope='all'}$('scopeToggle').classList.toggle('hidden',!canManage);$('newSeason').classList.toggle('hidden',!canManage||scope!=='mine');$('scopeToggle').classList.toggle('active',scope==='mine');$('scopeToggle').textContent=scope==='mine'?'Zobraziť všetky':'Moje rebríčky';await loadRows();fillSports();$('rankingSearch').value=params.get('q')||'';filter=['active','completed'].includes(params.get('status'))?params.get('status'):'all';document.querySelectorAll('[data-filter]').forEach(button=>button.classList.toggle('active',button.dataset.filter===filter));$('loading').classList.add('hidden');render()}catch(error){console.error('[rankings]',error);$('loading').classList.add('hidden');$('errorBox').textContent='Rebríčky sa nepodarilo načítať. Skúste stránku obnoviť.';$('errorBox').classList.remove('hidden')}}
$('rankingSearch').addEventListener('input',render);$('sportFilter').addEventListener('change',render);$('clearSearch').addEventListener('click',()=>{$('rankingSearch').value='';$('rankingSearch').focus();render()});document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{filter=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(item=>item.classList.toggle('active',item===button));render()}));$('scopeToggle').addEventListener('click',()=>{scope=scope==='mine'?'all':'mine';const url=new URL(location.href);scope==='mine'?url.searchParams.set('scope','mine'):url.searchParams.delete('scope');location.href=url.pathname+(url.searchParams.toString()?`?${url.searchParams}`:'')});init();
})();
</script><script src="/assets/csp-translate.js?v=20260814-3" defer></script></body></html>
