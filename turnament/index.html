let wiz={};
let cspPlayerDirectory=null;
const normalizePlayerName=value=>String(value||'').trim().toLocaleLowerCase('sk-SK').replace(/\s+/g,' ');

async function loadCspPlayerDirectory(){
  if(cspPlayerDirectory) return cspPlayerDirectory;
  if(!currentSession) return [];
  const {data,error}=await cspAuth.client.from('profiles').select('id,full_name,avatar_url').eq('role','player').not('full_name','is',null).order('full_name');
  if(error){ console.error('[turnament] CSP player directory:',error); return []; }
  cspPlayerDirectory=data||[];
  return cspPlayerDirectory;
}
function cspCandidatesForName(name){
  if(!cspPlayerDirectory)return[];
  const key=normalizePlayerName(name);
  return key?cspPlayerDirectory.filter(p=>normalizePlayerName(p.full_name)===key):[];
}
function cspWizardBadge(player){
  if(player?.user_id)return '<span class="csp-player-badge linked" title="Prepojený CSP hráč">CSP ✓</span>';
  const matches=cspCandidatesForName(player?.name);
  return matches.length?'<span class="csp-player-badge match" title="Meno existuje v CSP, ale hráč ešte nie je overene prepojený">CSP ?</span>':'';
}
function isLinkedCspPlayer(player){
  if(!player)return false;
  if(player.user_id)return true;
  const byId=player.id&&(curT?.players||[]).find(p=>p.id===player.id);
  if(byId?.user_id)return true;
  const exact=(curT?.players||[]).filter(p=>normalizePlayerName(p.name)===normalizePlayerName(player.name));
  return exact.length===1&&!!exact[0].user_id;
}
function cspBadgeForTournamentName(playerName){
  if(!playerName||!curT)return'';
  const exact=(curT.players||[]).filter(p=>normalizePlayerName(p.name)===normalizePlayerName(playerName));
  return exact.length===1&&exact[0].user_id?'<span class="csp-player-badge linked">CSP ✓</span>':'';
}
function blankWiz(){ return {step:0, name:'', sport:'Biliard', discipline:'8-ball', date:'', venue:'', raceTo:5, config:{}, format:'sko', players:[], seedCount:0, groups:2, advance:8, protectedSeeds:0, showBulk:false, editId:null}; }
function isCombo(){ return wiz.format==='rr_sko'||wiz.format==='rr_dko'; }
function isKarty(){ return wiz.sport==='Karty'; }
function activeSteps(){ return [0,1,2,3]; }

function viewWizard(){
  return `<div class="wrap"><div class="wiz">
    <div class="wiz-rail" id="wizRail"></div>
    <div class="wiz-panel" id="wizPanel"></div>
  </div></div>`;
}
function initWizard(existing){
  wiz=blankWiz();
  if(existing){ // editácia
    wiz={...wiz, ...existing, raceTo:existing.raceTo||existing.config?.race_to||5, seedCount:Math.max(0,Math.min((existing.players||[]).length,Number(existing.seedCount??existing.config?.seed_count??(existing.players||[]).length))), players:Array.isArray(existing.players)?existing.players.map(p=>({...p})):[], editId:existing.id, step:0, showBulk:false};
  }
  renderWiz();
  loadCspPlayerDirectory().then(()=>renderWiz());
}

function renderRail(){
  const steps=activeSteps(), cur=steps.indexOf(wiz.step);
  document.getElementById('wizRail').innerHTML=
    `<div class="rail-title">${wiz.editId?'Nastavenia turnaja':'Nový turnaj'}</div>`+
    steps.map((s,idx)=>{
      const cls = wiz.step===s?'active':(idx<cur?'done':'');
      return `<div class="rail-step ${cls}" onclick="gotoStep(${s})"><span class="num">${idx<cur?'✓':idx+1}</span><span class="lbl">${STEPS[s][0]}</span></div>`;
    }).join('');
}
function gotoStep(s){ const steps=activeSteps(); if(steps.indexOf(s)<=steps.indexOf(wiz.step)){ wiz.step=s; renderWiz(); } }
function nextStep(){ const steps=activeSteps(), i=steps.indexOf(wiz.step); if(i<steps.length-1){ wiz.step=steps[i+1]; renderWiz(); } }
function prevStep(){ const steps=activeSteps(), i=steps.indexOf(wiz.step); if(i>0){ wiz.step=steps[i-1]; renderWiz(); } }

function renderWiz(){
  renderRail();
  const p=document.getElementById('wizPanel');
  if(wiz.step===0){
    const discs=DISCIPLINES[wiz.sport]||[];
    if(!discs.includes(wiz.discipline)) wiz.discipline=discs[0];
    p.innerHTML=`
      <h2>Základné info</h2><div class="sub">Pomenuj turnaj, vyber šport a disciplínu.</div>
      ${wiz.source_event_id?`<div class="note-box" style="margin-bottom:18px"><b>Importované z udalosti.</b> Základné údaje a ${wiz.players.length} hráčov boli prenesené automaticky. Teraz nastav formát a herné parametre.</div>`:''}
      <div class="field"><label>Názov turnaja</label><input id="wName" value="${wiz.name}" placeholder="napr. Letný pool open 2026"/></div>
      <div class="field"><label>Šport</label>
        <select id="wSport" onchange="wiz.sport=this.value;wiz.discipline=(DISCIPLINES[this.value]||[])[0];if(wiz.sport==='Karty')wiz.format='karty';renderWiz()">
          ${SPORTS.map(s=>`<option ${s===wiz.sport?'selected':''}>${s}</option>`).join('')}
        </select></div>
      <div class="field"><label>Disciplína</label>
        <div class="pill-row">${discs.map(d=>`<button class="pill ${d===wiz.discipline?'sel':''}" onclick="wiz.discipline='${d}';renderWiz()">${d}</button>`).join('')}</div></div>
      <div class="row2">
        <div class="field"><label>Dátum</label><input type="date" id="wDate" value="${wiz.date}" onchange="wiz.date=this.value"/></div>
        <div class="field"><label>Miesto (nepovinné)</label><input id="wVenue" value="${wiz.venue}" placeholder="napr. ŠK Pohoda" oninput="wiz.venue=this.value"/></div>
      </div>
      <div class="field"><label>Race to / cieľ zápasu</label><input type="number" id="wRaceTo" min="1" max="99" value="${wiz.raceTo||5}" oninput="wiz.raceTo=Math.max(1,+this.value||1)"/><div class="hint">Prenesie sa aj do QR scoreboardu konkrétneho zápasu.</div></div>
      <div class="wiz-nav"><button class="btn btn-ghost" onclick="go('dashboard')">Zrušiť</button><button class="btn btn-primary" onclick="saveInfo()">Ďalej →</button></div>`;
  }
  else if(wiz.step===1){
    const N=TM.nextPow2(Math.max(2,wiz.players.length));
    const presentCount=wiz.players.filter(pl=>pl.present).length;
    p.innerHTML=`
      <h2>Hráči · prezenčná listina</h2><div class="sub">Pridaj hráčov a pri príchode potvrď ich fyzickú prítomnosť prepínačom Prítomný.</div>
      <div class="player-add">
        <input id="wPlayerName" placeholder="Meno a priezvisko hráča" onkeydown="if(event.key==='Enter')addPlayer()"/>
        <button class="btn btn-primary" onclick="addPlayer()">＋ Pridať</button></div>
      <span class="bulk-toggle" onclick="wiz.showBulk=!wiz.showBulk;renderWiz()">${wiz.showBulk?'− Skryť hromadné pridanie':'＋ Hromadné pridanie (vložiť zoznam)'}</span>
      ${wiz.showBulk?`<div class="bulk-box">
        <textarea id="wBulk" placeholder="Ján Novák&#10;Peter Horváth&#10;Mária Kováčová&#10;…"></textarea>
        <button class="btn btn-ghost" style="margin-top:8px" onclick="addBulk()">Pridať všetkých zo zoznamu</button></div>`:''}
      <div class="player-stats">
        <span class="player-count"><b>${presentCount}/${wiz.players.length}</b> prítomných</span>
        ${wiz.players.length?`<span class="player-bracket">${wiz.players.length>=2?`pavúk ${N}${N>wiz.players.length?` · ${N-wiz.players.length} bye`:''} · `:''}<button class="clear-all" onclick="clearPlayers()">vymazať všetkých</button></span>`:''}
      </div>
      ${wiz.players.length?`<div class="seed-control">
        <div class="field"><label>Počet seedovaných hráčov</label><input type="number" id="wSeedCount" min="0" max="${wiz.players.length}" value="${Math.min(wiz.seedCount,wiz.players.length)}" oninput="setSeedCount(this.value)"/></div>
        <div class="seed-info">Prvých <b>${Math.min(wiz.seedCount,wiz.players.length)}</b> hráčov v zozname bude nasadených. Poradie zmeníš potiahnutím alebo šípkami. Ostatní zostanú bez seedu.</div>
      </div>
      <div class="player-list" id="seedPlayerList">${wiz.players.map((pl,i)=>`<div class="pl-item" draggable="true" data-player-index="${i}" ondragstart="playerDragStart(event,${i})" ondragover="playerDragOver(event,${i})" ondragleave="playerDragLeave(event)" ondrop="playerDrop(event,${i})" ondragend="playerDragEnd(event)">
        <span class="pl-drag" title="Potiahni pre zmenu poradia">☰</span>
        <span class="pl-seed ${i<wiz.seedCount?'':'unseeded'}">${i<wiz.seedCount?`Seed ${i+1}`:'bez seedu'}</span>
        <span class="pl-name">${esc(pl.name)}${cspWizardBadge(pl)}</span>
        <label class="presence-toggle" title="Potvrdiť prítomnosť hráča"><input type="checkbox" ${pl.present?'checked':''} onchange="setPlayerPresent(${i},this.checked)"><span class="presence-switch"></span><span class="presence-label">Prítomný</span></label>
        <span class="pl-move"><button type="button" title="Posunúť vyššie" onclick="movePlayer(${i},-1)">▲</button><button type="button" title="Posunúť nižšie" onclick="movePlayer(${i},1)">▼</button></span>
        <button class="pl-del" onclick="removePlayer(${i})">✕</button>
      </div>`).join('')}</div>`
        : `<div class="player-empty">Zatiaľ žiadni hráči. Pridaj prvého vyššie.</div>`}
      <div class="wiz-nav"><button class="btn btn-ghost" onclick="prevStep()">← Späť</button><button class="btn btn-primary" onclick="nextStep()">Ďalej →</button></div>`;
    setTimeout(()=>{const e=document.getElementById('wPlayerName'); if(e&&!wiz.showBulk) e.focus();},30);
  }
  else if(wiz.step===2){
    if(isKarty()) wiz.format='karty';
    const card=(k)=>{const f=FORMATS[k]; return `<div class="fmt-card ${wiz.format===k?'sel':''}" onclick="wiz.format='${k}';renderWiz()">
      <div class="fic">${f.ic}</div><div class="ftxt"><div class="ft">${f.t}</div><div class="fd">${f.d}</div><div class="fstruct">${f.struct.map((s,i)=>`${i>0?'<span class="arr">→</span>':''}<span class="ph">${s}</span>`).join('')}</div></div></div>`;};
    const perGroup=Math.ceil(wiz.players.length/Math.max(1,wiz.groups));
    p.innerHTML=`<h2>Formát súťaže</h2><div class="sub">Nastav formát až po kontrole prezenčnej listiny.</div>
      ${isKarty()?`<div class="note-box"><b>Karty:</b> turnaj pokračuje do Generátora stolov.</div>`:`
      <div class="fmt-section">Jedna fáza</div><div class="fmt-list">${card('rr')}${card('sko')}${card('dko')}</div>
      <div class="fmt-section">Kombinácia — skupiny → vyraďovák</div><div class="fmt-list">${card('rr_sko')}${card('rr_dko')}</div>
      ${isCombo()?`<div class="fmt-section">Nastavenie skupín</div><div class="row2">
        <div class="field"><label>Počet skupín</label><input type="number" id="wGroups" min="1" max="64" value="${wiz.groups}" oninput="wiz.groups=Math.max(1,+this.value);refreshGroupNote()"/><div class="hint">≈ ${perGroup} hráčov na skupinu</div></div>
        <div class="field"><label>Postupuje z každej</label><input type="number" id="wAdvance" min="1" max="32" value="${wiz.advance}" oninput="wiz.advance=Math.max(1,+this.value);refreshGroupNote()"/></div></div>
        ${wiz.format==='rr_sko'?`<div class="field"><label>Chránené nasadenie (K)</label><input type="number" id="wProtectedSeeds" min="0" max="${Math.max(0,wiz.groups*wiz.advance-1)}" value="${wiz.protectedSeeds}" oninput="wiz.protectedSeeds=Math.max(0,Math.min(${Math.max(0,wiz.groups*wiz.advance-1)},+this.value||0));refreshGroupNote()"/></div>`:''}
        <div class="note-box" id="groupNote"></div>`:''}`}
      <div class="wiz-nav"><button class="btn btn-ghost" onclick="prevStep()">← Späť</button><button class="btn btn-primary" onclick="nextStep()">Ďalej →</button></div>`;
    if(isCombo()) refreshGroupNote();
  }
  else if(wiz.step===3){
    const f=FORMATS[wiz.format];
    const presentCount=wiz.players.filter(pl=>pl.present).length;
    p.innerHTML=`
      <h2>Súhrn a generovanie</h2><div class="sub">${isKarty()?'Skontroluj a vytvor turnaj — otvoríme Generátor stolov.':'Skontroluj a vytvor turnaj — vygenerujeme prvé kolo.'}</div>
      <div class="sumbox">
        <div class="sumrow"><span class="k">Názov</span><span class="v">${wiz.name||'—'}</span></div>
        <div class="sumrow"><span class="k">Šport · disciplína</span><span class="v">${wiz.sport} · ${wiz.discipline}</span></div>
        <div class="sumrow"><span class="k">Formát</span><span class="v">${isKarty()?'Karty — generátor stolov':f.t}</span></div>
        <div class="sumrow"><span class="k">Hráči</span><span class="v">${wiz.players.length}</span></div>
        <div class="sumrow"><span class="k">Prítomní</span><span class="v">${presentCount}/${wiz.players.length}</span></div>
        <div class="sumrow"><span class="k">Seedovanie</span><span class="v">${wiz.seedCount>0?`${wiz.seedCount} seedov`:'bez seedovania'}</span></div>
        <div class="sumrow"><span class="k">Race to</span><span class="v">${wiz.raceTo||5}</span></div>
        ${isCombo()?`<div class="sumrow"><span class="k">Skupiny</span><span class="v">${wiz.groups} × postup ${wiz.advance} = ${wiz.groups*wiz.advance} do KO</span></div>`:''}
        ${wiz.format==='rr_sko'&&wiz.protectedSeeds?`<div class="sumrow"><span class="k">Chránené nasadenie</span><span class="v">K = ${wiz.protectedSeeds}</span></div>`:''}
        ${wiz.date?`<div class="sumrow"><span class="k">Dátum</span><span class="v">${wiz.date}</span></div>`:''}
      </div>
      <div id="genPreview"></div>
      <div class="wiz-nav"><button class="btn btn-ghost" onclick="prevStep()">← Späť</button><button class="btn btn-green" onclick="createTournament()">${isKarty()?(wiz.editId?'✓ Uložiť zmeny':'✓ Vytvoriť turnaj a otvoriť stoly'):(wiz.editId&&wiz.status==='active'?'▶ Pokračovať v turnaji':'▶ Spustiť turnaj')}</button></div>`;
    renderPreview();
  }
}

function saveInfo(){
  wiz.name=document.getElementById('wName').value.trim();
  if(!wiz.name){ toast('Doplň názov turnaja.',true); return; }
  nextStep();
}
async function addPlayer(){
  const inp=document.getElementById('wPlayerName'); const name=(inp.value||'').trim();
  if(!name) return;
  await loadCspPlayerDirectory();
  const matches=cspCandidatesForName(name);
  wiz.players.push({name,user_id:matches.length===1?matches[0].id:null,present:false});
  inp.value=''; renderWiz();
  if(matches.length===1)toast('Hráč prepojený s CSP profilom ✓');
  else if(matches.length>1)toast('V CSP je viac hráčov s rovnakým menom — profil nebol automaticky prepojený.',true);
}
async function addBulk(){
  const ta=document.getElementById('wBulk'); if(!ta) return;
  const names=ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!names.length){ toast('Vlož aspoň jedno meno.',true); return; }
  await loadCspPlayerDirectory();
  names.forEach(n=>{
    const matches=cspCandidatesForName(n);
    wiz.players.push({name:n,user_id:matches.length===1?matches[0].id:null,present:false});
  });
  wiz.showBulk=false; renderWiz(); toast(`Pridaných ${names.length} hráčov`);
}
function setPlayerPresent(index,present){
  if(!wiz.players[index]) return;
  wiz.players[index].present=!!present;

  // Do not rebuild the whole wizard here. Re-rendering step 2 focused
  // the add-player input at the top of the page and forced the scroll
  // position back to the beginning of the attendance list.
  const countEl=document.querySelector('.player-count b');
  if(countEl){
    const presentCount=wiz.players.filter(pl=>pl.present).length;
    countEl.textContent=`${presentCount}/${wiz.players.length}`;
  }
}
function setSeedCount(value){
  wiz.seedCount=Math.max(0,Math.min(wiz.players.length,Number(value)||0));
  renderWiz();
}
function movePlayer(index,delta){
  const target=index+delta;
  if(target<0||target>=wiz.players.length)return;
  const [player]=wiz.players.splice(index,1);
  wiz.players.splice(target,0,player);
  renderWiz();
}
let draggedPlayerIndex=null;
function playerDragStart(event,index){
  draggedPlayerIndex=index;
  event.dataTransfer.effectAllowed='move';
  event.dataTransfer.setData('text/plain',String(index));
  event.currentTarget.classList.add('dragging');
}
function playerDragOver(event,index){
  event.preventDefault();
  event.dataTransfer.dropEffect='move';
  document.querySelectorAll('.pl-item.drag-over').forEach(el=>el.classList.remove('drag-over'));
  event.currentTarget.classList.add('drag-over');
}
function playerDragLeave(event){event.currentTarget.classList.remove('drag-over')}
function playerDrop(event,targetIndex){
  event.preventDefault();
  const source=draggedPlayerIndex??Number(event.dataTransfer.getData('text/plain'));
  if(Number.isInteger(source)&&source!==targetIndex){
    const [player]=wiz.players.splice(source,1);
    wiz.players.splice(targetIndex,0,player);
  }
  draggedPlayerIndex=null;
  renderWiz();
}
function playerDragEnd(event){
  draggedPlayerIndex=null;
  event.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.pl-item.drag-over').forEach(el=>el.classList.remove('drag-over'));
}
function removePlayer(i){
  wiz.players.splice(i,1);
  wiz.seedCount=Math.min(wiz.seedCount,wiz.players.length);
  renderWiz();
}
function clearPlayers(){ if(confirm('Vymazať všetkých hráčov?')){ wiz.players=[]; wiz.seedCount=0; renderWiz(); } }
function refreshGroupNote(){
  const el=document.getElementById('groupNote'); if(!el) return;
  const total=wiz.groups*wiz.advance, N=TM.nextPow2(Math.max(2,total));
  const koType=wiz.format==='rr_dko'?'Double KO':'Single KO';
  const protectedNote=wiz.format==='rr_sko'&&wiz.protectedSeeds?`<br><b>K = ${wiz.protectedSeeds}:</b> top ${wiz.protectedSeeds} celkovo chránených hráčov čaká na hlavný pavúk; ostatní odohrajú predkolo.`:'';
  el.innerHTML=`Postupujúci spolu: <b>${total}</b> → ${koType} pavúk <b>${N}</b>${N>total?` (${N-total} bye)`:''}.<br>Víťazi skupín idú do opačných polovíc — stretnú sa najskôr vo finále. Krížové nasadenie (A1 vs B3…) finalizujeme v engine.${protectedNote}`;
}

function renderPreview(){
  const el=document.getElementById('genPreview');
  const players = wiz.players.length>=2 ? wiz.players.map((p,i)=>({...p,seed:i+1}))
                 : Array.from({length:8},(_,i)=>({name:`Hráč ${i+1}`,seed:i+1}));
  const demoNote = wiz.players.length<2?`<div class="note-box">Pridaj aspoň 2 hráčov — náhľad používa zástupné mená.</div>`:'';
  if(isKarty()){
    el.innerHTML=demoNote+`<div class="note-box"><b>Karty — ${wiz.discipline}:</b> ${wiz.players.length} hráčov. Po vytvorení ťa presmerujeme do Generátora stolov, kde sa rozdelia do stolov a hrajú sa kolá — žiadny pavúk ani tabuľka RR sa tu negeneruje.</div>`;
  }
  else if(wiz.format==='sko'||wiz.format==='dko'){
    const N=TM.nextPow2(players.length), slots=TM.bracketWithByes(players,N);
    let html=`<div class="preview"><h4>${wiz.format==='dko'?'Double KO':'Single KO'} · pavúk ${N} — prvé kolo (A0)</h4>`;
    for(let i=0;i<N;i+=2){
      const a=slots[i], b=slots[i+1], key=`A0/${i/2+1}`;
      if(a.bye||b.bye){ const adv=a.bye?b:a; html+=`<div class="mt-match"><span class="mt-key">${key}</span><span class="mt-p">${adv.name}</span><span class="mt-bye">bye → postupuje</span></div>`; }
      else html+=`<div class="mt-match"><span class="mt-key">${key}</span><span class="mt-p">${a.name}</span><span class="mt-vs">vs</span><span class="mt-p" style="text-align:right">${b.name}</span></div>`;
    }
    html+=`</div>`;
    if(wiz.format==='dko') html+=`<div class="note-box"><b>Double KO:</b> štandardná Winner a Loser vetva, hráč vypadáva po druhej prehre, Grand Final podporuje reset.</div>`;
    el.innerHTML=demoNote+html;
  }
  else if(wiz.format==='rr'){
    const rounds=TM.roundRobin(players);
    let html=`<div class="preview"><h4>Round Robin — 1. kolo</h4>`;
    rounds[0].forEach((g,i)=>html+=`<div class="mt-match"><span class="mt-key">R1/${i+1}</span><span class="mt-p">${g[0].name}</span><span class="mt-vs">vs</span><span class="mt-p" style="text-align:right">${g[1].name}</span></div>`);
    html+=`</div><div class="note-box">Spolu kôl: <b>${rounds.length}</b>, zápasov: <b>${rounds.reduce((s,r)=>s+r.length,0)}</b>.</div>`;
    el.innerHTML=demoNote+html;
  }
  else {
    const total=wiz.groups*wiz.advance, N=TM.nextPow2(Math.max(2,total)), koType=wiz.format==='rr_dko'?'Double KO':'Single KO';
    el.innerHTML=demoNote+`<div class="note-box"><b>${FORMATS[wiz.format].t}:</b> ${wiz.players.length} hráčov → ${wiz.groups} skupín (RR). Z každej postupuje ${wiz.advance} → ${total} do ${koType} pavúka ${N}. Krížové nasadenie finalizujeme v engine. Konfigurácia sa uloží.</div>`;
  }
}

async function createTournament(){
  if(wiz.players.length<2){ toast('Pridaj aspoň 2 hráčov.',true); return; }
  const btn = document.querySelector('#wizPanel .btn-green');
  if(btn){ btn.disabled = true; btn.textContent = isKarty()?'Ukladám...':'Spúšťam...'; }

  let createdTournamentId = null;
  try {
    const payload = {
      name: wiz.name,
      sport: wiz.sport,
      discipline: wiz.discipline,
      format: wiz.format,
      date: wiz.date || null,
      venue: wiz.venue || null,
      groups_count: isCombo() ? wiz.groups : null,
      advance_count: isCombo() ? wiz.advance : null,
      config: { ...(wiz.config || {}), race_to: Number(wiz.raceTo || 5), seed_count: Math.max(0,Math.min(wiz.players.length,Number(wiz.seedCount)||0)), present_player_names:wiz.players.filter(p=>p.present).map(p=>p.name) },
    };

    let tournamentId, tournamentRow;
    if(wiz.editId){
      const {data:existing,error:existingErr}=await cspAuth.client
        .from('tournaments').select('id,status,owner_id,started_at').eq('id',wiz.editId).single();
      if(existingErr)throw existingErr;
      const {count:matchCount,error:matchCountErr}=await cspAuth.client.from('matches').select('id',{count:'exact',head:true}).eq('tournament_id',wiz.editId);
      if(matchCountErr)throw matchCountErr;
      if((matchCount||0)>0){
        // A settings URL may survive after matches have already been
        // created. Never re-sync the roster in that state: the database
        // match rows are already authoritative. Continue/start the same
        // tournament instead of treating its locked roster as an error.
        if(existing.status==='completed'||existing.status==='archived'){
          toast('Ukončený turnaj už nie je možné znovu spustiť.',true);
          await go('detail',wiz.editId);
          return;
        }
        if(existing.status!=='active'){
          const {error:startExistingErr}=await cspAuth.client.from('tournaments')
            .update({status:'active',started_at:existing.started_at||new Date().toISOString()})
            .eq('id',wiz.editId).eq('owner_id',currentSession.user.id);
          if(startExistingErr)throw startExistingErr;
          toast('Turnaj bol spustený ✓');
        }else{
          toast('Turnaj už prebieha — pokračujem ✓');
        }
        await go('detail',wiz.editId);
        return;
      }
      const { data: updated, error: uErr } = await cspAuth.client
        .from('tournaments').update(payload).eq('id', wiz.editId).select().single();
      if(uErr) throw uErr;
      tournamentId = wiz.editId; tournamentRow = updated;
    } else {
      const { data: created, error: cErr } = await cspAuth.client
        .from('tournaments')
        .insert({ ...payload, owner_id: currentSession.user.id, status: 'draft', started_at: null })
        .select().single();
      if(cErr) throw cErr;
      tournamentId = created.id; tournamentRow = created;
      createdTournamentId = created.id;
      const phaseType = wiz.format==='rr_sko'||wiz.format==='rr_dko' ? 'rr' : wiz.format;
      const { data: phase, error: phaseErr } = await cspAuth.client.from('tournament_phases').insert({tournament_id:tournamentId,phase_number:1,phase_type:phaseType,status:'draft',started_at:null,config:{target_format:wiz.format}}).select().single();
      if(phaseErr) throw phaseErr;
      await cspAuth.client.from('tournaments').update({current_phase_id:phase.id}).eq('id',tournamentId);
    }

    const playerRows = wiz.players.map((p,i)=>({name:p.name,user_id:p.user_id||null,seed:i+1}));
    let insertedPlayers;
    if(wiz.editId){
      const {data,error}=await cspAuth.client.rpc('sync_draft_tournament_players',{p_tournament_id:tournamentId,p_players:playerRows});
      if(error)throw error;insertedPlayers=data||[];
    }else{
      const {data,error}=await cspAuth.client.from('tournament_players').insert(playerRows.map(p=>({...p,tournament_id:tournamentId}))).select();
      if(error)throw error;insertedPlayers=data||[];
    }

    if(isCombo()){
      const G = Math.max(1, wiz.groups);
      // Same "seeds distributed round-robin across groups" rule already
      // used client-side in ensureBracket(), just using each player's
      // real seed (not array position) to be robust to any insert
      // ordering, and the real player id just returned above.
      const groupRows = insertedPlayers.map(p => ({ tournament_id: tournamentId, group_index: ((p.seed - 1) % G) + 1, player_id: p.id }));
      const { error: grErr } = await cspAuth.client.from('tournament_groups').insert(groupRows);
      if(grErr) throw grErr;
    }

    if(isCombo()) saveBracketState(tournamentId,{protectedSeeds:wiz.format==='rr_sko'?wiz.protectedSeeds:0});

    let finalTournament = { ...tournamentRow, players: insertedPlayers.map(p => ({ name: p.name, seed: p.seed })) };

    if(finalTournament.format === 'karty'){
      toast(wiz.editId ? 'Zmeny uložené ✓' : 'Turnaj vytvorený ✓');
      setTimeout(() => openTableGen(finalTournament), 700);
    } else {
      const startedAt = new Date().toISOString();
      const { data: startedTournament, error: startErr } = await cspAuth.client
        .from('tournaments')
        .update({ status:'active', started_at:startedAt })
        .eq('id', tournamentId)
        .eq('owner_id', currentSession.user.id)
        .select()
        .single();
      if(startErr) throw startErr;
      finalTournament = { ...startedTournament, players: insertedPlayers.map(p => ({ name: p.name, seed: p.seed })) };
      toast('Turnaj bol spustený ✓');
      setTimeout(() => go('detail', tournamentId), 500);
    }
  } catch(err){
    console.error('[turnament] Failed to save tournament:', err);
    if(createdTournamentId && !wiz.editId){
      const {error:rollbackErr}=await cspAuth.client.from('tournaments').delete().eq('id',createdTournamentId);
      if(rollbackErr) console.error('[turnament] Failed to rollback incomplete tournament:',rollbackErr);
    }
    toast('Nepodarilo sa uložiť turnaj: '+cspErrorMessage(err), true);
    if(btn){ btn.disabled = false; btn.textContent = isKarty() ? (wiz.editId?'✓ Uložiť zmeny':'✓ Vytvoriť turnaj a otvoriť stoly') : '▶ Spustiť turnaj'; }
  }
}

function toast(msg,err){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(err?' err':''); setTimeout(()=>t.className='toast'+(err?' err':''),2200); }


setInterval(()=>{
  document.querySelectorAll('[data-match-clock]').forEach(el=>{
    const loc=el.dataset.matchClock,row=realMatchesByKey.get(loc);
    if(row) el.textContent=formatMatchClock(liveMatchElapsed(row));
  });
},1000);

/* INIT happens inside initAuth() above once a real session is confirmed
   -- see the auth gate at the top of this script. */
</script>
</body>
</html>
