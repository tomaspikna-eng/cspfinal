/* ── DETAIL TURNAJA ── */
let curT=null; // aktuálne otvorený turnaj (objekt v store)
let matchViewMode='list';

function ensureBracket(t){
  const players=Array.isArray(t.players)?t.players:[];
  if(t.format==='sko'){
    if(!t.bracket || t.bracket.type!=='sko' || !t.bracket.rounds) t.bracket=TM.buildSKO(players);
    else TM.recomputeSKO(t.bracket);
  } else if(t.format==='dko'){
    if(!t.dko || t.dko.type!=='dko' || t.dko.schemaVersion!==2 || !t.dko.W || !t.dko.GF) t.dko=TM.buildDKO(players);
    else TM.recomputeDKO(t.dko);
  } else if(t.format==='rr'){
    if(!t.rr || !t.rr.matches || !t.rr.matches.length){
      const seeded=players.map((p,i)=>({name:p.name,seed:i+1,id:p.id}));
      const rounds=TM.roundRobin(seeded);
      t.rr={ matches:[] };
      rounds.forEach((round,ri)=>round.forEach((g,gi)=>{
        t.rr.matches.push({ key:`R${ri+1}/${gi+1}`, round:ri+1, p1:g[0], p2:g[1], s1:null,s2:null,winner:null });
      }));
    }
  } else if(t.format==='rr_sko' || t.format==='rr_dko'){
    if(!t.grp || !t.grp.groups || !t.grp.groups.length){
      const G=Math.max(1, t.groups||2);
      const seeded=players.map((p,i)=>({name:p.name,seed:i+1,id:p.id}));
      const groups=Array.from({length:G},(_,gi)=>({name:String.fromCharCode(65+gi), players:[], matches:[]}));
      seeded.forEach((p,i)=>groups[i%G].players.push(p)); // rozdelenie: seedy krížom do skupín
      groups.forEach(g=>{
        const rounds=TM.roundRobin(g.players);
        rounds.forEach((round,ri)=>round.forEach((game,mi)=>{
          g.matches.push({ key:`${g.name}${ri+1}/${mi+1}`, round:ri+1, p1:game[0], p2:game[1], s1:null,s2:null,winner:null });
        }));
      });
      t.grp={ groups, advance:t.advance };
    }
  }
}

/* ── GROUPS → KNOCKOUT TRANSITION ──────────────────────────────────────
   The original combo UI already calculated allDone and promised
   "A1 vs B3…" but never did anything with it. The functions below are
   the one transition implementation for both rr_sko and rr_dko: they
   reuse rrTable() (the exact standings logic already rendered on screen)
   and feed its qualifiers into the existing KO engines, rather than
   introducing a parallel bracket generator.

   The cross-seed order is a conventional snake by finishing position:
   A1,B1,… then the next position in reverse group order, then forward
   again. With two groups this is A1,B1,B2,A2,A3,B3…; it is the existing
   UI's promised A1-vs-B3-style cross-group principle (same-group
   qualifiers are distributed through opposite halves where possible).
*/
function comboAllGroupsDone(t){
  return !!(t.grp && t.grp.groups && t.grp.groups.every(g=>g.matches.every(m=>m.winner!=null)));
}
function comboStandings(t){
  const rows=[];
  t.grp.groups.forEach((g,gi)=>{
    const table=rrTable(g.players,g.matches);
    table.slice(0,Math.min(t.grp.advance,g.players.length)).forEach((stat,rank)=>{
      const player=g.players.find(p=>p.name===stat.name);
      if(player) rows.push({player,groupIndex:gi,group:g.name,rank:rank+1,stat});
    });
  });
  return rows;
}
function comboCrossSeed(rows,groupCount,advance){
  const byGroup=Array.from({length:groupCount},()=>[]);
  rows.forEach(r=>byGroup[r.groupIndex].push(r));
  const ordered=[];
  for(let rank=0;rank<advance;rank++){
    const indexes=Array.from({length:groupCount},(_,i)=>i);
    if(rank%2===1) indexes.reverse();
    indexes.forEach(i=>{ if(byGroup[i][rank]) ordered.push(byGroup[i][rank]); });
  }
  return ordered;
}
function comboOverallTop(rows,k){
  return [...rows].sort((a,b)=>
    b.stat.p-a.stat.p || b.stat.w-a.stat.w ||
    (b.stat.gw-b.stat.gl)-(a.stat.gw-a.stat.gl) ||
    b.stat.pct-a.stat.pct || a.player.seed-b.player.seed
  ).slice(0,k);
}
function protectedStageSize(k){
  // Smallest clean KO stage that can contain the protected seeds plus at
  // least one preliminary survivor. K=2 therefore intentionally means a
  // 4-player semifinal stage, exactly as the owner-confirmed examples.
  return TM.nextPow2(Math.max(2,k+1));
}
function createProtectedPhase2(crossSeeded,k){
  const protectedRows=comboOverallTop(crossSeeded,k);
  const protectedIds=new Set(protectedRows.map(r=>r.player.id||r.player.name));
  const prelimPlayers=crossSeeded.filter(r=>!protectedIds.has(r.player.id||r.player.name)).map(r=>r.player);
  const stageSize=protectedStageSize(k);
  const survivorCount=stageSize-k;
  const prelim=TM.buildSKO(prelimPlayers);
  // Stop at the first round whose output has exactly survivorCount player
  // slots. A next round with one match has two slots — comparing just its
  // match count would incorrectly stop the confirmed 6→2 case one round
  // too early.
  // For 4→2 this is preliminary round 0; for the confirmed 6→2 case
  // (from 8 total advancers, K=2) it is round 1, using the engine's
  // ordinary non-power-of-two byes rather than special-case math.
  let cutoff=prelim.rounds.length-2;
  for(let r=0;r<prelim.rounds.length-1;r++){
    if(prelim.rounds[r+1].length*2===survivorCount){ cutoff=r; break; }
  }
  return {
    kind:'protected-sko',
    protected:protectedRows.map(r=>r.player),
    prelim,
    prelimCutoff:cutoff,
    survivorCount,
    main:null
  };
}
function protectedPrelimComplete(phase){
  return phase.prelim.rounds.slice(0,phase.prelimCutoff+1).every(round=>round.every(m=>m.winner!=null));
}
function maybeGenerateComboPhase(t){
  if(!comboAllGroupsDone(t)) return false;
  if(!t.phase2){
    const standings=comboStandings(t);
    const crossSeeded=comboCrossSeed(standings,t.grp.groups.length,t.grp.advance);
    // Protected seeds are explicitly SKO-only. rr_dko always follows the
    // standard transition, regardless of any stale/local setting value.
    const k=t.format==='rr_sko'?Math.min(Math.max(0,+t.protectedSeeds||0),Math.max(0,crossSeeded.length-1)):0;
    if(k>0){
      t.phase2=createProtectedPhase2(crossSeeded,k);
    }else if(t.format==='rr_sko'){
      t.phase2={kind:'standard-sko',bracket:TM.buildSKO(crossSeeded.map(r=>r.player))};
    }else{
      t.phase2={kind:'standard-dko',dko:TM.buildDKO(crossSeeded.map(r=>r.player))};
    }
  }
  if(t.phase2.kind==='protected-sko'){
    TM.recomputeSKO(t.phase2.prelim);
    if(!t.phase2.main && protectedPrelimComplete(t.phase2)){
      const survivors=t.phase2.prelim.rounds[t.phase2.prelimCutoff+1]
        .flatMap(m=>[m.p1,m.p2]).filter(p=>p&&!p.bye);
      // The preliminary cutoff is chosen so exactly survivorCount slots
      // exist; filter defensively in case a malformed legacy database state
      // contained an extra bye placeholder.
      t.phase2.main=TM.buildSKO([...t.phase2.protected,...survivors.slice(0,t.phase2.survivorCount)]);
    }
  }else if(t.phase2.kind==='standard-sko'){
    TM.recomputeSKO(t.phase2.bracket);
  }else if(t.phase2.kind==='standard-dko'){
    TM.recomputeDKO(t.phase2.dko);
  }
  return true;
}

function comboQualifierPayload(t){
  const standings=comboStandings(t);
  const ordered=comboCrossSeed(standings,t.grp.groups.length,t.grp.advance);
  return ordered.map((row,index)=>({
    tournament_player_id: row.player.id,
    source_group: row.groupIndex + 1,
    source_position: row.rank,
    qualification_position: index + 1,
    seed: index + 1
  }));
}

let comboTransitionPromise=null;
async function syncComboPhaseTransition(t){
  if(!t || !(t.format==='rr_sko'||t.format==='rr_dko') || !comboAllGroupsDone(t)) return null;
  if(t.knockoutPhaseId) return t.knockoutPhaseId;
  if(comboTransitionPromise) return comboTransitionPromise;

  comboTransitionPromise=(async()=>{
    try{
      let groupPhaseId=t.groupPhaseId;
      if(!groupPhaseId){
        const {data:phases,error:phaseLoadErr}=await cspAuth.client
          .from('tournament_phases')
          .select('*')
          .eq('tournament_id',t.id)
          .order('phase_number',{ascending:true});
        if(phaseLoadErr) throw phaseLoadErr;
        const groupPhase=(phases||[]).find(p=>p.phase_type==='rr');
        const koPhase=(phases||[]).find(p=>p.phase_type===(t.format==='rr_dko'?'dko':'sko'));
        if(groupPhase){ groupPhaseId=groupPhase.id; t.groupPhaseId=groupPhase.id; }
        if(koPhase){
          t.knockoutPhaseId=koPhase.id;
          t.current_phase_id=koPhase.id;
          return koPhase.id;
        }
      }
      if(!groupPhaseId) throw new Error('Chýba databázová skupinová fáza.');

      const payload=comboQualifierPayload(t);
      if(!payload.length) throw new Error('Neboli vypočítaní žiadni postupujúci.');
      const nextType=t.format==='rr_dko'?'dko':'sko';
      const {data:nextPhase,error}=await cspAuth.client.rpc('complete_round_robin_phase',{
        p_phase_id:groupPhaseId,
        p_qualifiers:payload,
        p_next_phase_type:nextType
      });
      if(error) throw error;
      const nextPhaseId = typeof nextPhase === 'string' ? nextPhase : nextPhase?.id;
      if(!nextPhaseId) throw new Error('Supabase nevrátil ID novej fázy.');
      t.knockoutPhaseId=nextPhaseId;
      t.current_phase_id=nextPhaseId;
      maybeGenerateComboPhase(t);
      persistT();
      toast(`Skupinová fáza ukončená — ${nextType==='dko'?'Double KO':'Single KO'} pavúk je pripravený ✓`);
      return nextPhaseId;
    }catch(err){
      console.error('[turnament] Phase transition failed:',err);
      toast('Skupiny sú dohrané, ale prechod do ďalšej fázy sa nepodaril: '+cspErrorMessage(err),true);
      throw err;
    }finally{
      comboTransitionPromise=null;
    }
  })();
  return comboTransitionPromise;
}
/* Match/bracket PROGRESS only (scores, winners) -- stored in Supabase,
   per the task's scope boundary, but now scoped to this one real
   tournament id rather than as part of one big array of full tournament
   objects. Core tournament/player/group data is the real DB rows,
   loaded fresh in viewDetail() below, never written here. */
function persistT(){
  if(!curT || isPublicReadOnly) return Promise.resolve(true);
  return saveBracketState(curT.id, {
    bracket: curT.bracket, dko: curT.dko, rr: curT.rr, grp: curT.grp,
    phase2:curT.phase2, protectedSeeds:curT.protectedSeeds,
    groupPhaseId:curT.groupPhaseId, knockoutPhaseId:curT.knockoutPhaseId
  });
}

async function viewDetail(id){
  let t, matchRows=[];
  try {
    const { data: tournament, error: tErr } = await cspAuth.withTimeout(
      cspAuth.client.from('tournaments').select('*').eq('id', id).single(),
      8000, 'load tournament'
    );
    if(tErr) throw tErr;
    isPublicReadOnly = !(currentSession && tournament.owner_id === currentSession.user.id);
    const { data: players, error: pErr } = await cspAuth.withTimeout(
      cspAuth.client.from('tournament_players').select('*').eq('tournament_id', id).order('seed', { ascending: true }),
      8000, 'load tournament players'
    );
    if(pErr) throw pErr;
    // id carried through so the bracket engine's player objects can
    // reference their real tournament_players row when a match is saved.
    t = { ...tournament, groups: tournament.groups_count, advance: tournament.advance_count,
          players: (players||[]).map(p=>({ id: p.id, name: p.name, user_id:p.user_id||null, seed: p.seed })) };

    const { data: matches, error: mErr } = await cspAuth.withTimeout(
      cspAuth.client.from('matches').select('*').eq('tournament_id', id),
      8000, 'load matches'
    );
    if(mErr) throw mErr;
    matchRows = matches || [];
    realMatchesByKey = new Map(matchRows.map(row => [row.round_key, row]));

    const { data: phases, error: phaseErr } = await cspAuth.withTimeout(
      cspAuth.client.from('tournament_phases').select('*').eq('tournament_id', id).order('phase_number', { ascending: true }),
      8000, 'load tournament phases'
    );
    if(phaseErr) throw phaseErr;
    t.phases=phases||[];
    const groupPhase=t.phases.find(p=>p.phase_type==='rr');
    const targetType=t.format==='rr_dko'?'dko':'sko';
    const knockoutPhase=t.phases.find(p=>p.phase_type===targetType && p.phase_number>1);
    t.groupPhaseId=groupPhase?.id||null;
    t.knockoutPhaseId=knockoutPhase?.id||null;
  } catch(err){
    console.error('[turnament] Failed to load tournament detail:', err);
    return `<div class="wrap"><div class="empty">Nepodarilo sa načítať turnaj.</div></div>`;
  }

  // Merge in the database-stored match/bracket progress (see persistT()
  // above) on top of the fresh real tournament/player data. If this
  // browser has no local bracket state yet (fresh device, or first load
  // after this feature shipped) but real `matches` rows already exist,
  // rebuild the bracket from the real players and replay those rows onto
  // it by round_key -- this is what lets scores entered on one device
  // show up correctly on another. If database state already exists, it's
  // trusted as-is (it's already the union of every local + synced save),
  // matching the app's existing database-first behavior.
  // Public spectators rebuild progress from the public `matches` rows and
  // must not call owner-only bracket RPCs (that only creates noisy 400s).
  const localState = isPublicReadOnly ? {} : await loadBracketState(t.id);
  const hadLocalBracket = Object.keys(localState).length > 0;
  curT = { ...t, ...localState };
  ensureBracket(curT);
  // A completed group phase may have been loaded from another browser or
  // from an older database state. Generate/recompute phase 2 here as well as
  // immediately after score entry, so the transition is deterministic on
  // reload and not tied to a particular click.
  maybeGenerateComboPhase(curT);
  if((curT.format==='rr_sko'||curT.format==='rr_dko') && comboAllGroupsDone(curT) && !curT.knockoutPhaseId){
    syncComboPhaseTransition(curT).then(()=>{
      const area=document.getElementById('matchArea');
      if(area) area.innerHTML=renderMatchArea(curT);
    }).catch(()=>{});
  }
  if(matchRows.length){
    applyRealMatches(matchRows);
    if(curT.format==='sko') TM.recomputeSKO(curT.bracket);
    else if(curT.format==='dko') TM.recomputeDKO(curT.dko);
    else if(curT.format==='rr_sko'||curT.format==='rr_dko'){
      // Group rows are replayed first. That may complete the group phase
      // and create phase2; replay once more afterward so any saved phase-2
      // match rows (p2s/p2p/p2m/p2W/p2L/p2F) also find their real target.
      maybeGenerateComboPhase(curT);
      applyRealMatches(matchRows);
      maybeGenerateComboPhase(curT);
    }
    // rr: no separate advancement step, same as recomputeFor()'s existing
    // behavior for that format.
    finalizeAppliedMatches(matchRows);
  }
  persistT();
  if(!isPublicReadOnly){
    await maybeAutoCompleteTournament(curT);
    await loadTournamentOperations(curT.id);
  }else tournamentOperations=[];
  const players=Array.isArray(curT.players)?curT.players:[];
  const isCmb = curT.format==='rr_sko'||curT.format==='rr_dko';

  return `<div class="wrap">
    <button class="link-btn" onclick="${isPublicReadOnly?"location.href='/'":"go('dashboard')"}" style="margin-bottom:14px">← ${isPublicReadOnly?'Späť':'Späť na turnaje'}</button>
    <div class="page-head">
      <div>
        <span class="fmt" style="display:inline-block;margin-bottom:8px">${FMT_LABEL[curT.format]||curT.format}</span>
        <h1>${esc(curT.name)}</h1>
        <p>${esc(curT.sport)}${curT.discipline?' · '+esc(curT.discipline):''} · ${pcount(curT)} hráčov${curT.date?' · '+esc(curT.date):''}${curT.venue?' · '+esc(curT.venue):''} · <span class="status-chip ${esc(curT.status)}">${statusLabel(curT.status)}</span></p>
      </div>
      ${isPublicReadOnly?'':`<div style="display:flex;gap:10px">
        ${curT.status==='draft'?`<button class="btn btn-primary" onclick="setTournamentWorkflowStatus('${curT.id}','ready')">Označiť ako pripravený</button>`:''}
        ${curT.status==='ready'?`<button class="btn btn-green" onclick="setTournamentWorkflowStatus('${curT.id}','active')">▶ Spustiť turnaj</button>`:''}
        ${curT.status==='active'?`<button class="btn btn-primary" id="completeTournamentBtn" onclick="completeTournament('${curT.id}')">✓ Ukončiť turnaj</button>`:''}
        ${curT.status==='completed'?`<button class="btn btn-primary" onclick="archiveTournament('${curT.id}')">Archivovať</button>`:''}
        ${['draft','ready'].includes(curT.status)?`<button class="btn btn-ghost" onclick="editTournament('${curT.id}')">✎ Upraviť</button>`:''}
        <button class="btn btn-ghost btn-danger" onclick="deleteTournament('${curT.id}')">🗑 Zmazať</button>
      </div>`}
    </div>
    <div class="social-bar">
      <button class="btn btn-ghost social-like" id="tournamentLikeBtn" type="button" aria-pressed="false">♥ <span data-like-label>Páči sa mi</span> · <span id="tournamentLikeCount">0</span></button>
      <button class="btn btn-green" id="tournamentShareBtn" type="button">📤 Zdieľať</button>
    </div>
    ${isPublicReadOnly?'':renderOperationsPanel()}
    <div class="detail-grid">
      <div>
        <div class="detail-card">
          <div class="dc-head"><h3>Súhrn</h3></div>
          <div class="sumrow"><span class="k">Formát</span><span class="v">${FMT_LABEL[curT.format]}</span></div>
          <div class="sumrow"><span class="k">Šport · disciplína</span><span class="v">${esc(curT.sport)} · ${esc(curT.discipline||'—')}</span></div>
          <div class="sumrow"><span class="k">Hráči</span><span class="v">${pcount(curT)}</span></div>
          ${isCmb?`<div class="sumrow"><span class="k">Skupiny</span><span class="v">${curT.groups} × postup ${curT.advance}</span></div>`:''}
          ${curT.date?`<div class="sumrow"><span class="k">Dátum</span><span class="v">${curT.date}</span></div>`:''}
        </div>
        <div class="detail-card" style="margin-top:16px">
          <div class="dc-head"><h3>Hráči (${players.length})</h3>${!isPublicReadOnly&&['draft','ready'].includes(curT.status)?`<button class="link-btn" onclick="editTournament('${curT.id}')">upraviť</button>`:''}</div>
          <div class="player-list" style="max-height:240px">
            ${players.length?players.map((p,i)=>`<div class="pl-item"><span class="pl-seed ${i<Number(curT.config?.seed_count||0)?'':'unseeded'}">${i<Number(curT.config?.seed_count||0)?`Seed ${i+1}`:'—'}</span><span class="pl-name">${esc(p.name)}${p.user_id?'<span class="csp-player-badge linked">CSP ✓</span>':''}</span></div>`).join(''):'<div class="player-empty">Žiadni hráči</div>'}
          </div>
        </div>
      </div>
      <div class="detail-card">
        <div class="dc-head match-head"><div><h3 id="matchViewTitle">${matchViewMode==='bracket'?'Pavúk':'Zoznam zápasov'}</h3>${isPublicReadOnly?'':`<span class="mono" style="font-size:.65rem;color:var(--muted)">klikni na zápas → zadaj výsledok</span>`}</div>
          <div class="match-view-switch" role="group" aria-label="Zobrazenie zápasov">
            <button class="match-view-btn ${matchViewMode==='list'?'active':''}" id="matchListViewBtn" onclick="setMatchView('list')">☷ Zoznam</button>
            <button class="match-view-btn ${matchViewMode==='bracket'?'active':''}" id="matchBracketViewBtn" onclick="setMatchView('bracket')">⑂ Pavúk</button>
          </div>
        </div>
        <div id="matchArea">${renderMatchArea(curT)}</div>
      </div>
    </div>
  </div>
  <div id="matchModalArea"></div>`;
}
function bindTournamentSocial(){
  if(!curT||!window.cspSocial)return;
  cspSocial.bind({
    entityType:'tournament',entityId:curT.id,
    likeButton:'tournamentLikeBtn',likeCount:'tournamentLikeCount',shareButton:'tournamentShareBtn',
    title:`${curT.name} · Connect Sports Pro`,
    text:[curT.sport,curT.discipline,curT.date,curT.venue].filter(Boolean).join(' · '),
    url:window.location.origin+'/turnament/?id='+encodeURIComponent(curT.id),
    onCopied:()=>toast('Odkaz na turnaj bol skopírovaný.'),
    onError:()=>toast('Akciu sa nepodarilo dokončiť.',true)
  }).catch(error=>{console.error('[turnament] social init failed:',error);toast('Sociálne funkcie sa nepodarilo načítať.',true)});
}
async function editTournament(id){
  if(isPublicReadOnly){ toast('Verejný náhľad je iba na čítanie.',true); return; }
  try {
    const { data: t, error: tErr } = await cspAuth.withTimeout(
      cspAuth.client.from('tournaments').select('*').eq('id', id).single(),
      8000, 'load tournament'
    );
    if(tErr) throw tErr;
    if(!['draft','ready'].includes(t.status)){
      toast(t.status==='active'?'Turnaj už prebieha. Prezenčná listina je uzamknutá.':'Ukončený turnaj už nie je možné upravovať.',true);
      await go('detail',id);
      return;
    }
    const { data: players, error: pErr } = await cspAuth.withTimeout(
      cspAuth.client.from('tournament_players').select('*').eq('tournament_id', id).order('seed', { ascending: true }),
      8000, 'load tournament players'
    );
    if(pErr) throw pErr;
    const bracketState=await loadBracketState(id);
    const presentNames=new Set(Array.isArray(t.config?.present_player_names)?t.config.present_player_names:[]);
    go('wizard', { ...t, groups: t.groups_count, advance: t.advance_count,
                   raceTo: t.config?.race_to || 5,
                   protectedSeeds: bracketState.protectedSeeds || 0,
                   seedCount: Number(t.config?.seed_count ?? (players||[]).length),
                   source_event_id: t.source_event_id || null,
                   players: (players||[]).map(p=>({ name: p.name, user_id:p.user_id||null, seed: p.seed, present:presentNames.has(p.name) })) });
  } catch(err){
    console.error('[turnament] Failed to load tournament for editing:', err);
    toast('Nepodarilo sa načítať turnaj na úpravu.', true);
  }
}

/* ── Prepínanie zoznam / pavúk ── */
function setMatchView(view){
  matchViewMode=view==='bracket'?'bracket':'list';
  const area=document.getElementById('matchArea');if(area)area.innerHTML=renderMatchArea(curT);
  const title=document.getElementById('matchViewTitle');if(title)title.textContent=matchViewMode==='bracket'?'Pavúk':'Zoznam zápasov';
  document.getElementById('matchListViewBtn')?.classList.toggle('active',matchViewMode==='list');
  document.getElementById('matchBracketViewBtn')?.classList.toggle('active',matchViewMode==='bracket');
}
function renderMatchArea(t){
  const body=matchViewMode==='bracket'?renderBracketView(t):renderMatchList(t);
  return body + renderTournamentEvaluation(t);
}

function bracketPlayerLine(player,score,isWinner){
  const label=player?(player.bye?'VO':esc(player.name)):'Čaká na postup';
  return `<div class="bracket-player ${isWinner?'win':''}"><span>${label}</span><span class="bracket-score">${score??'–'}</span></div>`;
}
function bracketMatchCard(m,loc){
  const playable=!isPublicReadOnly&&m?.p1&&m?.p2&&!m.p1.bye&&!m.p2.bye;
  return `<article class="bracket-match ${playable?'':'disabled'}" ${playable?`onclick="openMatch('${loc}')"`:''}>
    <div class="bracket-match-key">${esc(m?.key||'—')}</div>
    ${bracketPlayerLine(m?.p1,m?.s1,m?.winner===1)}
    ${bracketPlayerLine(m?.p2,m?.s2,m?.winner===2)}
  </article>`;
}
function bracketColumns(rounds,names,prefix){
  return `<div class="bracket-scroll"><div class="bracket-grid">${(rounds||[]).map((round,ri)=>`
    <section class="bracket-column">
      <div class="bracket-column-title">${esc(names?.[ri]||`Kolo ${ri+1}`)}</div>
      <div class="bracket-column-matches">${round.map((m,mi)=>bracketMatchCard(m,`${prefix}:${ri}:${mi}`)).join('')}</div>
    </section>`).join('')}</div></div>`;
}
function renderBracketView(t){
  if(t.format==='sko'&&t.bracket){
    return bracketColumns(t.bracket.rounds,t.bracket.rounds.map((_,ri)=>TM.roundName(ri,t.bracket.total)),'sko');
  }
  if(t.format==='dko'&&t.dko){
    return `<div class="bracket-branch">▲ Winner vetva (A)</div>${bracketColumns(t.dko.W,t.dko.W.map((_,ri)=>TM.dkoRoundName('W',ri,t.dko.total)),'W')}
      <div class="bracket-branch">▼ Loser vetva (B)</div>${bracketColumns(t.dko.L,t.dko.L.map((_,ri)=>TM.dkoRoundName('L',ri,t.dko.total)),'L')}
      <div class="bracket-branch">◆ Grand Final</div>${bracketColumns([t.dko.GF],['Grand Final'],'F')}`;
  }
  if(t.format==='rr'){
    return `<div class="note-box">Round Robin nemá vyraďovací pavúk. Použi zobrazenie Zoznam, kde sú zápasy rozdelené podľa kôl.</div>`;
  }
  if((t.format==='rr_sko'||t.format==='rr_dko')&&!t.phase2){
    return `<div class="note-box">Pavúk sa zobrazí automaticky po dohraní skupinovej fázy.</div>`;
  }
  const phase=t.phase2;
  if(!phase)return `<div class="note-box">Pavúk zatiaľ nie je dostupný.</div>`;
  if(phase.kind==='standard-sko')return bracketColumns(phase.bracket.rounds,phase.bracket.rounds.map((_,ri)=>TM.roundName(ri,phase.bracket.total)),'p2s');
  if(phase.kind==='standard-dko')return `<div class="bracket-branch">▲ Winner vetva (A)</div>${bracketColumns(phase.dko.W,phase.dko.W.map((_,ri)=>TM.dkoRoundName('W',ri,phase.dko.total)),'p2W')}
    <div class="bracket-branch">▼ Loser vetva (B)</div>${bracketColumns(phase.dko.L,phase.dko.L.map((_,ri)=>TM.dkoRoundName('L',ri,phase.dko.total)),'p2L')}
    <div class="bracket-branch">◆ Grand Final</div>${bracketColumns([phase.dko.GF],['Grand Final'],'p2F')}`;
  const activeBracket=phase.main||phase.prelim;
  const prefix=phase.main?'p2m':'p2p';
  return bracketColumns(activeBracket.rounds,activeBracket.rounds.map((_,ri)=>TM.roundName(ri,activeBracket.total)),prefix);
}

/* ── Render zoznamu zápasov ── */
function renderMatchList(t){
  if(t.format==='sko'){
    const br=t.bracket; if(!br) return '';
    const champ=TM.champion(br);
    let html='';
    if(champ) html+=`<div class="champ-banner">🏆 Víťaz turnaja: <b>${champ.name}</b></div>`;
    br.rounds.forEach((round,ri)=>{
      html+=`<div class="round-block"><div class="round-head"><span class="round-name">${TM.roundName(ri,br.total)}</span><span class="round-code mono">${TM.roundCode(ri,br.total)}</span></div>`;
      round.forEach((m,mi)=>{ html+=matchRow(m,`sko:${ri}:${mi}`); });
      html+=`</div>`;
    });
    const rank=TM.skoRanking(br);
    if(rank.some(r=>r.gp>0) && !tournamentFlowFinished(t)) html+=renderRankTable(rank);
    return html;
  }
  else if(t.format==='dko'){
    const dko=t.dko; if(!dko) return '';
    const rank=TM.dkoRanking(dko);
    const played=rank.some(r=>r.gp>0);
    let html='';
    const sect=(title,cls,rounds,names,prefix)=>{
      let h=`<div class="branch-label ${cls}">${title}</div>`;
      rounds.forEach((round,ri)=>{
        h+=`<div class="round-block"><div class="round-head"><span class="round-name">${names[ri]}</span></div>`;
        round.forEach((m,mi)=>{ h+=matchRow(m,`${prefix}:${ri}:${mi}`); });
        h+=`</div>`;
      });
      return h;
    };
    html+=sect('▲ Winner vetva (A)','win',dko.W,dko.W.map((_,ri)=>TM.dkoRoundName('W',ri,dko.total)),'W');
    html+=sect('▼ Loser vetva (B)','lose',dko.L,dko.L.map((_,ri)=>TM.dkoRoundName('L',ri,dko.total)),'L');
    html+=sect('◆ Grand Final','conv',[dko.GF],['Grand Final · GF1 + prípadný reset GF2'],'F');
    const champ=TM.dkoChampion(dko);if(champ) html=`<div class="champ-banner">🏆 Víťaz turnaja: <b>${champ.name}</b></div>`+html;
    html+=`<div class="note-box" style="margin-top:14px"><b>Štandardný Double Elimination:</b> hráč vypadáva až po druhej prehre. Ak víťaz Loser vetvy vyhrá GF1, automaticky sa otvorí reset GF2.</div>`;
    if(played && !tournamentFlowFinished(t)) html+=renderRankTable(rank);
    return html;
  }
  else if(t.format==='rr'){
    const rr=t.rr; if(!rr||!rr.matches.length) return `<div class="note-box">Žiadne zápasy — potrebuješ aspoň 2 hráčov.</div>`;
    // tabuľka: výhry/prehry/hry/body/%
    const tab={};
    (Array.isArray(t.players)?t.players:[]).forEach((p,i)=>tab[p.name]={name:p.name,seed:i+1,w:0,l:0,gw:0,gl:0,p:0});
    rr.matches.forEach(m=>{ if(m.winner){ const win=m.winner===1?m.p1:m.p2, lose=m.winner===1?m.p2:m.p1;
      const s1=m.s1||0,s2=m.s2||0, wgw=Math.max(s1,s2), lgw=Math.min(s1,s2);
      if(tab[win.name]){tab[win.name].w++;tab[win.name].p+=2;tab[win.name].gw+=wgw;tab[win.name].gl+=lgw;}
      if(tab[lose.name]){tab[lose.name].l++;tab[lose.name].gw+=lgw;tab[lose.name].gl+=wgw;} }});
    const standings=Object.values(tab).map(s=>({...s,pct:(s.gw+s.gl)?Math.round(100*s.gw/(s.gw+s.gl)):0}))
      .sort((a,b)=>b.p-a.p||b.w-a.w||(b.gw-b.gl)-(a.gw-a.gl)||a.seed-b.seed);
    let html=`<div class="branch-label conv" style="margin-top:0">Výsledková tabuľka</div>
      <div class="standings"><div class="st-head2"><span>#</span><span>Hráč</span><span>V</span><span>P</span><span>Hry</span><span>%</span><span>Body</span></div>`;
    standings.forEach((s,i)=>html+=`<div class="st-row2"><span class="mono">${i+1}</span><span>${s.name}</span><span>${s.w}</span><span>${s.l}</span><span class="mono" style="color:var(--muted)">${s.gw}:${s.gl}</span><span class="mono">${s.pct}%</span><span class="mono" style="color:var(--gold)">${s.p}</span></div>`);
    html+=`</div>`;
    html+=`<div class="branch-label win" style="margin-top:18px">Zoznam zápasov</div>`;
    let lastRound=0;
    rr.matches.forEach((m,mi)=>{ if(m.round!==lastRound){ html+=`<div class="rr-round-label mono">Kolo ${m.round}</div>`; lastRound=m.round; } html+=matchRow(m,`rr:${mi}`); });
    return html;
  }
  else {
    // rr_sko / rr_dko — skupinová fáza
    const grp=t.grp; if(!grp||!grp.groups) return `<div class="note-box">Skupiny sa nepodarilo vytvoriť.</div>`;
    const koType=t.format==='rr_dko'?'Double KO':'Single KO';
    let html=`<div class="note-box" style="margin-bottom:16px">${grp.groups.length} skupín · z každej postupuje ${grp.advance} → následne ${koType} pavúk (krížové nasadenie). Najprv dohraj skupiny.</div>`;
    grp.groups.forEach((g,gi)=>{
      const st=rrTable(g.players, g.matches);
      const adv=Math.min(grp.advance, g.players.length);
      html+=`<div class="branch-label conv" style="margin-top:0">Skupina ${g.name} · ${g.players.length} hráčov</div>`;
      html+=`<div class="standings"><div class="st-head2"><span>#</span><span>Hráč</span><span>V</span><span>P</span><span>Hry</span><span>%</span><span>Body</span></div>`;
      st.forEach((s,i)=>html+=`<div class="st-row2 ${i<adv?'adv':''}"><span class="mono">${i+1}</span><span>${s.name}${i<adv?' <span class="adv-tag">postup</span>':''}</span><span>${s.w}</span><span>${s.l}</span><span class="mono" style="color:var(--muted)">${s.gw}:${s.gl}</span><span class="mono">${s.pct}%</span><span class="mono" style="color:var(--gold)">${s.p}</span></div>`);
      html+=`</div>`;
      html+=`<div class="rr-round-label mono" style="margin-top:10px">Zápasy skupiny ${g.name}</div>`;
      let lastRound=0;
      g.matches.forEach((m,mi)=>{ if(m.round!==lastRound){ html+=`<div class="rr-round-label mono">Kolo ${m.round}</div>`; lastRound=m.round; } html+=matchRow(m,`grp:${gi}:${mi}`); });
    });
    const allDone=grp.groups.every(g=>g.matches.every(m=>m.winner!=null));
    if(!allDone){
      html+=`<div class="note-box" style="margin-top:16px">Po dohraní skupín sa postupujúci nasadia krížom do ${koType} pavúka (A1 vs B3…).</div>`;
    }else if(!t.phase2){
      // Defensive loading state only: maybeGenerateComboPhase() normally
      // creates phase2 before this render call.
      html+=`<div class="note-box" style="margin-top:16px">✓ Skupiny dohrané — generujem pavúk…</div>`;
    }else{
      html+=renderComboPhase2(t.phase2);
    }
    return html;
  }
}

function renderPhaseSKO(bracket,prefix,title,maxRound){
  const champ=TM.champion(bracket);
  let html=`<div class="branch-label win" style="margin-top:22px">${title}</div>`;
  if(champ&&maxRound===undefined) html+=`<div class="champ-banner">🏆 Víťaz fázy: <b>${champ.name}</b></div>`;
  bracket.rounds.slice(0,maxRound===undefined?undefined:maxRound+1).forEach((round,ri)=>{
    html+=`<div class="round-block"><div class="round-head"><span class="round-name">${TM.roundName(ri,bracket.total)}</span><span class="round-code mono">${TM.roundCode(ri,bracket.total)}</span></div>`;
    round.forEach((m,mi)=>{ html+=matchRow(m,`${prefix}:${ri}:${mi}`); });
    html+=`</div>`;
  });
  return html;
}
function renderPhaseDKO(dko){
  const sect=(title,cls,rounds,names,prefix)=>{
    let h=`<div class="branch-label ${cls}" style="margin-top:22px">${title}</div>`;
    rounds.forEach((round,ri)=>{
      h+=`<div class="round-block"><div class="round-head"><span class="round-name">${names[ri]}</span></div>`;
      round.forEach((m,mi)=>{ h+=matchRow(m,`${prefix}:${ri}:${mi}`); });
      h+=`</div>`;
    });
    return h;
  };
  return sect('▲ Phase 2 · Winner vetva (A)','win',dko.W,dko.W.map((_,ri)=>TM.dkoRoundName('W',ri,dko.total)),'p2W')+
    sect('▼ Phase 2 · Loser vetva (B)','lose',dko.L,dko.L.map((_,ri)=>TM.dkoRoundName('L',ri,dko.total)),'p2L')+
    sect('◆ Phase 2 · Grand Final','conv',[dko.GF],['GF1 + prípadný reset GF2'],'p2F');
}
function renderComboPhase2(phase){
  if(phase.kind==='standard-sko') return renderPhaseSKO(phase.bracket,'p2s','✓ Phase 2 · Single KO');
  if(phase.kind==='standard-dko') return renderPhaseDKO(phase.dko);
  let html=`<div class="note-box" style="margin-top:18px"><b>Chránené nasadenie:</b> ${phase.protected.map(p=>p.name).join(', ')} čaká priamo na hlavný pavúk.</div>`;
  if(!phase.main){
    // Do not render the unused final of the temporary preliminary
    // bracket: after cutoff winners are collected into the protected
    // seeds' main bracket, rather than playing a preliminary champion.
    html+=renderPhaseSKO(phase.prelim,'p2p','✓ Phase 2 · Predkolo',phase.prelimCutoff);
    return html;
  }
  html+=renderPhaseSKO(phase.main,'p2m','✓ Phase 2 · Hlavný pavúk');
  return html;
}

/* Pomocná: kompletný rebríček (celkové poradie) */
function renderRankTable(rank){
  let html=`<div class="final-standings" style="margin-top:18px"><div class="fs-title">Celkové poradie · rozhodujú výhry</div>
    <div class="rank-head"><span>#</span><span>Hráč</span><span>Zápasy</span><span>Hry</span><span>%</span></div>`;
  rank.forEach(s=>{
    const medal = s.place===1?'🥇':s.place===2?'🥈':s.place===3?'🥉':'';
    const top = s.place<=3 ? `top top${s.place}` : '';
    html+=`<div class="rank-row ${top}"><span class="rank-pl mono">${medal||s.place+'.'}</span>
      <span class="rank-name">${s.name}</span>
      <span class="mono">${s.wins}/${s.losses}</span>
      <span class="mono rank-games">${s.gw}:${s.gl}</span>
      <span class="mono rank-pct">${s.pct}%</span></div>`;
  });
  return html+`</div>`;
}

/* ── FINÁLNE VYHODNOTENIE TURNAJA ─────────────────────────────────── */
function dkoFlowFinished(dko){
  const gf1=dko?.GF?.[0], gf2=dko?.GF?.[1];
  if(!gf1?.winner) return false;
  return gf1.winner===1 || !!gf2?.winner;
}
function comboPhase2Finished(phase){
  if(!phase) return false;
  if(phase.kind==='standard-sko') return !!TM.champion(phase.bracket);
  if(phase.kind==='standard-dko') return dkoFlowFinished(phase.dko);
  if(phase.kind==='protected-sko') return !!(phase.main && TM.champion(phase.main));
  return false;
}
function tournamentFlowFinished(t){
  if(!t) return false;
  if(t.format==='sko') return !!TM.champion(t.bracket);
  if(t.format==='dko') return dkoFlowFinished(t.dko);
  if(t.format==='rr') return !!(t.rr?.matches?.length && t.rr.matches.every(m=>m.winner!=null));
  if(t.format==='rr_sko'||t.format==='rr_dko') return comboAllGroupsDone(t) && comboPhase2Finished(t.phase2);
  return false;
}
function phase2Ranking(t){
  const phase=t?.phase2;
  if(!phase) return [];
  if(phase.kind==='standard-sko') return TM.skoRanking(phase.bracket);
  if(phase.kind==='standard-dko') return TM.dkoRanking(phase.dko);
  if(phase.kind==='protected-sko'){
    if(!phase.main) return [];
    const mainRank=TM.skoRanking(phase.main);
    const mainNames=new Set(mainRank.map(r=>r.name));
    const prelimRank=TM.skoRanking(phase.prelim).filter(r=>!mainNames.has(r.name));
    const survivorCount=Number(phase.survivorCount||0);
    const normalizedPrelim=prelimRank.map(r=>({
      ...r,
      place:mainRank.length + Math.max(1,Number(r.place||1)-survivorCount)
    }));
    return [...mainRank,...normalizedPrelim].sort((a,b)=>a.place-b.place||a.seed-b.seed);
  }
  return [];
}
function collectPhase2Matches(phase){
  if(!phase) return [];
  if(phase.kind==='standard-sko') return phase.bracket.rounds.flat();
  if(phase.kind==='standard-dko') return [...phase.dko.W.flat(),...phase.dko.L.flat(),...phase.dko.GF];
  if(phase.kind==='protected-sko') return [...(phase.prelim?.rounds?.flat()||[]),...(phase.main?.rounds?.flat()||[])];
  return [];
}
function addFinalStatMatch(stat,m){
  if(!m?.winner||!m.p1||!m.p2||m.p1.bye||m.p2.bye) return;
  const win=m.winner===1?m.p1:m.p2, lose=m.winner===1?m.p2:m.p1;
  if(!stat[win.name]||!stat[lose.name]) return;
  const s1=Number(m.s1||0),s2=Number(m.s2||0),wg=Math.max(s1,s2),lg=Math.min(s1,s2);
  stat[win.name].wins++;stat[win.name].gw+=wg;stat[win.name].gl+=lg;
  stat[lose.name].losses++;stat[lose.name].gw+=lg;stat[lose.name].gl+=wg;
}
function comboTotalStats(t){
  const stat={};
  (t.players||[]).forEach(p=>stat[p.name]={wins:0,losses:0,gw:0,gl:0});
  (t.grp?.groups||[]).forEach(g=>(g.matches||[]).forEach(m=>addFinalStatMatch(stat,m)));
  collectPhase2Matches(t.phase2).forEach(m=>addFinalStatMatch(stat,m));
  Object.values(stat).forEach(s=>{
    s.gp=s.wins+s.losses;
    s.pct=(s.gw+s.gl)?Math.round(100*s.gw/(s.gw+s.gl)):0;
  });
  return stat;
}
function comboFinalRanking(t){
  if(!tournamentFlowFinished(t)) return [];
  const koRank=phase2Ranking(t), totalStats=comboTotalStats(t);
  const playerByName=new Map((t.players||[]).map(p=>[p.name,p]));
  const rankedNames=new Set(koRank.map(r=>r.name));
  const result=koRank.map(r=>{
    const p=playerByName.get(r.name)||{},s=totalStats[r.name]||r;
    return {id:p.id||null,name:r.name,seed:p.seed||r.seed,place:r.place,wins:s.wins||0,losses:s.losses||0,gw:s.gw||0,gl:s.gl||0,pct:s.pct||0,stage:'knockout'};
  });
  const eliminated=[];
  (t.grp?.groups||[]).forEach((g,gi)=>{
    rrTable(g.players,g.matches).forEach((s,idx)=>{
      if(rankedNames.has(s.name)) return;
      const p=playerByName.get(s.name)||{},all=totalStats[s.name]||{};
      eliminated.push({
        id:p.id||null,name:s.name,seed:p.seed||s.seed,group:g.name,groupIndex:gi,groupRank:idx+1,
        points:s.p,w:s.w,diff:s.gw-s.gl,pct:s.pct,
        wins:all.wins||0,losses:all.losses||0,gw:all.gw||0,gl:all.gl||0,totalPct:all.pct||0,stage:'group'
      });
    });
  });
  eliminated.sort((a,b)=>a.groupRank-b.groupRank||b.points-a.points||b.w-a.w||b.diff-a.diff||b.pct-a.pct||a.seed-b.seed);
  const base=result.length;
  let previousRank=null,currentPlace=base;
  eliminated.forEach((e,idx)=>{
    if(e.groupRank!==previousRank){currentPlace=base+idx+1;previousRank=e.groupRank;}
    result.push({...e,place:currentPlace,pct:e.totalPct});
  });
  return result;
}
function finalTournamentRanking(t){
  if(!tournamentFlowFinished(t)) return [];
  const playerByName=new Map((t.players||[]).map(p=>[p.name,p]));
  if(t.format==='rr_sko'||t.format==='rr_dko') return comboFinalRanking(t);
  if(t.format==='sko') return TM.skoRanking(t.bracket).map(r=>({...r,id:playerByName.get(r.name)?.id||null,stage:'knockout'}));
  if(t.format==='dko') return TM.dkoRanking(t.dko).map(r=>({...r,id:playerByName.get(r.name)?.id||null,stage:'knockout'}));
  if(t.format==='rr'){
    const rows=rrTable(t.players||[],t.rr?.matches||[]);
    return rows.map((r,i)=>({id:playerByName.get(r.name)?.id||null,name:r.name,seed:r.seed,place:i+1,wins:r.w,losses:r.l,gw:r.gw,gl:r.gl,pct:r.pct,stage:'round_robin'}));
  }
  return [];
}
function renderTournamentEvaluation(t){
  if(!tournamentFlowFinished(t) || t.format==='rr') return '';
  const rank=finalTournamentRanking(t);
  if(!rank.length) return '';
  let html=`<div class="final-standings" style="margin-top:22px">
    <div class="fs-title">KONEČNÉ PORADIE · ${rank.length} HRÁČOV</div>
    <div class="rank-head"><span>#</span><span>Hráč</span><span>V/P</span><span>Hry</span><span>%</span></div>`;
  rank.forEach(s=>{
    const medal=s.place===1?'🥇':s.place===2?'🥈':s.place===3?'🥉':'';
    const top=s.place<=3?`top top${s.place}`:'';
    const stage=s.stage==='group'&&s.group?` <span style="font-size:.67rem;color:var(--muted)">· skupina ${esc(s.group)}</span>`:'';
    html+=`<div class="rank-row ${top}">
      <span class="rank-pl mono">${medal||s.place+'.'}</span>
      <span class="rank-name">${esc(s.name)}${stage}</span>
      <span class="mono">${Number(s.wins||0)}/${Number(s.losses||0)}</span>
      <span class="mono rank-games">${Number(s.gw||0)}:${Number(s.gl||0)}</span>
      <span class="mono rank-pct">${Number(s.pct||0)}%</span>
    </div>`;
  });
  return html+`</div>`;
}

async function maybeAutoCompleteTournament(t){
  if(!t||isPublicReadOnly||t.status==='completed'||!tournamentFlowFinished(t)) return false;
  if(tournamentAutoCompletePromise) return tournamentAutoCompletePromise;
  tournamentAutoCompletePromise=(async()=>{
    try{
      const {data,error}=await cspAuth.client.rpc('complete_tournament',{p_tournament_id:t.id,p_results:finalResultsPayload(t)});
      if(error)throw error;
      if(data)Object.assign(t,data);
      t.status='completed';
      if(Array.isArray(t.phases))t.phases=t.phases.map(p=>({...p,status:'completed',completed_at:p.completed_at||new Date().toISOString()}));

      return true;
    }catch(err){
      console.error('[turnament] Automatic tournament completion failed:',err);
      return false;
    }finally{tournamentAutoCompletePromise=null;}
  })();
  return tournamentAutoCompletePromise;
}

/* Pomocná: tabuľka skupiny/RR z hráčov + zápasov */
function rrTable(players, matches){
  const tab={};
  players.forEach((p,i)=>tab[p.name]={name:p.name,seed:p.seed||i+1,w:0,l:0,gw:0,gl:0,p:0});
  matches.forEach(m=>{ if(m.winner){ const win=m.winner===1?m.p1:m.p2, lose=m.winner===1?m.p2:m.p1;
    const s1=m.s1||0,s2=m.s2||0, wgw=Math.max(s1,s2), lgw=Math.min(s1,s2);
    if(tab[win.name]){tab[win.name].w++;tab[win.name].p+=2;tab[win.name].gw+=wgw;tab[win.name].gl+=lgw;}
    if(tab[lose.name]){tab[lose.name].l++;tab[lose.name].gw+=lgw;tab[lose.name].gl+=wgw;} }});
  return Object.values(tab).map(s=>({...s,pct:(s.gw+s.gl)?Math.round(100*s.gw/(s.gw+s.gl)):0}))
    .sort((a,b)=>b.p-a.p||b.w-a.w||(b.gw-b.gl)-(a.gw-a.gl)||a.seed-b.seed);
}

function liveMatchElapsed(row){
  if(!row) return 0;
  let sec=Number(row.match_clock_elapsed_seconds||0);
  if((row.status==='live'||row.status==='in_progress')&&!row.match_clock_paused_at&&row.match_clock_started_at){
    sec+=Math.max(0,Math.floor((Date.now()-new Date(row.match_clock_started_at).getTime())/1000));
  }
  return sec;
}
function formatMatchClock(sec){
  sec=Math.max(0,Number(sec||0));
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=Math.floor(sec%60);
  return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
async function ensureRealMatch(loc,m){
  let row=realMatchesByKey.get(loc);
  if(row)return row;
  const p1Id=resolvePlayerId(m.p1),p2Id=resolvePlayerId(m.p2);
  const prefix=loc.split(':')[0],parts=loc.split(':');
  const isGroup=prefix==='grp';
  const phaseId=isGroup?curT.groupPhaseId:(prefix.startsWith('p2')?curT.knockoutPhaseId:curT.current_phase_id);
  const phaseSide=prefix==='p2W'?'W':prefix==='p2L'?'L':prefix==='p2F'?'GF':prefix==='W'?'W':prefix==='L'?'L':prefix==='F'?'GF':null;
  const roundNumber=(prefix==='grp'||prefix==='rr')?(m.round||null):((parts.length>1&&Number.isFinite(+parts[1]))?+parts[1]+1:null);
  const matchNumber=(parts.length>2&&Number.isFinite(+parts[2]))?+parts[2]+1:((parts.length>1&&Number.isFinite(+parts[1]))?+parts[1]+1:null);
  const payload={
    tournament_id:curT.id,phase_id:phaseId||null,round_key:loc,round_number:roundNumber,match_number:matchNumber,
    bracket_side:phaseSide,player1_id:p1Id,player2_id:p2Id,status:'pending'
  };
  // Never use an UPSERT here. A stale browser can be missing a match that
  // already exists in Postgres; upserting status:'pending' would then reopen
  // a completed match. Insert first and, on the unique round_key conflict,
  // fetch the already-authoritative row instead.
  const {data,error}=await cspAuth.client.from('matches').insert(payload).select('*').single();
  if(error){
    if(error.code!=='23505')throw error;
    const existing=await cspAuth.client.from('matches').select('*')
      .eq('tournament_id',curT.id).eq('round_key',loc).single();
    if(existing.error)throw existing.error;
    row=existing.data;
  }else row=data;
  realMatchesByKey.set(loc,row);return row;
}
async function refreshRealMatch(loc){
  const {data,error}=await cspAuth.client.from('matches').select('*').eq('tournament_id',curT.id).eq('round_key',loc).single();
  if(error)throw error;
  realMatchesByKey.set(loc,data);
  const area=document.getElementById('matchArea');if(area)area.innerHTML=renderMatchArea(curT);
  return data;
}
async function reloadRealMatches(){
  const {data,error}=await cspAuth.client.from('matches').select('*').eq('tournament_id',curT.id);
  if(error)throw error;
  realMatchesByKey=new Map((data||[]).map(row=>[row.round_key,row]));
  return data||[];
}
async function startLiveMatch(loc){
  if(isPublicReadOnly){ toast('Verejný náhľad je iba na čítanie.',true); return; }
  const m=getMatchByLoc(loc);if(!m)return;
  try{
    const row=await ensureRealMatch(loc,m),now=new Date().toISOString();
    if(row.status==='completed'||row.status==='forfeited'||row.winner_id||row.completed_at){
      toast('Ukončený zápas už nie je možné znovu spustiť.',true);return;
    }
    const payload={status:'live',match_clock_started_at:now,match_clock_paused_at:null,match_clock_stopped_at:null};
    if(!row.started_at)payload.started_at=now;
    const {error}=await cspAuth.client.from('matches').update(payload).eq('id',row.id).is('winner_id',null);
    if(error)throw error;await refreshRealMatch(loc);
  }catch(err){console.error('[turnament] start match:',err);toast('Zápas sa nepodarilo spustiť.',true);}
}
async function pauseLiveMatch(loc){
  if(isPublicReadOnly){ toast('Verejný náhľad je iba na čítanie.',true); return; }
  const row=realMatchesByKey.get(loc);if(!row)return;
  if(row.status!=='live'&&row.status!=='in_progress')return;
  try{
    const elapsed=liveMatchElapsed(row),now=new Date().toISOString();
    const {error}=await cspAuth.client.from('matches').update({status:'live',match_clock_elapsed_seconds:elapsed,match_clock_started_at:null,match_clock_paused_at:now}).eq('id',row.id);
    if(error)throw error;await refreshRealMatch(loc);
  }catch(err){console.error('[turnament] pause match:',err);toast('Zápas sa nepodarilo pozastaviť.',true);}
}
async function resumeLiveMatch(loc){
  if(isPublicReadOnly){ toast('Verejný náhľad je iba na čítanie.',true); return; }
  const row=realMatchesByKey.get(loc);if(!row)return;
  if((row.status!=='live'&&row.status!=='in_progress')||row.winner_id||row.completed_at)return;
  try{
    const {error}=await cspAuth.client.from('matches').update({status:'live',match_clock_started_at:new Date().toISOString(),match_clock_paused_at:null,match_clock_stopped_at:null}).eq('id',row.id);
    if(error)throw error;await refreshRealMatch(loc);
  }catch(err){console.error('[turnament] resume match:',err);toast('Zápas sa nepodarilo obnoviť.',true);}
}
async function stopLiveMatch(loc){
  if(isPublicReadOnly){ toast('Verejný náhľad je iba na čítanie.',true); return; }
  const row=realMatchesByKey.get(loc);if(!row)return;
  // A delayed click from stale UI must never reopen a match that was already
  // completed by the organizer or Scoreboard TE.
  if((row.status!=='live'&&row.status!=='in_progress')||row.winner_id||row.completed_at){
    await refreshRealMatch(loc);return;
  }
  try{
    const elapsed=liveMatchElapsed(row),now=new Date().toISOString();
    const {error}=await cspAuth.client.from('matches').update({status:'ready',match_clock_elapsed_seconds:elapsed,match_clock_started_at:null,match_clock_paused_at:null,match_clock_stopped_at:now})
      .eq('id',row.id).in('status',['live','in_progress']).is('winner_id',null).is('completed_at',null);
    if(error)throw error;await refreshRealMatch(loc);
  }catch(err){console.error('[turnament] stop match:',err);toast('Zápas sa nepodarilo zastaviť.',true);}
}

async function loadTournamentOperations(tournamentId){
  try{
    const {data,error}=await tournamentRpc('get_tournament_operations',{p_tournament_id:tournamentId});
    if(error)throw error;
    tournamentOperations=data||[];
    return tournamentOperations;
  }catch(err){
    console.error('[turnament] operations RPC load:',err);
    // Never turn a transient owner-RPC/auth error into "0 stations". The
    // active tournament resource rows are already public-readable under the
    // existing RLS policy, so use them as a read-only fallback.
    try{
      const {data,error}=await cspAuth.client.from('tournament_resources')
        .select('*').eq('tournament_id',tournamentId).eq('is_active',true)
        .order('resource_number',{ascending:true});
      if(error)throw error;
      const players=new Map((curT?.players||[]).map(p=>[p.id,p]));
      const matchesById=new Map([...realMatchesByKey.values()].map(m=>[m.id,m]));
      tournamentOperations=(data||[]).map(r=>{
        const m=r.current_match_id?matchesById.get(r.current_match_id):null;
        return {
          resource_id:r.id,resource_number:r.resource_number,resource_label:r.label,
          resource_type:r.resource_type,resource_status:r.status,
          operating_mode:r.operating_mode,automation_enabled:r.automation_enabled,
          tablet_name:r.tablet_name,tablet_last_seen_at:r.tablet_last_seen_at,
          tablet_online:!!r.tablet_last_seen_at&&(Date.now()-new Date(r.tablet_last_seen_at).getTime())<20000,
          device_token:r.device_token,match_id:m?.id||null,round_key:m?.round_key||null,
          match_status:m?.status||null,player1_id:m?.player1_id||null,
          player1_name:m?.player1_id?players.get(m.player1_id)?.name||null:null,
          player1_present:!!m?.player1_ready_at,player2_id:m?.player2_id||null,
          player2_name:m?.player2_id?players.get(m.player2_id)?.name||null:null,
          player2_present:!!m?.player2_ready_at,
          both_players_present:!!m?.player1_ready_at&&!!m?.player2_ready_at,
          started_at:m?.started_at||null
        };
      });
      return tournamentOperations;
    }catch(fallbackErr){
      console.error('[turnament] operations fallback load:',fallbackErr);
      // Preserve the last known-good station list. Losing connectivity must
      // not visually delete configured stations during a live tournament.
      return tournamentOperations;
    }
  }
}

async function createOperationsResources(){

  const type=document.getElementById('opsType')?.value||'table';
  const max=tournamentOperations.reduce((m,r)=>Math.max(m,Number(r.resource_number||0)),0);

async function assignMatchResource(loc,resourceId){

function liveMatchControls(m,loc){
  const row=realMatchesByKey.get(loc);
  const status=row?.status||'pending';
  const isClosed=status==='completed'||status==='forfeited'||!!row?.winner_id||!!row?.completed_at;
  const isLive=status==='live'||status==='in_progress';
  const isPaused=isLive && !!row?.match_clock_paused_at;
  const wasStopped=!isClosed&&!!row?.match_clock_stopped_at&&!isLive;
  const state=isClosed?'closed':isPaused?'paused':isLive?'running':wasStopped?'stopped':'pending';
  const statusLabel=state==='closed'?'UKONČENÝ':state==='running'?'PREBIEHA':state==='paused'?'PAUZA':state==='stopped'?'ZASTAVENÝ':'NEZAČAL';
  const elapsed=liveMatchElapsed(row);
  let buttons='';
  if(state==='pending'||state==='stopped')buttons+=`<button class="match-op start" onclick="event.stopPropagation();startLiveMatch('${loc}')">▶ Štart</button>`;
  if(state==='running')buttons+=`<button class="match-op" onclick="event.stopPropagation();pauseLiveMatch('${loc}')">⏸ Pauza</button><button class="match-op stop" onclick="event.stopPropagation();stopLiveMatch('${loc}')">⏹ Stop</button>`;
  if(state==='paused')buttons+=`<button class="match-op start" onclick="event.stopPropagation();resumeLiveMatch('${loc}')">▶ Pokračovať</button><button class="match-op stop" onclick="event.stopPropagation();stopLiveMatch('${loc}')">⏹ Stop</button>`;
  if(!isClosed)buttons+=`<button class="match-op qr" onclick="event.stopPropagation();showMatchQr('${loc}')">▦ Tablet</button>`;
  const resourceOptions=tournamentOperations.map(r=>`<option value="${r.resource_id}" ${row?.tournament_resource_id===r.resource_id?'selected':''} ${r.match_id&&r.match_id!==row?.id?'disabled':''}>${esc(r.resource_label)} · ${r.operating_mode==='smart'?'SMART':'MANUAL'}</option>`).join('');
  return `<div class="match-livebar" onclick="event.stopPropagation()">

}

function matchRow(m, loc){
  const bye = (m.p1&&m.p1.bye)||(m.p2&&m.p2.bye);
  const name=(p)=> p? (p.bye?'<span class="mt-bye">(VO)</span>':`${esc(p.name)}${isLinkedCspPlayer(p)?'<span class="csp-player-badge linked">CSP ✓</span>':''}`) : '<span class="mt-wait">čaká na postup</span>';
  const done = m.winner!=null && !bye;
  const w1=m.winner===1, w2=m.winner===2;
  const row=realMatchesByKey.get(loc);
  const running=row?.status==='live'||row?.status==='in_progress';
  const assignedResource=row?.tournament_resource_id?tournamentOperations.find(r=>r.resource_id===row.tournament_resource_id):null;
  const smartAssigned=assignedResource?.operating_mode==='smart';
  const hasDbScore=row&&(row.score1!=null||row.score2!=null);
  // SMART matches always expose their score in the organizer list, even at
  // 0:0. Manual/unassigned matches keep the old "vs" until a score exists.
  const showLiveScore=!bye&&(running||smartAssigned||hasDbScore);
  const score = done ? `<span class="mt-score mono">${m.s1??'–'}:${m.s2??'–'}</span>` : showLiveScore ? `<span class="mt-score mono">${row?.score1??0}:${row?.score2??0}</span>` : (bye?`<span class="mt-bye">postup</span>`:`<span class="mt-vs">vs</span>`);
  const clickable = !isPublicReadOnly && !bye && m.p1 && m.p2 && !(m.p1.bye)&&!(m.p2.bye);
  const liveClass=(row?.status==='live'||row?.status==='in_progress')?(row?.match_clock_paused_at?'live-paused':'live-running'):(row?.match_clock_stopped_at?'live-stopped':'');
  return `<div class="match-wrap ${liveClass}" data-match-loc="${esc(loc)}">
    <div class="match-row ${done?'done':''} ${clickable?'clickable':''}" ${clickable?`onclick="openMatch('${loc}')"`:''}>
      <span class="mt-key mono">${m.key}</span>
      <span class="mt-side ${w1?'win':''}">${name(m.p1)}</span>
      ${score}
      <span class="mt-side right ${w2?'win':''}">${name(m.p2)}</span>
      ${done?'<span class="mt-check">✓</span>':(clickable?'<span class="mt-edit">›</span>':'')}
    </div>
    ${clickable && !isPublicReadOnly?liveMatchControls(m,loc):''}
  </div>`;
}

/* ── Zadanie výsledku (loc-based) ── */
let editLoc=null;
function getMatchByLoc(loc){
  const [k,a,b]=loc.split(':');
  if(k==='rr') return curT.rr.matches[+a];
  if(k==='sko') return curT.bracket.rounds[+a][+b];
  if(k==='W') return curT.dko.W[+a][+b];
  if(k==='L') return curT.dko.L[+a][+b];
  if(k==='F') return curT.dko.GF[+b];
  if(k==='grp') return curT.grp.groups[+a].matches[+b];
  if(k==='p2s') return curT.phase2.bracket.rounds[+a][+b];
  if(k==='p2p') return curT.phase2.prelim.rounds[+a][+b];
  if(k==='p2m') return curT.phase2.main.rounds[+a][+b];
  if(k==='p2W') return curT.phase2.dko.W[+a][+b];
  if(k==='p2L') return curT.phase2.dko.L[+a][+b];
  if(k==='p2F') return curT.phase2.dko.GF[+b];
  return null;
}
function recomputeFor(loc){
  const k=loc.split(':')[0];
  if(k==='sko') TM.recomputeSKO(curT.bracket);
  else if(k==='W'||k==='L'||k==='F') TM.recomputeDKO(curT.dko);
  else if(k==='p2s') TM.recomputeSKO(curT.phase2.bracket);
  else if(k==='p2p') TM.recomputeSKO(curT.phase2.prelim);
  else if(k==='p2m') TM.recomputeSKO(curT.phase2.main);
  else if(k==='p2W'||k==='p2L'||k==='p2F') TM.recomputeDKO(curT.phase2.dko);
  // rr, grp: bez posunu (tabuľka sa prepočíta pri renderi)
}

/* ── Real matches table persistence ──────────────────────────────────
   Player self-confirmation columns/RLS from migration 0004 exist in the
   schema, but there is no player-self-registration/login flow built yet
   for players to actually use them -- NOT built here. This is strictly
   "organizer enters the score via the existing modal, it saves for
   real" using the owner-only write path migration 0003 already grants. */

// Defensive fallback: bracket objects built before this feature shipped
// (already-saved database bracket state) may have player objects without an
// `id` yet, since ensureBracket() only rebuilds the bracket from scratch
// when no database state exists. Falls back to matching by name against
// curT.players (always fresh from the DB) -- the same "name is the
// unique key" assumption every ranking/standings function in this file
// already relies on (rankFrom, rrTable, etc.).
function resolvePlayerId(p){
  if(!p) return null;
  if(p.id) return p.id;
  const found=(curT.players||[]).find(x=>x.name===p.name);
  return found ? found.id : null;
}

// Replays already-saved real match rows onto a freshly-rebuilt bracket
// (used in viewDetail() when this browser has no local bracket state
// yet). Reuses getMatchByLoc() -- the same canonical loc resolver the
// rest of the engine already uses -- rather than re-deriving loc/round_key
// construction a second time.
//
// Winner is derived from the ROW's OWN saved player1_id/player2_id/
// winner_id, NOT from the match object's current in-memory p1/p2. For
// later rounds (e.g. the final), p1/p2 are still null at this point --
// they only get filled in once recomputeSKO()/recomputeDKO() cascades
// advancement from earlier rounds' winners, which the caller (viewDetail)
// runs right after this.
//
// Deliberately NOT setting resultSig here: recomputeSKO/DKO's own
// "participants changed since this result was recorded -> invalidate"
// check (`if(m.resultSig && m.resultSig!==matchSig(m))`) compares against
// the CURRENT p1/p2 -- which for later rounds is still null at this exact
// moment. Stamping resultSig now would make that very same recompute call
// see a mismatch the instant it propagates the real p1/p2 in, and wipe
// the winner right back out. Leaving resultSig unset (falsy) makes that
// check a no-op here; finalizeAppliedMatches() below stamps it correctly
// afterward, once every match's p1/p2 reflects real advancement.
function applyRealMatches(matchRows){
  matchRows.forEach(row=>{
    if(row.status!=='completed' || row.score1==null || row.score2==null) return;
    const m=getMatchByLoc(row.round_key);
    if(!m) return; // stale row from a shape that no longer exists (e.g. after an edit)
    m.s1=row.score1; m.s2=row.score2;
    m.winner = row.winner_id===row.player1_id ? 1 : (row.winner_id===row.player2_id ? 2 : null);
  });
}
// Second pass, called by the caller after its recomputeSKO()/recomputeDKO()
// -- see applyRealMatches() above for why this has to be separate.
function finalizeAppliedMatches(matchRows){
  matchRows.forEach(row=>{
    if(row.status!=='completed' || row.score1==null || row.score2==null) return;
    const m=getMatchByLoc(row.round_key);
    if(m && m.winner) m.resultSig=TM.matchSig(m);
  });
}

// upsert on (tournament_id, round_key) -- migration 0003's unique
// constraint. round_key is the same opaque `loc` string already used to
// address this match in-memory (see the investigation notes in the task
// summary for why this differs from migration 0003's own example
// convention, and why reusing it directly is still correct: SQL never
// parses round_key, it's opaque by design).
async function saveMatchToDB(loc, m){
  const p1Id=resolvePlayerId(m.p1), p2Id=resolvePlayerId(m.p2);
  const prefix=loc.split(':')[0];
  const isGroup=prefix==='grp';
  const phaseId=isGroup ? curT.groupPhaseId : ((prefix.startsWith('p2')) ? curT.knockoutPhaseId : curT.current_phase_id);
  const phaseSide=prefix==='p2W'?'W':prefix==='p2L'?'L':prefix==='p2F'?'GF':prefix==='W'?'W':prefix==='L'?'L':prefix==='F'?'GF':null;
  const parts=loc.split(':');
  const roundNumber=(prefix==='grp'||prefix==='rr') ? (m.round||null) : ((parts.length>1 && Number.isFinite(+parts[1])) ? +parts[1]+1 : null);
  const matchNumber=(parts.length>2 && Number.isFinite(+parts[2])) ? +parts[2]+1 : ((parts.length>1 && Number.isFinite(+parts[1])) ? +parts[1]+1 : null);

  // A match assigned to a Tournament Edition resource already has a real
  // `matches` row. Complete it through one database transaction so saving
  // the result also releases the table/station immediately. The scoreboard
  // TE uses the equivalent complete_scoreboard_match() flow.
  const assignedRow=realMatchesByKey.get(loc);
  if(assignedRow?.id && assignedRow.tournament_resource_id){
    const {data,error}=await cspAuth.client.rpc('complete_organizer_match',{
      p_match_id:assignedRow.id,
      p_score1:m.s1,
      p_score2:m.s2,
      p_winner_id:m.winner===1 ? p1Id : p2Id
    });
    if(error)throw error;
    if(data)realMatchesByKey.set(loc,data);
    return;
  }

  const { error } = await cspAuth.client.from('matches').upsert({
    tournament_id: curT.id,
    phase_id: phaseId||null,
    round_key: loc,
    round_number: roundNumber,
    match_number: matchNumber,
    bracket_side: phaseSide,
    player1_id: p1Id,
    player2_id: p2Id,
    score1: m.s1,
    score2: m.s2,
    winner_id: m.winner===1 ? p1Id : p2Id,
    status: 'completed',
  }, { onConflict: 'tournament_id,round_key' });
  if(error) throw error;
  try{
    const {data}=await cspAuth.client.from('matches').select('*').eq('tournament_id',curT.id).eq('round_key',loc).single();
    if(data) realMatchesByKey.set(loc,data);
  }catch(e){}
}
// Resets the row rather than deleting it -- migration 0003 deliberately
// granted no DELETE on matches ("corrected via UPDATE, not removed,
// until a later prompt decides deletion is actually needed"), confirmed
// by its own grant statement (select/insert/update only). A no-op if the
// row was never saved in the first place.
async function clearMatchInDB(loc){
  const { error } = await cspAuth.client.from('matches')
    .update({ score1: null, score2: null, winner_id: null, status: 'pending' })
    .eq('tournament_id', curT.id).eq('round_key', loc);
  if(error) throw error;
}
function openMatch(loc){
  if(isPublicReadOnly){ toast('Verejný náhľad je iba na čítanie.',true); return; }
  const m=getMatchByLoc(loc);
  if(!m || !m.p1 || !m.p2 || m.p1.bye || m.p2.bye) return;
  editLoc=loc;
  document.getElementById('matchModalArea').innerHTML=`
    <div class="overlay" onclick="closeMatch(event)">
      <div class="match-modal" onclick="event.stopPropagation()">
        <div class="mm-key mono">${m.key}</div>
        <div class="mm-players">
          <div class="mm-p"><div class="mm-name">${m.p1.name}</div><input type="number" id="mmS1" min="0" value="${m.s1??''}" placeholder="0"/></div>
          <div class="mm-x">:</div>
          <div class="mm-p"><div class="mm-name">${m.p2.name}</div><input type="number" id="mmS2" min="0" value="${m.s2??''}" placeholder="0"/></div>
        </div>
        <div class="mm-quick">
          <button onclick="quickWin(1)">Vyhral ${m.p1.name.split(' ')[0]}</button>
          <button onclick="quickWin(2)">Vyhral ${m.p2.name.split(' ')[0]}</button>
        </div>
        <div class="mm-actions">
          ${m.winner?`<button class="btn btn-ghost btn-danger" onclick="clearMatch()">Vymazať výsledok</button>`:'<span></span>'}
          <button class="btn btn-green" onclick="saveMatch()">Uložiť výsledok</button>
        </div>
      </div>
    </div>`;
  setTimeout(()=>{const e=document.getElementById('mmS1'); if(e) e.focus();},40);
}
function closeMatch(e){ if(e&&e.target&&!e.target.classList.contains('overlay')) return; document.getElementById('matchModalArea').innerHTML=''; editLoc=null; }
function quickWin(side){
  const a=document.getElementById('mmS1'), b=document.getElementById('mmS2');
  if(side===1){ a.value=Math.max(1,+a.value||1); b.value=Math.min(+a.value-1,+b.value||0);} 
  else { b.value=Math.max(1,+b.value||1); a.value=Math.min(+b.value-1,+a.value||0);} 
}
async function saveMatch(){
  const m=getMatchByLoc(editLoc);
  const s1=+document.getElementById('mmS1').value, s2=+document.getElementById('mmS2').value;
  if(isNaN(s1)||isNaN(s2)){ toast('Zadaj skóre oboch hráčov.',true); return; }
  if(s1===s2){ toast('Skóre nemôže byť nerozhodné — určí víťaza.',true); return; }
  // Bracket-advancement logic (recomputeFor) is completely unchanged --
  // it runs exactly as before, on the same local m/curT state. Only the
  // real DB write below is new.
  m.s1=s1; m.s2=s2; m.winner=s1>s2?1:2; m.resultSig=TM.matchSig(m);
  recomputeFor(editLoc);
  // Group result may have completed the final pending group match, or a
  // protected preliminary round may have produced its required survivors.
  // This is deliberately automatic: no separate \"generate\" click.
  maybeGenerateComboPhase(curT);
  const savedLoc=editLoc, savedM=m;
  closeMatch();
  document.getElementById('matchArea').innerHTML=renderMatchArea(curT);
  toast('Výsledok uložený ✓');

  try {
    await cspAuth.withTimeout(saveMatchToDB(savedLoc, savedM), 8000, 'save match');
    // Persist advancement only after the authoritative match write succeeded.
    // This prevents bracket_state from getting ahead of `matches` when a DB
    // write is rejected. Then reload both sources that drive station selects,
    // so a released table is immediately usable in the next round.
    const bracketSaved=await cspAuth.withTimeout(persistT(),8000,'save bracket state');
    if(!bracketSaved)throw new Error('Bracket state was not saved');
    await reloadRealMatches();
    await loadTournamentOperations(curT.id);
    document.getElementById('matchArea').innerHTML=renderMatchArea(curT);
    if(savedLoc.split(':')[0]==='grp' && comboAllGroupsDone(curT)){
      await cspAuth.withTimeout(syncComboPhaseTransition(curT), 10000, 'complete group phase');
      document.getElementById('matchArea').innerHTML=renderMatchArea(curT);
      setTimeout(()=>{
        const phaseBanner=document.querySelector('#matchArea .branch-label.win');
        if(phaseBanner) phaseBanner.scrollIntoView({behavior:'smooth',block:'start'});
      },80);
    }
    await maybeAutoCompleteTournament(curT);
    document.getElementById('matchArea').innerHTML=renderMatchArea(curT);
  } catch(err){
    console.error('[turnament] Failed to save match/transition:', err);
    toast('Výsledok alebo prechod fázy sa neuložil do databázy.', true);
  }
}
async function clearMatch(){
  const m=getMatchByLoc(editLoc); m.s1=null;m.s2=null;m.winner=null;m.resultSig=null;
  const clearedLoc=editLoc;
  recomputeFor(clearedLoc);
  // A group result no longer being final invalidates every generated phase
  // 2 slot. Likewise, clearing a protected preliminary result invalidates
  // its already-built main bracket. They will regenerate automatically
  // once the necessary results are complete again.
  if(clearedLoc.split(':')[0]==='grp') delete curT.phase2;
  else if(clearedLoc.split(':')[0]==='p2p' && curT.phase2 && curT.phase2.kind==='protected-sko') curT.phase2.main=null;
  persistT();
  const savedLoc=editLoc;
  closeMatch();
  document.getElementById('matchArea').innerHTML=renderMatchArea(curT);
  toast('Výsledok vymazaný');

  try {
    await cspAuth.withTimeout(clearMatchInDB(savedLoc), 8000, 'clear match');
  } catch(err){
    console.error('[turnament] Failed to clear match in the real matches table:', err);
  }
}
