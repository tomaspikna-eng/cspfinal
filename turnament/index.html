<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CSP Tournament Manager</title>
<meta name="description" content="Connect Sports Pro — správa turnajov: Round Robin, Single KO, Double KO a kombinácie."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="/assets/csp-auth.js"></script>
<script src="/assets/csp-social.js"></script>
<script src="/assets/csp-translate.js" defer></script>
<style>
:root{
  --bg:#08080c;--bg-2:#0c0c12;--card:#13131a;--card-2:#181820;
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.05);
  --fg:#f4f4f6;--muted:#82828e;--muted-2:#a2a2ae;
  --gold:#d4a843;--gold-soft:#a8862e;--gold-dim:rgba(212,168,67,.12);--gold-b:rgba(212,168,67,.32);
  --green:#26d07d;--green-dark:#06230f;--green-dim:rgba(38,208,125,.14);
  --red:#e35149;--red-dim:rgba(227,81,73,.14);
  --blue:#5aa9e6;
  --radius:14px;--font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--fg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;background:var(--bg-2);border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:11px 13px;font-size:14px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--gold)}
.hidden{display:none!important}
.mono{font-family:var(--mono)}

/* ── TOPBAR ── */
.topbar{position:sticky;top:0;z-index:40;background:rgba(8,8,12,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1200px;margin:0 auto;padding:0 22px;height:62px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{width:34px;height:34px;border-radius:9px;display:block;object-fit:cover;box-shadow:0 4px 12px rgba(212,168,67,.2)}
.brand-word{font-weight:800;font-size:.96rem}.brand-word .g{color:var(--gold)}.brand-word .w{color:#fff}
.brand-sub{font-family:var(--mono);font-size:.58rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);display:block;margin-top:1px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.plan-chip{font-family:var(--mono);font-size:.6rem;font-weight:700;letter-spacing:.1em;background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#1a1000;padding:4px 9px;border-radius:6px}
.tb-user{display:flex;align-items:center;gap:8px;font-size:.84rem;font-weight:600;color:var(--muted-2)}
.tb-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-soft));display:flex;align-items:center;justify-content:center;color:#1a1000;font-weight:800;font-size:.78rem}
.link-btn{font-size:.82rem;font-weight:600;color:var(--muted-2)}.link-btn:hover{color:var(--gold)}

.wrap{max-width:1200px;margin:0 auto;padding:32px 22px 70px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:10px;font-weight:700;font-size:.9rem;transition:.14s;border:1px solid var(--line)}
.btn-primary{background:var(--gold);border-color:var(--gold);color:#1a1000}.btn-primary:hover{background:#e3bd57}
.btn-green{background:var(--green);border-color:var(--green);color:var(--green-dark)}.btn-green:hover{background:#33dd8a}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}

/* ── GATE (landing / access) ── */
.gate{min-height:calc(100vh - 62px);display:flex;align-items:center;justify-content:center;padding:40px 22px}
.gate-card{max-width:540px;text-align:center}
.gate-icon{font-size:3.4rem;margin-bottom:18px}
.gate h1{font-size:2.4rem;font-weight:900;letter-spacing:-.02em;line-height:1.05}
.gate h1 .g{color:var(--gold)}
.gate .lead{color:var(--muted-2);font-size:1.05rem;margin-top:14px;line-height:1.6}
.gate-features{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:26px 0}
.gate-feat{font-size:.8rem;font-weight:600;color:var(--muted-2);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 14px}
.gate-cta{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:8px}
.gate-cta .btn{width:100%;max-width:300px;font-size:.95rem;padding:14px}
.gate-note{font-size:.78rem;color:var(--muted);margin-top:6px}
.demo-login{margin-top:28px;padding-top:20px;border-top:1px solid var(--line-2)}
.demo-login button{font-size:.78rem;color:var(--muted);text-decoration:underline}
.demo-login button:hover{color:var(--gold)}

/* ── TGATE — nový úvodný (nezalogovaný) screen s animovaným pavúkom ── */
.tgate{min-height:calc(100vh - 62px);padding:56px 22px 40px}
.tgate-in{max-width:1180px;margin:0 auto}
.tgate-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
@media(max-width:940px){.tgate-grid{grid-template-columns:1fr}}
.tgate-eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;color:var(--gold);font-weight:700;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:9px}
.tgate-eyebrow::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-dim)}
.tgate h1{font-size:clamp(2.2rem,4.4vw,3.4rem);font-weight:900;letter-spacing:-.02em;line-height:1.03}
.tgate h1 .g{color:var(--gold)}
.tgate .lead{color:var(--muted-2);font-size:1.05rem;margin-top:18px;max-width:480px;line-height:1.6}
.tgate-features{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}
.tgate-cta{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.tgate-note{font-size:.78rem;color:var(--muted);margin-top:12px}
.tgate-demo{margin-top:22px}
.tgate-demo button{font-size:.78rem;color:var(--muted);text-decoration:underline}
.tgate-demo button:hover{color:var(--gold)}

.bracket-wrap{position:relative;aspect-ratio:6/5;border-radius:18px;background:radial-gradient(ellipse at 70% 20%,rgba(212,168,67,.07),transparent 60%),var(--card);border:1px solid var(--line);overflow:hidden}
.bracket-wrap svg{width:100%;height:100%;display:block}
.br-box{fill:var(--card-2);stroke:var(--line)}
.br-box.live{stroke:var(--green);stroke-width:1.4}
.br-name{font-family:var(--mono);font-size:9px;fill:var(--muted-2)}
.br-name.win{fill:var(--fg);font-weight:700}
.br-line{stroke:var(--gold);stroke-opacity:.35;stroke-width:1.2;fill:none}
.br-flow{stroke:var(--gold);stroke-width:1.6;fill:none;stroke-dasharray:5 6;animation:brflow 1.4s linear infinite}
@keyframes brflow{to{stroke-dashoffset:-22}}
.br-live-dot{animation:brpulse 1.8s ease-in-out infinite}
@keyframes brpulse{0%,100%{opacity:.5;r:3.2}50%{opacity:1;r:5}}
.br-trophy{animation:brglow 2.6s ease-in-out infinite}
@keyframes brglow{0%,100%{opacity:.75}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.br-flow,.br-live-dot,.br-trophy{animation:none}}
.bracket-caption{position:absolute;left:16px;bottom:14px;font-family:var(--mono);font-size:.64rem;color:var(--muted);letter-spacing:.03em}
.bracket-caption b{color:var(--green)}

.tgate-statement{text-align:center;padding:46px 0 6px;font-size:clamp(1.2rem,2.4vw,1.6rem);font-weight:800;color:var(--muted-2);max-width:760px;margin:0 auto}
.tgate-statement .g{color:var(--gold)}

/* upgrade prompt */
.upsell{max-width:480px;text-align:center}
.upsell .badge{display:inline-block;font-family:var(--mono);font-size:.66rem;font-weight:700;letter-spacing:.12em;background:var(--gold-dim);color:var(--gold);padding:6px 12px;border-radius:7px;margin-bottom:16px}

/* ── DASHBOARD ── */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-head h1{font-size:1.8rem;font-weight:800}
.page-head p{color:var(--muted);font-size:.9rem;margin-top:3px}
.social-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-8px 0 22px}.social-like.liked{background:var(--green-dim);border-color:rgba(38,208,125,.45);color:var(--green)}
.t-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.t-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;transition:.15s}
.t-card:hover{border-color:var(--gold-b);transform:translateY(-2px)}
.t-del{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.9rem;opacity:0;transition:.13s;color:var(--muted)}
.t-card:hover .t-del{opacity:.7}
.t-del:hover{opacity:1!important;background:var(--red-dim);color:var(--red)}
.btn-danger:hover{border-color:var(--red);color:var(--red);background:var(--red-dim)}

/* detail */
.detail-grid{display:grid;grid-template-columns:340px 1fr;gap:22px;align-items:start}
@media(max-width:820px){.detail-grid{grid-template-columns:1fr}}
.detail-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.dc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dc-head h3{font-size:.96rem;font-weight:800}
.match-view-switch{display:flex;align-items:center;gap:3px;padding:3px;background:var(--bg-2);border:1px solid var(--line);border-radius:10px}
.match-view-btn{padding:7px 11px;border-radius:7px;font-size:.72rem;font-weight:800;color:var(--muted);white-space:nowrap}
.match-view-btn.active{background:var(--green);color:#04150b}
.bracket-scroll{overflow-x:auto;padding:3px 2px 14px}
.bracket-grid{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:18px;min-width:max-content;align-items:start}
.bracket-column{display:flex;flex-direction:column;gap:12px;min-width:210px}
.bracket-column-title{font-family:var(--mono);font-size:.68rem;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;padding-bottom:8px;border-bottom:1px solid var(--gold-b)}
.bracket-column-matches{display:flex;flex-direction:column;justify-content:space-around;gap:12px;min-height:100%}
.bracket-match{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg-2);overflow:hidden;cursor:pointer;transition:.12s}
.bracket-match:hover{border-color:var(--gold-b);transform:translateY(-1px)}
.bracket-match.disabled{cursor:default;opacity:.72}.bracket-match.disabled:hover{transform:none;border-color:var(--line)}
.bracket-match-key{padding:5px 9px;background:rgba(255,255,255,.025);font-family:var(--mono);font-size:.58rem;color:var(--muted)}
.bracket-player{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 9px;font-size:.78rem;font-weight:700;border-top:1px solid var(--line-2)}
.bracket-player.win{color:var(--green)}.bracket-score{font-family:var(--mono);color:var(--gold)}
.bracket-branch{font-size:.76rem;font-weight:900;color:var(--muted-2);margin:16px 0 9px;text-transform:uppercase;letter-spacing:.06em}
@media(max-width:620px){.dc-head.match-head{align-items:flex-start;gap:10px;flex-direction:column}.match-view-switch{width:100%}.match-view-btn{flex:1}}

/* match list */
.champ-banner{background:linear-gradient(135deg,var(--gold-dim),rgba(212,168,67,.04));border:1px solid var(--gold-b);border-radius:11px;padding:14px 16px;font-size:1rem;margin-bottom:16px;text-align:center}
.champ-banner b{color:var(--gold)}
.round-block{margin-bottom:18px}
.round-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px 8px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.round-name{font-weight:800;font-size:.92rem}
.round-code{font-size:.66rem;color:var(--muted);background:var(--bg-2);padding:2px 7px;border-radius:5px}
.rr-round-label{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 6px}
.match-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--card);transition:.12s}
.match-row.clickable{cursor:pointer}
.match-row.clickable:hover{border-color:var(--gold-b);background:var(--card-2)}
.match-row.done{border-color:rgba(38,208,125,.25)}
.match-row .mt-key{font-size:.68rem;color:var(--muted);width:48px;flex-shrink:0}
.match-row .mt-side{flex:1;font-size:.86rem;font-weight:600}
.match-row .mt-side.right{text-align:right}
.match-row .mt-side.win{color:var(--green);font-weight:800}
.match-row .mt-vs{color:var(--muted);font-size:.74rem}
.match-row .mt-score{font-size:.84rem;font-weight:800;color:var(--fg);min-width:44px;text-align:center}
.match-row .mt-bye{color:var(--muted);font-size:.74rem;font-style:italic}
.match-row .mt-wait{color:var(--muted);font-size:.78rem;font-style:italic}
.match-row .mt-check{color:var(--green);font-weight:800;width:14px}
.match-row .mt-edit{color:var(--muted);font-size:1.1rem;width:14px}

/* standings */
.standings{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:6px}
.st-head,.st-row{display:grid;grid-template-columns:32px 1fr 36px 36px 48px;gap:8px;padding:9px 12px;align-items:center;font-size:.84rem}
.st-head{background:var(--bg-2);font-family:var(--mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.st-row{border-top:1px solid var(--line-2)}
.st-row span:nth-child(2){font-weight:600}
.st-head2,.st-row2{display:grid;grid-template-columns:30px 1fr 32px 32px 60px 44px 44px;gap:6px;padding:9px 12px;align-items:center;font-size:.82rem}
.st-head2{background:var(--bg-2);font-family:var(--mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
.st-row2{border-top:1px solid var(--line-2)}
.st-row2 span:nth-child(2){font-weight:600}
.st-row2.adv{background:rgba(38,208,125,.06)}
.adv-tag{font-family:var(--mono);font-size:.56rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--green-dim);color:var(--green);padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:middle}

/* result modal */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.match-modal{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.mm-key{text-align:center;font-size:.74rem;color:var(--gold);margin-bottom:18px;letter-spacing:.1em}
.mm-players{display:flex;align-items:flex-end;gap:14px}
.mm-p{flex:1;text-align:center}
.mm-name{font-weight:700;font-size:.95rem;margin-bottom:10px;min-height:2.4em;display:flex;align-items:center;justify-content:center}
.mm-p input{text-align:center;font-size:1.6rem;font-weight:800;font-family:var(--mono);padding:12px}
.mm-x{font-size:1.6rem;font-weight:800;color:var(--muted);padding-bottom:14px}
.mm-quick{display:flex;gap:8px;margin-top:16px}
.mm-quick button{flex:1;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:.78rem;font-weight:600;color:var(--muted-2)}
.mm-quick button:hover{border-color:var(--gold);color:var(--gold)}
.mm-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}

/* DKO branches + final standings */
.branch-label{font-weight:800;font-size:.82rem;padding:8px 12px;border-radius:9px;margin:16px 0 12px}
.branch-label.win{background:var(--green-dim);color:var(--green)}
.branch-label.lose{background:var(--red-dim);color:var(--red)}
.branch-label.conv{background:var(--gold-dim);color:var(--gold)}
.final-standings{background:linear-gradient(135deg,var(--gold-dim),transparent);border:1px solid var(--gold-b);border-radius:12px;padding:16px;margin-bottom:18px}
.fs-title{font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.fs-row{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-2)}
.fs-row:last-child{border-bottom:none}
.fs-place{font-size:1.1rem;width:32px;text-align:center}
.fs-name{font-weight:700;font-size:.95rem}
.rank-head,.rank-row{display:grid;grid-template-columns:44px 1fr 62px 60px 48px;gap:8px;align-items:center;padding:8px 0;font-size:.85rem}
.rank-head{font-family:var(--mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:4px}
.rank-row{border-bottom:1px solid var(--line-2)}
.rank-row:last-child{border-bottom:none}
.rank-pl{font-weight:700}
.rank-name{font-weight:600}
.rank-games{color:var(--muted)}
.rank-pct{color:var(--gold)}
.rank-row.top{border-radius:9px;margin:2px 0;padding:11px 10px;border-bottom:none}
.rank-row.top .rank-pl{font-size:1.15rem}
.rank-row.top .rank-name{font-weight:800;font-size:1rem}
.rank-row.top1{background:linear-gradient(90deg,rgba(212,168,67,.22),rgba(212,168,67,.04));border:1px solid var(--gold-b)}
.rank-row.top2{background:linear-gradient(90deg,rgba(190,190,200,.16),transparent);border:1px solid rgba(200,200,210,.22)}
.rank-row.top3{background:linear-gradient(90deg,rgba(205,127,50,.16),transparent);border:1px solid rgba(205,127,50,.28)}
.rank-row.top1 .rank-name{color:var(--gold)}
.t-card .fmt{display:inline-block;font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--gold-dim);color:var(--gold);margin-bottom:12px}
.t-card h3{font-size:1.15rem;font-weight:800;line-height:1.2}
.t-card .meta{display:flex;gap:14px;margin-top:12px;font-size:.78rem;color:var(--muted)}
.t-card .meta b{color:var(--muted-2);font-weight:700}
.t-new{background:var(--card);border:1.5px dashed var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:150px;color:var(--muted-2)}
.t-new:hover{border-color:var(--gold);color:var(--gold)}
.t-new .plus{font-size:2rem;margin-bottom:6px}
.empty{text-align:center;padding:60px 20px;color:var(--muted-2)}

/* ── WIZARD ── */
.wiz{max-width:640px;margin:0 auto}
.wiz-steps{display:flex;gap:8px;margin-bottom:28px}
.wiz-step{flex:1;height:4px;border-radius:99px;background:var(--line)}
.wiz-step.done{background:var(--gold)}
.wiz-step.active{background:var(--gold);box-shadow:0 0 12px var(--gold-b)}
.wiz-panel h2{font-size:1.5rem;font-weight:800;margin-bottom:4px}
.wiz-panel .sub{color:var(--muted);font-size:.88rem;margin-bottom:22px}
.field{margin-bottom:18px}
.field label{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:7px}
.field .hint{font-size:.76rem;color:var(--muted);margin-top:6px}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opt-grid{grid-template-columns:1fr}}
.opt{border:1px solid var(--line);border-radius:11px;padding:15px;cursor:pointer;transition:.13s;background:var(--card)}
.opt:hover{border-color:var(--gold-b)}
.opt.sel{border-color:var(--gold);background:var(--gold-dim)}
.opt .ot{font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:8px}
.opt .od{font-size:.78rem;color:var(--muted);margin-top:5px;line-height:1.4}
.wiz-nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* summary / preview */
.sumbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
.sumrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:.88rem}
.sumrow:last-child{border-bottom:none}
.sumrow .k{color:var(--muted)}.sumrow .v{font-weight:700}
.preview{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:16px;max-height:320px;overflow-y:auto}
.preview h4{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.mt-match{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:.84rem}
.mt-match:last-child{border-bottom:none}
.mt-key{font-family:var(--mono);font-size:.7rem;color:var(--muted);width:48px;flex-shrink:0}
.mt-p{flex:1}.mt-vs{color:var(--muted);font-size:.74rem;margin:0 4px}
.mt-bye{color:var(--green);font-size:.74rem}

/* ── WIZARD (refined) ── */
.wiz{max-width:920px;margin:0 auto;display:grid;grid-template-columns:230px 1fr;gap:36px;align-items:start}
@media(max-width:760px){.wiz{grid-template-columns:1fr;gap:22px}}
.wiz-rail{position:sticky;top:86px}
@media(max-width:760px){.wiz-rail{position:static}}
.wiz-rail .rail-title{font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.rail-step{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;margin-bottom:4px;transition:.13s;color:var(--muted)}
.rail-step .num{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.74rem;font-weight:700;flex-shrink:0;transition:.13s}
.rail-step .lbl{font-size:.86rem;font-weight:600}
.rail-step.active{background:var(--gold-dim);color:var(--gold)}
.rail-step.active .num{border-color:var(--gold);background:var(--gold);color:#1a1000}
.rail-step.done{color:var(--muted-2)}
.rail-step.done .num{border-color:var(--green);color:var(--green)}
@media(max-width:760px){.wiz-rail{display:flex;gap:6px;overflow-x:auto}.rail-step{flex-shrink:0;padding:8px 10px}.rail-step .lbl{display:none}.rail-step.active .lbl{display:block}}

.wiz-panel{min-height:340px}
.wiz-panel h2{font-size:1.6rem;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
.wiz-panel .sub{color:var(--muted);font-size:.9rem;margin-bottom:24px}

/* discipline pills */
.pill-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:9px 15px;border-radius:99px;border:1px solid var(--line);font-size:.85rem;font-weight:600;color:var(--muted-2);transition:.12s;background:var(--card)}
.pill:hover{border-color:var(--gold-b);color:var(--fg)}
.pill.sel{border-color:var(--gold);background:var(--gold-dim);color:var(--gold)}

/* format cards with structure */
.fmt-list{display:flex;flex-direction:column;gap:10px}
.fmt-card{display:flex;align-items:center;gap:16px;border:1px solid var(--line);border-radius:13px;padding:16px 18px;cursor:pointer;transition:.13s;background:var(--card)}
.fmt-card:hover{border-color:var(--gold-b)}
.fmt-card.sel{border-color:var(--gold);background:var(--gold-dim)}
.fmt-card .fic{width:46px;height:46px;border-radius:11px;background:var(--bg-2);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
.fmt-card.sel .fic{background:rgba(212,168,67,.18)}
.fmt-card .ftxt{flex:1}
.fmt-card .ft{font-weight:800;font-size:1rem}
.fmt-card .fd{font-size:.8rem;color:var(--muted);margin-top:3px;line-height:1.4}
.fmt-card .fstruct{display:flex;align-items:center;gap:6px;margin-top:8px;font-family:var(--mono);font-size:.66rem;color:var(--gold)}
.fstruct .ph{background:var(--gold-dim);padding:2px 7px;border-radius:5px}
.fstruct .arr{color:var(--muted)}
.fmt-section{font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px}
.fmt-section:first-child{margin-top:0}

/* players */
.player-add{display:flex;gap:8px;margin-bottom:10px}
.player-add input{flex:1}
.player-add .btn{flex-shrink:0;padding:11px 16px}
.bulk-toggle{font-size:.8rem;color:var(--gold);font-weight:600;cursor:pointer;margin-bottom:14px;display:inline-block}
.bulk-toggle:hover{text-decoration:underline}
.bulk-box{margin-bottom:14px}
.bulk-box textarea{width:100%;min-height:120px;font-family:var(--mono);font-size:.84rem;background:var(--bg-2);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:12px;resize:vertical;outline:none}
.bulk-box textarea:focus{border-color:var(--gold)}
.player-stats{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.player-count{font-size:.9rem;font-weight:700}.player-count b{color:var(--gold);font-family:var(--mono)}
.player-bracket{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.player-list{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
.pl-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:9px;transition:.12s}
.pl-item[draggable="true"]{cursor:grab}.pl-item.dragging{opacity:.42;border-color:var(--gold)}.pl-item.drag-over{border-color:var(--gold);background:var(--gold-dim)}
.pl-drag{color:var(--muted);font-size:1rem;width:18px;text-align:center;user-select:none;cursor:grab}
.pl-seed{font-family:var(--mono);font-size:.68rem;font-weight:700;color:var(--gold);min-width:62px}
.pl-seed.unseeded{color:var(--muted)}
.pl-name{flex:1;font-size:.88rem;font-weight:600}
.csp-player-badge{display:inline-flex;align-items:center;margin-left:7px;padding:2px 6px;border-radius:99px;font-family:var(--mono);font-size:.58rem;font-weight:800;line-height:1.35;vertical-align:middle;white-space:nowrap}
.csp-player-badge.linked{color:var(--green);background:var(--green-dim);border:1px solid rgba(38,208,125,.28)}
.csp-player-badge.match{color:var(--gold);background:var(--gold-dim);border:1px solid var(--gold-b)}
.presence-toggle{display:inline-flex;align-items:center;gap:7px;font-size:.76rem;font-weight:700;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.presence-toggle input{position:absolute;opacity:0;pointer-events:none}
.presence-switch{width:36px;height:20px;border-radius:99px;background:var(--line);border:1px solid var(--line-2);position:relative;transition:.15s}
.presence-switch:after{content:'';position:absolute;width:14px;height:14px;left:2px;top:2px;border-radius:50%;background:var(--muted);transition:.15s}
.presence-toggle input:checked + .presence-switch{background:rgba(38,208,125,.18);border-color:var(--green)}
.presence-toggle input:checked + .presence-switch:after{left:18px;background:var(--green)}
.presence-toggle input:checked ~ .presence-label{color:var(--green)}
.pl-move{display:flex;gap:3px}.pl-move button{width:24px;height:24px;border-radius:6px;color:var(--muted);font-size:.72rem}.pl-move button:hover{background:var(--gold-dim);color:var(--gold)}
.seed-control{display:grid;grid-template-columns:minmax(190px,260px) 1fr;gap:14px;align-items:end;margin:14px 0}
.seed-control .field{margin:0}.seed-info{font-size:.78rem;color:var(--muted);line-height:1.45}
@media(max-width:620px){.seed-control{grid-template-columns:1fr}.pl-move{display:none}}
.pl-del{color:var(--muted);font-size:1rem;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.pl-del:hover{background:var(--red-dim);color:var(--red)}
.player-empty{text-align:center;padding:30px;color:var(--muted);font-size:.86rem;border:1px dashed var(--line);border-radius:11px}
.clear-all{font-size:.78rem;color:var(--muted)}.clear-all:hover{color:var(--red)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:var(--green-dark);font-weight:700;padding:12px 22px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none;z-index:100}
.toast.show{opacity:1}.toast.err{background:var(--red);color:#fff}
.note-box{background:var(--gold-dim);border:1px solid var(--gold-b);border-radius:10px;padding:12px 14px;font-size:.82rem;color:var(--muted-2);margin-top:14px}
.note-box b{color:var(--gold)}

/* ── LIVE MATCH CONTROL ── */
.match-wrap{border-radius:12px;margin-bottom:8px}
.match-wrap .match-row{margin-bottom:0}
.match-wrap.live-running{border:1px solid rgba(38,208,125,.48);background:rgba(38,208,125,.055);box-shadow:0 0 0 1px rgba(38,208,125,.05)}
.match-wrap.live-paused{border:1px solid rgba(212,168,67,.42);background:rgba(212,168,67,.045)}
.match-wrap.live-stopped{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.025)}
.match-livebar{display:grid;grid-template-columns:minmax(90px,130px) auto 1fr auto;gap:8px;align-items:center;padding:8px 10px 10px;border-top:1px solid var(--line-2)}
.match-table-input{width:100%;padding:7px 9px;font-size:.74rem;border-radius:7px;font-family:var(--mono)}
.match-live-status{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.62rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.match-live-status.running{color:var(--green)}
.match-live-status.paused{color:var(--gold)}
.match-live-status.stopped{color:var(--muted-2)}
.match-live-status.pending{color:var(--muted)}
.match-live-status .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.match-live-status.running .dot{box-shadow:0 0 0 4px rgba(38,208,125,.12);animation:livepulse 1.4s ease-in-out infinite}
@keyframes livepulse{50%{opacity:.35}}
.match-clock{font-family:var(--mono);font-size:.8rem;font-weight:800;color:var(--fg);min-width:68px}
.match-ops{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.match-op{padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:.7rem;font-weight:700;background:var(--bg-2);color:var(--muted-2)}
.match-op:hover{border-color:var(--gold);color:var(--gold)}
.match-op.start{border-color:rgba(38,208,125,.35);color:var(--green)}
.match-op.stop{border-color:rgba(227,81,73,.3);color:var(--red)}
.match-op.qr{border-color:var(--gold-b);color:var(--gold)}
@media(max-width:760px){
  .match-livebar{grid-template-columns:1fr 1fr}
  .match-ops{grid-column:1/-1;justify-content:flex-start}
}
.match-qr-overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:18px}
.match-qr-card{width:min(480px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.match-qr-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:14px}
.match-qr-title{font-size:1.15rem;font-weight:800}
.match-qr-sub{font-size:.78rem;color:var(--muted);margin-top:4px}
.match-qr-code{width:280px;max-width:100%;min-height:280px;background:#fff;border-radius:12px;margin:0 auto 14px;padding:14px;display:grid;place-items:center}
.match-qr-code img,.match-qr-code canvas{max-width:100%;height:auto}
.match-qr-url{font-family:var(--mono);font-size:.68rem}


/* ── TOURNAMENT OPERATIONS ── */
.ops-panel{margin-bottom:22px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.ops-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ops-head h3{font-size:1rem;font-weight:800}.ops-head p{font-size:.78rem;color:var(--muted)}
.ops-create{display:flex;gap:8px;flex-wrap:wrap}.ops-create input,.ops-create select{width:auto;min-width:110px}
.ops-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ops-card{background:var(--bg-2);border:1px solid var(--line);border-radius:11px;padding:13px}
.ops-card.offline{border-color:rgba(227,81,73,.35)}.ops-card.ready{border-color:rgba(38,208,125,.35)}
.ops-card-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.ops-label{font-weight:800}.ops-badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.ops-badge{font-family:var(--mono);font-size:.57rem;font-weight:800;letter-spacing:.05em;padding:4px 7px;border-radius:99px;background:var(--card);color:var(--muted)}
.ops-badge.smart,.ops-badge.online{color:var(--green);background:var(--green-dim)}
.ops-badge.manual{color:var(--gold);background:var(--gold-dim)}.ops-badge.offline{color:var(--red);background:var(--red-dim)}
.ops-match{font-size:.8rem;color:var(--muted-2);margin-top:10px;min-height:38px}
.ops-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.ops-actions .match-op{flex:1}
.match-resource-select{width:140px;padding:7px 8px;font-size:.72rem;border-radius:7px}
.status-chip{display:inline-block;font-family:var(--mono);font-size:.62rem;font-weight:800;letter-spacing:.07em;padding:5px 9px;border-radius:99px;background:var(--card-2);color:var(--muted-2)}
.status-chip.active{color:var(--green);background:var(--green-dim)}.status-chip.ready{color:var(--gold);background:var(--gold-dim)}

</style>
</head>

<script>
/* ════════════════════════════════════════════════════════════
   CSP TOURNAMENT ENGINE — zamknuté vzorce
════════════════════════════════════════════════════════════ */
const TM = {
  // Seedovanie čistého KO (overené proti zväzu 16/32/64/128/256)
  seedKO(n){
    let seq=[1,2];
    while(seq.length<n){
      const m=seq.length*2, next=[];
      seq.forEach((s,i)=>{ const comp=m+1-s; if(i%2===0){next.push(s,comp);} else {next.push(comp,s);} });
      seq=next;
    }
    return seq; // pozícia -> seed
  },
  nextPow2(q){ let n=2; while(n<q) n*=2; return n; },
  // Pavúk s bye: qualifiers v poradí nasadenia (najlepší prvý), N=mocnina2
  bracketWithByes(qualifiers, N){
    const Q=qualifiers.length, order=this.seedKO(N);
    return order.map(s => s<=Q ? qualifiers[s-1] : {bye:true});
  },
  // Round Robin: rozlosovanie každý s každým (berger tables, jednoduchá verzia)
  roundRobin(players){
    const ps=[...players]; if(ps.length%2) ps.push({bye:true});
    const n=ps.length, rounds=[];
    for(let r=0;r<n-1;r++){
      const games=[];
      for(let i=0;i<n/2;i++){
        const a=ps[i], b=ps[n-1-i];
        if(!a.bye && !b.bye) games.push([a,b]);
      }
      rounds.push(games);
      ps.splice(1,0,ps.pop()); // rotácia
    }
    return rounds;
  },
  // Kód kola pre SKO winner-vetvu: A0, A1, ... , FIN
  roundCode(rIdx, total){ return rIdx===total-1 ? 'FIN' : 'A'+rIdx; },
  roundName(rIdx, total){
    const fromEnd=total-1-rIdx;
    if(fromEnd===0) return 'Finále';
    if(fromEnd===1) return 'Semifinále';
    if(fromEnd===2) return 'Štvrťfinále';
    if(fromEnd===3) return 'Osemfinále';
    return `${rIdx+1}. kolo`;
  },
  matchSig(m){ const s=p=>p?(p.bye?'b':(p.seed??'?')):'_'; return `${s(m.p1)}|${s(m.p2)}`; },
  // Postav Single KO pavúk (zoznam kôl so zápasmi)
  buildSKO(players){
    const seeded=players.map((p,i)=>({name:p.name, seed:i+1, id:p.id}));
    const N=this.nextPow2(Math.max(2,seeded.length));
    const slots=this.bracketWithByes(seeded,N);
    const total=Math.log2(N);
    const rounds=[];
    // round 0
    const r0=[];
    for(let i=0;i<N;i+=2){
      r0.push({ key:`${this.roundCode(0,total)}/${i/2+1}`, p1:slots[i], p2:slots[i+1], s1:null,s2:null, winner:null, resultSig:null });
    }
    rounds.push(r0);
    let cnt=N/2, r=1;
    while(cnt>1){ cnt/=2; const round=[];
      for(let i=0;i<cnt;i++) round.push({ key:`${this.roundCode(r,total)}/${i+1}`, p1:null,p2:null,s1:null,s2:null,winner:null,resultSig:null });
      rounds.push(round); r++;
    }
    const bracket={ type:'sko', N, total, rounds };
    this.recomputeSKO(bracket);
    return bracket;
  },
  recomputeSKO(bracket){
    const R=bracket.rounds;
    for(let r=0;r<R.length;r++){
      R[r].forEach((m,i)=>{
        // ak sa zmenili účastníci od zadania výsledku -> zruš výsledok
        if(m.resultSig && m.resultSig!==this.matchSig(m)){ m.winner=null; m.s1=null; m.s2=null; m.resultSig=null; }
        // auto bye (len 1. kolo)
        if(r===0){
          if(m.p1&&m.p1.bye&&m.p2&&!m.p2.bye) m.winner=2;
          else if(m.p2&&m.p2.bye&&m.p1&&!m.p1.bye) m.winner=1;
        }
        // posuň víťaza do ďalšieho kola
        if(r+1<R.length){
          const t=R[r+1][Math.floor(i/2)], slot=(i%2===0)?'p1':'p2';
          t[slot]= m.winner ? (m.winner===1?m.p1:m.p2) : null;
        }
      });
    }
  },
  champion(bracket){ const last=bracket.rounds[bracket.rounds.length-1][0]; return last && last.winner ? (last.winner===1?last.p1:last.p2) : null; },

  // ── STANDARD DOUBLE ELIMINATION ────────────────────────────────
  // Každý hráč vypadáva až po druhej prehre. Generické pre 4/8/16/32.
  // Winner vetva má log2(N) kôl, Loser vetva 2*(log2(N)-1) kôl.
  // Grand Final podporuje reset: ak víťaz Loser vetvy vyhrá GF1,
  // odohrá sa GF2, pretože obaja finalisti majú vtedy po jednej prehre.
  mkMatch(key,p1,p2){ return {key, p1:p1||null, p2:p2||null, s1:null,s2:null,winner:null,resultSig:null,_resolvedEmpty:false}; },
  buildDKO(players){
    const seeded=players.map((p,i)=>({name:p.name,seed:i+1,id:p.id}));
    const N=this.nextPow2(Math.max(4,seeded.length));
    const slots=this.bracketWithByes(seeded,N);
    const total=Math.log2(N);
    const W=[];
    for(let r=0;r<total;r++){
      const count=N/Math.pow(2,r+1);
      W.push(Array.from({length:count},(_,i)=>this.mkMatch(`A${r}/${i+1}`,r===0?slots[2*i]:null,r===0?slots[2*i+1]:null)));
    }
    const L=[];
    for(let r=0;r<2*(total-1);r++){
      const count=N/Math.pow(2,Math.floor(r/2)+2);
      L.push(Array.from({length:count},(_,i)=>this.mkMatch(`B${r}/${i+1}`)));
    }
    const GF=[this.mkMatch('GF1/1'),this.mkMatch('GF2/1')];
    const dko={type:'dko',schemaVersion:2,N,total,W,L,GF};
    this.recomputeDKO(dko);
    return dko;
  },
  recomputeDKO(dko){
    const {W,L,GF}=dko;
    const inval=m=>{
      if(m.resultSig && m.resultSig!==this.matchSig(m)){
        m.winner=null;m.s1=null;m.s2=null;m.resultSig=null;
      }
      m._resolvedEmpty=false;
    };
    const wOf=m=>{
      const p=m&&m.winner?(m.winner===1?m.p1:m.p2):null;
      return p&&!p.bye?p:null;
    };
    const lOf=m=>{
      const p=m&&m.winner?(m.winner===1?m.p2:m.p1):null;
      return p&&!p.bye?p:null;
    };
    const resolved=m=>!!(m&&(m.winner||m._resolvedEmpty));
    const resolve=(m,inputsResolved)=>{
      inval(m);
      if(!inputsResolved) return;
      const a=!!(m.p1&&!m.p1.bye), b=!!(m.p2&&!m.p2.bye);
      if(a&&!b&&!m.winner){m.winner=1;m.resultSig=this.matchSig(m);}
      else if(b&&!a&&!m.winner){m.winner=2;m.resultSig=this.matchSig(m);}
      else if(!a&&!b){m._resolvedEmpty=true;m.resultSig=null;}
    };

    // Winner bracket.
    W[0].forEach(m=>resolve(m,true));
    for(let r=1;r<W.length;r++){
      W[r].forEach((m,i)=>{
        const a=W[r-1][2*i], b=W[r-1][2*i+1];
        m.p1=wOf(a);m.p2=wOf(b);
        resolve(m,resolved(a)&&resolved(b));
      });
    }

    // Loser round 0 receives paired losers from Winner round 0.
    if(L.length){
      L[0].forEach((m,i)=>{
        const a=W[0][2*i], b=W[0][2*i+1];
        m.p1=lOf(a);m.p2=lOf(b);
        resolve(m,resolved(a)&&resolved(b));
      });
    }

    // Odd loser rounds receive one survivor from the previous L round
    // and one loser from the corresponding Winner round. Reverse mapping
    // prevents an immediate rematch with the opponent from the W branch.
    // Even loser rounds pair survivors inside the L branch.
    for(let r=1;r<L.length;r++){
      const current=L[r], prev=L[r-1];
      if(r%2===1){
        const wRound=(r+1)/2;
        current.forEach((m,i)=>{
          const incoming=W[wRound][current.length-1-i];
          m.p1=wOf(prev[i]);m.p2=lOf(incoming);
          resolve(m,resolved(prev[i])&&resolved(incoming));
        });
      }else{
        current.forEach((m,i)=>{
          const a=prev[2*i], b=prev[2*i+1];
          m.p1=wOf(a);m.p2=wOf(b);
          resolve(m,resolved(a)&&resolved(b));
        });
      }
    }

    const wFinal=W[W.length-1][0];
    const lFinal=L[L.length-1][0];
    GF[0].p1=wOf(wFinal);GF[0].p2=wOf(lFinal);
    resolve(GF[0],resolved(wFinal)&&resolved(lFinal));

    // Reset final is enabled only when the Loser-bracket champion wins GF1.
    inval(GF[1]);
    const resetNeeded=GF[0].winner===2;
    if(resetNeeded){
      GF[1].p1=GF[0].p1;GF[1].p2=GF[0].p2;
      resolve(GF[1],true);
    }else{
      GF[1].p1=null;GF[1].p2=null;GF[1].winner=null;GF[1].s1=null;GF[1].s2=null;GF[1].resultSig=null;
      GF[1]._resolvedEmpty=!!GF[0].winner;
    }
  },
  dkoChampion(dko){
    const gf2=dko.GF[1], gf1=dko.GF[0];
    const m=gf2&&gf2.winner?gf2:gf1;
    return m&&m.winner?(m.winner===1?m.p1:m.p2):null;
  },
  dkoStandings(dko){
    const wOf=m=>m&&m.winner?(m.winner===1?m.p1:m.p2):null;
    const lOf=m=>m&&m.winner?(m.winner===1?m.p2:m.p1):null;
    const gf=dko.GF[1].winner?dko.GF[1]:dko.GF[0];
    const loserFinal=dko.L[dko.L.length-1][0];
    return {first:wOf(gf),second:lOf(gf),third:lOf(loserFinal)};
  },
  dkoRoundName(branch,ri,total){
    if(branch==='W') return this.roundName(ri,total).replace('Finále','Winner Final');
    const last=2*(total-1)-1;
    if(ri===last) return 'Losers Final';
    return `Loser kolo ${ri+1}`;
  },
  // Zdieľaný rebríček: primárne výhry, potom fáza, rozdiel hier, %
  rankFrom(list){ // list: [{m, phase}]
    const stat={};
    const ensure=p=>{ if(p&&!p.bye&&!stat[p.name]) stat[p.name]={name:p.name,seed:p.seed,wins:0,losses:0,gw:0,gl:0,exit:0}; };
    const wOf=m=> m.winner? (m.winner===1?m.p1:m.p2) : null;
    const lOf=m=> m.winner? (m.winner===1?m.p2:m.p1) : null;
    list.forEach(({m,phase})=>{
      [m.p1,m.p2].forEach(ensure);
      if(m.winner && m.p1&&m.p2 && !m.p1.bye && !m.p2.bye){
        const w=wOf(m), l=lOf(m), s1=m.s1||0, s2=m.s2||0, wg=Math.max(s1,s2), lg=Math.min(s1,s2);
        stat[w.name].wins++; stat[w.name].gw+=wg; stat[w.name].gl+=lg;
        stat[l.name].losses++; stat[l.name].gw+=lg; stat[l.name].gl+=wg;
        stat[w.name].exit=Math.max(stat[w.name].exit,phase);
        stat[l.name].exit=Math.max(stat[l.name].exit,phase);
      }
    });
    const arr=Object.values(stat).map(s=>({...s, gp:s.wins+s.losses, pct:(s.gw+s.gl)?Math.round(100*s.gw/(s.gw+s.gl)):0}));
    arr.sort((a,b)=> b.wins-a.wins || b.exit-a.exit || (b.gw-b.gl)-(a.gw-a.gl) || b.pct-a.pct || a.seed-b.seed);
    let place=0, prev=null, idx=0;
    arr.forEach(s=>{ idx++; const k=`${s.wins}|${s.exit}`; if(k!==prev){ place=idx; prev=k; } s.place=place; });
    return arr;
  },
  dkoRanking(dko){
    const list=[];
    dko.W.forEach((round,ri)=>round.forEach(m=>list.push({m,phase:ri+1})));
    dko.L.forEach((round,ri)=>round.forEach(m=>list.push({m,phase:dko.W.length+ri+1})));
    dko.GF.forEach((m,ri)=>list.push({m,phase:dko.W.length+dko.L.length+ri+1}));
    return this.rankFrom(list);
  },
  skoRanking(br){
    const list=[];
    br.rounds.forEach((round,ri)=>round.forEach(m=>list.push({m, phase:ri+1})));
    return this.rankFrom(list);
  }
};

/* ════════════════════════════════════════════════════════════
   REAL AUTH + REAL TOURNAMENT/PLAYER DATA
   Replaces the previously fully-open page (no login check at all,
   comments explicitly said access control happened elsewhere) with
   real Supabase auth via cspAuth, and replaces the localStorage
   "csp_tournaments" store with real writes to tournaments /
   tournament_players / tournament_groups (migrations 0003, 0011).

   Scope boundary (unchanged from the task): match/bracket PROGRESS
   (scores, winners, which rounds are done) is NOT written to the real
   `matches` table yet -- that's separate round_key-based match-engine
   work for a follow-up. It still lives in localStorage, but now scoped
   per real tournament id via bracketStorageKey() below, instead of as
   part of one big array of full tournament objects. The Karty →
   Generátor stolov handoff (openTableGen) is completely untouched.
════════════════════════════════════════════════════════════ */
const UPGRADE_URL="/upgrade/";
const TABLEGEN_URL="/generator-stolov/"; // Generátor stolov — kartové hry (routing z wizardu)
const KARTY_HANDOFF_PREFIX="csp_karty_turnaj_"; // + tournament id, zdieľaný localStorage kľúč s Generátorom stolov

let currentSession = null;
let currentProfile = null;
let isPublicReadOnly = false;
let realMatchesByKey = new Map();
let tournamentMatchesChannel = null;
let realtimeFallbackTimer = null;
let resourceRefreshTimer = null;
let tournamentOperations=[];
function esc(value){
  return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function statusLabel(status){return ({draft:'NÁVRH',ready:'PRIPRAVENÝ',active:'PREBIEHA',completed:'UKONČENÝ',archived:'ARCHÍV'})[status]||String(status||'').toUpperCase();}
function cspErrorMessage(err){
  if(window.cspAuth && typeof cspAuth.formatError==='function') return cspAuth.formatError(err);
  if(window.cspAuth && typeof cspAuth.friendlyError==='function') return cspAuth.friendlyError(err);
  return err?.message||String(err||'Nastala neočakávaná chyba.');
}

function isTournamentAccessError(err){
  const msg=String(err?.message||'').toLowerCase();
  return msg.includes('tournament not found or access denied') || msg.includes('jwt expired');
}
async function tournamentRpc(name,args){
  let result=await cspAuth.client.rpc(name,args);
  if(result.error && currentSession && isTournamentAccessError(result.error)){
    // A manager tab may stay open for hours. If its access token expired,
    // refresh it once and retry the owner-only RPC instead of replacing
    // real tournament data with an empty UI state.
    try{
      const refreshed=await cspAuth.client.auth.refreshSession();
      if(refreshed?.data?.session){
        currentSession=refreshed.data.session;
        result=await cspAuth.client.rpc(name,args);
      }
    }catch(refreshErr){
      console.warn('[turnament] auth refresh before RPC failed:',refreshErr);
    }
  }
  return result;
}


function bracketStorageKey(id){ return 'deprecated_csp_tournament_bracket_'+id; }
async function loadBracketState(id){
  try{
    const {data,error}=await tournamentRpc('get_tournament_bracket_state',{p_tournament_id:id});
    if(error)throw error;
    return data||{};
  }catch(err){
    console.error('[turnament] bracket state load:',err);
    return {};
  }
}
async function saveBracketState(id,state){
  const {error}=await tournamentRpc('save_tournament_bracket_state',{p_tournament_id:id,p_state:state||{}});
  if(error){
    console.error('[turnament] bracket state save:',error);
    return false;
  }
  return true;
}

(async function initAuth(){
  const launchParams = new URLSearchParams(location.search);
  const launchTournamentId = launchParams.get('tournament_id') || launchParams.get('id');
  const launchMode = launchParams.get('mode');

  try {
    const { data: { session } } = await cspAuth.withTimeout(cspAuth.getSession(), 8000, 'getSession()');
    currentSession = session || null;

    if(session){
      const { data: profile, error: profileError } = await cspAuth.withTimeout(cspAuth.getCurrentProfile(session.user), 8000, 'getCurrentProfile()');
      if(profileError){ console.error('[turnament] Could not load profile:', profileError); }
      currentProfile = profile;

      const displayName = (profile && profile.full_name) || session.user.email;
      const initials = (displayName.trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase()) || '??';
      document.getElementById('tbUserAv').textContent = initials;
      document.getElementById('tbUserNameText').textContent = displayName;
      document.getElementById('tbUser').style.display = 'flex';
      document.getElementById('signOutBtn').style.display = 'inline-flex';
    }else{
      document.getElementById('tbUser').style.display = 'none';
      const signOutBtn=document.getElementById('signOutBtn');
      signOutBtn.textContent='Prihlásiť sa';
      signOutBtn.style.display='inline-flex';
      signOutBtn.onclick=()=>{ location.href='/login/?next='+encodeURIComponent(location.pathname+location.search); };
    }

    if(launchTournamentId){
      if(launchMode === 'settings'){
        if(!session){ location.href='/login/?next='+encodeURIComponent(location.pathname+location.search); return; }
        await editTournament(launchTournamentId);
      }else{
        await openTournament(launchTournamentId);
      }
    }else{
      if(!session){ location.href='/login/'; return; }
      go('dashboard');
    }
  } catch(err) {
    console.error('[turnament] Initialisation failed:', err);
    if(launchTournamentId){
      document.getElementById('app').innerHTML='<div class="wrap"><div class="empty">Turnaj sa nepodarilo načítať.</div></div>';
    }else{
      location.href='/login/';
    }
  }
})();

document.getElementById('signOutBtn').addEventListener('click', async () => {
  if(!currentSession){ window.location.href='/login/?next='+encodeURIComponent(location.pathname+location.search); return; }
  try { await cspAuth.withTimeout(cspAuth.signOut(), 8000, 'signOut()'); }
  catch(err){ console.error('[turnament] signOut failed or timed out:', err); }

});

/* Gated on the real quota/plan check (can_create_tournament(), migration
   0002 -- already accounts for admin bypass and the pro-tier 10-tournament
   cap server-side, reused as-is) before opening the wizard for a NEW
   tournament. Editing an existing one (editTournament()) does not go
   through this gate. */
async function startNewTournament(){
  if(isPublicReadOnly){ toast('Verejný náhľad je iba na čítanie.',true); return; }
  try {
    const { data: canCreate, error } = await cspAuth.withTimeout(
      cspAuth.client.rpc('can_create_tournament', { uid: currentSession.user.id }),
      8000, 'can_create_tournament()'
    );
    if(error){ console.error('[turnament] can_create_tournament check failed:', error); }
    if(!canCreate){ window.location.href = UPGRADE_URL; return; }
    go('wizard');
  } catch(err){
    console.error('[turnament] Quota check failed or timed out:', err);
    toast('Nepodarilo sa overiť limit turnajov. Skús to znova.', true);
  }
}

function stopTournamentMatchesRealtime(){
  if(tournamentMatchesChannel){
    cspAuth.client.removeChannel(tournamentMatchesChannel);
    tournamentMatchesChannel=null;
  }
  if(realtimeFallbackTimer){
    clearInterval(realtimeFallbackTimer);
    realtimeFallbackTimer=null;
  }
  if(resourceRefreshTimer){
    clearTimeout(resourceRefreshTimer);
    resourceRefreshTimer=null;
  }
}

function matchElement(loc){
  return [...document.querySelectorAll('.match-wrap[data-match-loc]')]
    .find(el=>el.dataset.matchLoc===loc)||null;
}
function htmlElement(html){
  const tpl=document.createElement('template');
  tpl.innerHTML=String(html||'').trim();
  return tpl.content.firstElementChild;
}
function patchVisibleMatch(loc){
  const old=matchElement(loc),m=getMatchByLoc(loc);
  if(!old||!m)return;
  const next=htmlElement(matchRow(m,loc));
  if(next&&!old.isEqualNode(next))old.replaceWith(next);
}
function patchAllVisibleMatches(){
  [...document.querySelectorAll('.match-wrap[data-match-loc]')].forEach(el=>{
    const loc=el.dataset.matchLoc,m=getMatchByLoc(loc);
    if(!m)return;
    const next=htmlElement(matchRow(m,loc));
    if(next&&!el.isEqualNode(next))el.replaceWith(next);
  });
}
function applyMatchRowsToBracket(matchRows){
  applyRealMatches(matchRows);
  if(curT.format==='sko') TM.recomputeSKO(curT.bracket);
  else if(curT.format==='dko') TM.recomputeDKO(curT.dko);
  else if(curT.format==='rr_sko'||curT.format==='rr_dko'){
    maybeGenerateComboPhase(curT);
    applyRealMatches(matchRows);
    maybeGenerateComboPhase(curT);
  }
  finalizeAppliedMatches(matchRows);
}
async function silentSyncMatches(tournamentId){
  if(!curT || curT.id!==tournamentId)return;
  try{
    const matchRows=await reloadRealMatches();
    applyMatchRowsToBracket(matchRows);
    patchAllVisibleMatches();
  }catch(err){
    console.error('[turnament] silent match sync:',err);
  }
}

async function handleRealtimeMatch(payload,tournamentId){
  if(!curT || curT.id!==tournamentId)return;
  const incoming=payload?.new;
  if(!incoming?.id || incoming.tournament_id!==tournamentId){
    await silentSyncMatches(tournamentId);
    return;
  }
  const previous=[...realMatchesByKey.values()].find(row=>row.id===incoming.id);
  const row={...(previous||{}),...incoming};
  if(!row.round_key){ await silentSyncMatches(tournamentId); return; }
  realMatchesByKey.set(row.round_key,row);

  const justCompleted=row.status==='completed' && previous?.status!=='completed';
  if(justCompleted){
    // Only a finished match changes advancement/bracket structure.
    // Live points must never rebuild the whole match list.
    applyMatchRowsToBracket([row]);
    patchAllVisibleMatches();
    if(!isPublicReadOnly){
      const ok=await persistT();
      if(!ok)console.warn('[turnament] completed match is safe in matches; bracket snapshot retry will happen on next manager action.');
      await maybeAutoCompleteTournament(curT);
      const area=document.getElementById('matchArea');
      if(area)area.innerHTML=renderMatchArea(curT);
    }
  }else{
    // Score/status/time update: patch one row in place. Scroll position,
    // open page state and all other matches stay untouched.
    patchVisibleMatch(row.round_key);
  }
}

function scheduleOperationsReload(){
  clearTimeout(resourceRefreshTimer);
  resourceRefreshTimer=setTimeout(async()=>{
    resourceRefreshTimer=null;
    if(!curT||isPublicReadOnly)return;
    await loadTournamentOperations(curT.id);
    const panel=document.querySelector('.ops-panel');
    if(panel)panel.outerHTML=renderOperationsPanel();
    patchAllVisibleMatches();
  },80);
}

function handleRealtimeResource(payload,tournamentId){
  if(!curT || curT.id!==tournamentId)return;
  const row=payload?.new;
  if(!row?.id){scheduleOperationsReload();return;}
  const cached=tournamentOperations.find(r=>r.resource_id===row.id);
  // Assignment/release changes which match occupies the station and must
  // refresh the joined player data. Heartbeats and online timestamps do not.
  if(!cached || cached.match_id!==(row.current_match_id||null)){
    scheduleOperationsReload();
    return;
  }
  cached.resource_status=row.status;
  cached.operating_mode=row.operating_mode;
  cached.automation_enabled=row.automation_enabled;
  cached.tablet_last_seen_at=row.tablet_last_seen_at;
  cached.tablet_online=!!row.tablet_last_seen_at && (Date.now()-new Date(row.tablet_last_seen_at).getTime())<20000;
  patchOperationCard(cached);
}

function startTournamentMatchesRealtime(tournamentId){
  stopTournamentMatchesRealtime();
  if(!tournamentId)return;

  tournamentMatchesChannel=cspAuth.client
    .channel(`tournament-matches-${tournamentId}`)
    .on("postgres_changes",{
      event:"*",
      schema:"public",
      table:"matches",
      filter:`tournament_id=eq.${tournamentId}`
    },payload=>handleRealtimeMatch(payload,tournamentId))
    .on("postgres_changes",{
      event:"*",
      schema:"public",
      table:"tournament_resources",
      filter:`tournament_id=eq.${tournamentId}`
    },payload=>handleRealtimeResource(payload,tournamentId))
    .subscribe(status=>{
      if(status==='SUBSCRIBED' && realtimeFallbackTimer){
        clearInterval(realtimeFallbackTimer);
        realtimeFallbackTimer=null;
      }
      if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){
        console.error('[turnament] matches realtime subscription:',status);
        // Silent fallback only if Realtime itself is unavailable. It patches
        // changed rows in place and never reloads/navigates the page.
        if(!realtimeFallbackTimer){
          realtimeFallbackTimer=setInterval(()=>silentSyncMatches(tournamentId),3000);
        }
      }
    });
}

async function go(view, data){
  const app=document.getElementById('app');
  if(view==='dashboard'){
    stopTournamentMatchesRealtime();
    // The dashboard must not keep a previously opened tournament in the
    // address bar. Otherwise F5 would reopen that tournament again.
    const url=new URL(location.href);
    url.searchParams.delete('id');
    url.searchParams.delete('tournament_id');
    url.searchParams.delete('mode');
    history.replaceState({view:'dashboard'},'',url.pathname+(url.search?url.search:'')+url.hash);
    app.innerHTML=`<div class="wrap"><div class="empty">Načítavam…</div></div>`;
    app.innerHTML=await viewDashboard();
  }
  else if(view==='wizard') {
    stopTournamentMatchesRealtime();
    app.innerHTML=viewWizard(); initWizard(data);
  }
  else if(view==='detail') {
    // Persist the opened tournament in the URL. The tournament flow is a
    // client-side view, so without this F5 loses its id and falls back to
    // the dashboard/summary even though the tournament is still active.
    const url=new URL(location.href);
    url.searchParams.set('id',data);
    url.searchParams.delete('tournament_id');
    url.searchParams.delete('mode');
    history.replaceState({view:'detail',tournamentId:data},'',url.pathname+'?'+url.searchParams.toString()+url.hash);
    app.innerHTML=`<div class="wrap"><div class="empty">Načítavam…</div></div>`;
    app.innerHTML=await viewDetail(data);
    bindTournamentSocial();
    startTournamentMatchesRealtime(data);
  }
  window.scrollTo(0,0);
}
