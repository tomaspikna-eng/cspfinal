<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Upraviť verejný profil | Connect Sports Pro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="/assets/csp-auth.js"></script>
<style>
:root{
  --bg:#070807;--panel:#0d0f0e;--panel2:#121513;--line:#252925;--line2:#323732;
  --text:#f4f4f2;--muted:#8f958f;--gold:#d4a843;--gold2:#f0c966;--green:#22d36b;
  --red:#ff5b64;--shadow:0 22px 70px rgba(0,0,0,.28)
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(circle at 78% -10%,rgba(212,168,67,.08),transparent 32%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.wrap{width:min(1080px,calc(100% - 28px));margin:18px auto 50px}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 18px;border:1px solid var(--line);border-radius:16px;background:#0b0d0c}
.brand img{display:block;width:180px;max-width:46vw}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:42px;padding:0 14px;border-radius:9px;border:1px solid var(--line2);background:#151815;color:#eee;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#211806}
.btn.green{background:var(--green);border-color:var(--green);color:#06170d}
.btn.danger{color:#ff888e;border-color:rgba(255,91,100,.25);background:rgba(255,91,100,.06)}
.btn:disabled{opacity:.5;cursor:default}
.hero{display:grid;grid-template-columns:170px minmax(0,1fr);gap:26px;align-items:center;margin-top:12px;padding:24px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,rgba(212,168,67,.07),#0d0f0e 45%)}
.avatar{width:154px;height:154px;border-radius:26px;overflow:hidden;display:grid;place-items:center;background:#171a18;border:1px solid rgba(212,168,67,.45);color:var(--gold2);font-size:38px;font-weight:900}
.avatar img{width:100%;height:100%;object-fit:cover}
.eyebrow,.section-label{font-size:9px;letter-spacing:.16em;color:var(--gold);font-weight:900}
.hero h1{font-size:31px;margin:7px 0 7px;letter-spacing:-.04em}
.hero p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
.avatar-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:12px;margin-top:12px}
.panel{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:20px}
.panel h2{margin:6px 0 15px;font-size:18px}
.field{display:grid;gap:7px;margin-bottom:14px}
.field label{font-size:9px;letter-spacing:.09em;color:var(--gold);font-weight:850;text-transform:uppercase}
.field input,.field textarea{width:100%;border:1px solid var(--line2);border-radius:10px;background:#151815;color:#fff;outline:none;padding:11px 12px;font-size:13px}
.field input:focus,.field textarea:focus{border-color:rgba(212,168,67,.65);box-shadow:0 0 0 3px rgba(212,168,67,.08)}
.field textarea{min-height:210px;resize:vertical;line-height:1.65}
.counter{font-size:9px;color:var(--muted);text-align:right;margin-top:-4px}
.sport-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gallery-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}
.gallery-count{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--gold);font-size:11px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.photo{position:relative;aspect-ratio:4/3;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#101210;display:grid;place-items:center}
.photo img{width:100%;height:100%;object-fit:cover}
.photo-empty{color:#555;font-size:12px;text-align:center;padding:14px}
.photo .remove{position:absolute;right:7px;top:7px;width:32px;height:32px;border-radius:9px;border:1px solid rgba(255,91,100,.3);background:rgba(8,8,8,.82);color:#ff7b82;font-weight:900}
.gallery-note{margin-top:11px;font-size:10px;color:var(--muted);line-height:1.55}
.savebar{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.state{min-height:70vh;display:grid;place-items:center;text-align:center;color:var(--muted)}
.spinner{width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--gold);animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;right:18px;bottom:18px;z-index:1000;max-width:360px;border:1px solid var(--line2);border-radius:10px;background:#171a18;padding:12px 14px;color:#eee;font-size:11px;box-shadow:var(--shadow)}
.toast.ok{border-color:rgba(34,211,107,.32)}
.toast.err{border-color:rgba(255,91,100,.34);color:#ffb1b5}
@media(max-width:760px){
  .top{align-items:flex-start}.hero{grid-template-columns:1fr}.avatar{width:132px;height:132px}
  .grid{grid-template-columns:1fr}.gallery{grid-template-columns:1fr 1fr}.gallery .photo:first-child{grid-column:1/-1}
}
@media(max-width:500px){
  .wrap{width:calc(100% - 16px);margin:8px auto 36px}.top,.hero,.panel{border-radius:13px}
  .top{padding:12px}.brand img{width:155px}.hero{padding:18px}.hero h1{font-size:26px}
  .sport-row{grid-template-columns:1fr}.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}.photo{min-width:82%;scroll-snap-align:start}
}
</style>
</head>
<body>
<div id="loading" class="state"><div><div class="spinner"></div><div>Načítavam profil…</div></div></div>

<main id="app" class="wrap hidden">
  <header class="top">
    <a class="brand" href="/profil/" aria-label="Connect Sports Pro"><img src="/assets/csp-logo-full.png" alt="Connect Sports Pro"></a>
    <div class="top-actions">
      <a class="btn" id="editorOverviewLink" href="/profil/?view=public">← Prehľad</a>
      <a class="btn green" id="publicProfileLink" href="/profil/">Verejný profil</a>
    </div>
  </header>

  <section class="hero">
    <div class="avatar" id="avatarPreview"><span id="avatarInitials">–</span></div>
    <div>
      <div class="eyebrow">VEREJNÝ PROFIL HRÁČA</div>
      <h1 id="profileNameHero">Hráč</h1>
      <p>Uprav obsah, ktorý uvidia ostatní hráči na tvojom verejnom profile.</p>
      <div class="avatar-actions">
        <input id="avatarInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
        <button class="btn" id="avatarButton" type="button">Zmeniť profilovú fotku</button>
      </div>
    </div>
  </section>

  <div class="grid">
    <section class="panel">
      <div class="section-label">BIO</div>
      <h2>O hráčovi</h2>
      <div class="field">
        <label for="fullName">Meno</label>
        <input id="fullName" maxlength="120" autocomplete="name">
      </div>
      <div class="field">
        <label for="bio">Bio</label>
        <textarea id="bio" maxlength="2000" placeholder="Napíš stručné športové bio…"></textarea>
        <div class="counter"><span id="bioCount">0</span>/2000</div>
      </div>
    </section>

    <section class="panel">
      <div class="section-label">ŠPORTOVÝ PROFIL</div>
      <h2>Hlavná disciplína</h2>
      <div class="sport-row">
        <div class="field">
          <label for="sport">Šport</label>
          <input id="sport" maxlength="80" placeholder="Biliard">
        </div>
        <div class="field">
          <label for="discipline">Disciplína</label>
          <input id="discipline" maxlength="80" placeholder="9-ball">
        </div>
      </div>
    </section>
  </div>

  <section class="panel" style="margin-top:12px">
    <div class="gallery-head">
      <div>
        <div class="section-label">GALÉRIA</div>
        <h2 style="margin-bottom:0">Fotografie hráča</h2>
      </div>
      <div class="gallery-count"><span id="galleryCount">0</span>/3</div>
    </div>

    <div class="gallery" id="gallery"></div>

    <div class="avatar-actions" style="margin-top:14px">
      <input id="galleryInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
      <button class="btn" id="galleryButton" type="button">+ Pridať fotografiu</button>
    </div>
    <div class="gallery-note">Na verejnom profile sa zobrazia maximálne tri fotografie.</div>
  </section>

  <div class="savebar">
    <button class="btn gold" id="saveButton" type="button">Uložiť zmeny</button>
  </div>
</main>

<div id="toast" class="toast hidden"></div>

<script>
"use strict";

const $=id=>document.getElementById(id);
const db=window.cspAuth?.client;
let session=null;
let profile=null;
let primaryDiscipline=null;
let galleryCollection=null;
let galleryImages=[];

function initials(name){
  return String(name||"Hráč").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();
}
function toast(message,type="ok"){
  const el=$("toast");
  el.textContent=message;el.className=`toast ${type}`;
  clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add("hidden"),2800);
}
function safeFileName(name){
  return String(name||"foto").normalize("NFKD").replace(/[^\w.-]+/g,"-").replace(/-+/g,"-").slice(-80);
}
function extFromFile(file){
  const name=String(file.name||"");
  const ext=name.includes(".")?name.split(".").pop().toLowerCase():"";
  if(["jpg","jpeg","png","webp"].includes(ext))return ext==="jpeg"?"jpg":ext;
  if(file.type==="image/png")return"png";
  if(file.type==="image/webp")return"webp";
  return"jpg";
}
function validateImage(file){
  if(!file)return false;
  if(!["image/jpeg","image/png","image/webp"].includes(file.type)){
    toast("Použi JPG, PNG alebo WEBP.","err");return false;
  }
  if(file.size>8*1024*1024){
    toast("Fotografia môže mať maximálne 8 MB.","err");return false;
  }
  return true;
}
function renderAvatar(){
  const root=$("avatarPreview");
  root.replaceChildren();
  if(profile?.avatar_url){
    const img=new Image();img.src=profile.avatar_url;img.alt="Profilová fotografia";
    root.append(img);
  }else{
    const span=document.createElement("span");span.textContent=initials(profile?.full_name);root.append(span);
  }
}
async function signedGalleryUrl(path){
  const {data,error}=await db.storage.from("gallery-images").createSignedUrl(path,3600);
  if(error)return null;
  return data?.signedUrl||null;
}
async function renderGallery(){
  const root=$("gallery");root.replaceChildren();
  $("galleryCount").textContent=String(galleryImages.length);
  $("galleryButton").disabled=galleryImages.length>=3;

  for(const image of galleryImages){
    const card=document.createElement("div");card.className="photo";
    const url=await signedGalleryUrl(image.storage_path);
    if(url){
      const img=new Image();img.src=url;img.alt=image.alt_text||image.caption||"Fotografia hráča";card.append(img);
    }else{
      const empty=document.createElement("div");empty.className="photo-empty";empty.textContent="Fotografia";card.append(empty);
    }
    const del=document.createElement("button");del.className="remove";del.type="button";del.textContent="×";del.title="Odstrániť";
    del.addEventListener("click",()=>deleteGalleryImage(image));
    card.append(del);root.append(card);
  }

  for(let i=galleryImages.length;i<3;i++){
    const card=document.createElement("div");card.className="photo";
    const empty=document.createElement("div");empty.className="photo-empty";empty.textContent="Voľné miesto";card.append(empty);
    root.append(card);
  }
}
async function ensureGalleryCollection(){
  if(galleryCollection)return galleryCollection;

  const {data:existing,error:readError}=await db.from("gallery_collections")
    .select("id,owner_id,entity_type,entity_id,title,visibility,published_at")
    .eq("owner_id",session.user.id)
    .eq("entity_type","profile")
    .eq("entity_id",session.user.id)
    .order("created_at",{ascending:true})
    .limit(1);

  if(readError)throw readError;
  if(existing?.[0]){
    galleryCollection=existing[0];
    if(galleryCollection.visibility!=="public" || !galleryCollection.published_at){
      const {data:updated,error:updateError}=await db.from("gallery_collections")
        .update({visibility:"public",published_at:new Date().toISOString()})
        .eq("id",galleryCollection.id)
        .select("id,owner_id,entity_type,entity_id,title,visibility,published_at")
        .single();
      if(updateError)throw updateError;
      galleryCollection=updated;
    }
    return galleryCollection;
  }

  const {data:created,error:createError}=await db.from("gallery_collections").insert({
    owner_id:session.user.id,
    entity_type:"profile",
    entity_id:session.user.id,
    title:"Profil hráča",
    visibility:"public",
    published_at:new Date().toISOString()
  }).select("id,owner_id,entity_type,entity_id,title,visibility,published_at").single();
  if(createError)throw createError;
  galleryCollection=created;
  return galleryCollection;
}
async function loadGallery(){
  const collection=await ensureGalleryCollection();
  const {data,error}=await db.from("gallery_images")
    .select("id,gallery_id,storage_path,caption,alt_text,sort_order,is_published,created_at")
    .eq("gallery_id",collection.id)
    .order("sort_order",{ascending:true})
    .order("created_at",{ascending:true});
  if(error)throw error;
  galleryImages=(data||[]).filter(x=>x.is_published).slice(0,3);
  await renderGallery();
}
async function uploadGalleryImage(file){
  if(!validateImage(file)||galleryImages.length>=3)return;
  $("galleryButton").disabled=true;
  try{
    const collection=await ensureGalleryCollection();
    const ext=extFromFile(file);
    const storagePath=`${session.user.id}/${collection.id}/${crypto.randomUUID()}-${safeFileName(file.name||("photo."+ext))}`;

    const {error:uploadError}=await db.storage.from("gallery-images").upload(storagePath,file,{
      cacheControl:"3600",upsert:false,contentType:file.type
    });
    if(uploadError)throw uploadError;

    const nextOrder=galleryImages.reduce((max,x)=>Math.max(max,Number(x.sort_order)||0),-1)+1;
    const {data:row,error:insertError}=await db.from("gallery_images").insert({
      gallery_id:collection.id,
      uploader_id:session.user.id,
      storage_path:storagePath,
      sort_order:nextOrder,
      mime_type:file.type,
      size_bytes:file.size,
      is_published:true
    }).select("id,gallery_id,storage_path,caption,alt_text,sort_order,is_published,created_at").single();

    if(insertError){
      await db.storage.from("gallery-images").remove([storagePath]);
      throw insertError;
    }
    galleryImages.push(row);
    await renderGallery();
    toast("Fotografia bola pridaná.");
  }catch(error){
    console.error("[profile editor] gallery upload",error);
    toast("Fotografiu sa nepodarilo pridať.","err");
  }finally{
    $("galleryInput").value="";
    $("galleryButton").disabled=galleryImages.length>=3;
  }
}
async function deleteGalleryImage(image){
  if(!confirm("Odstrániť túto fotografiu z verejného profilu?"))return;
  try{
    const {error:deleteError}=await db.from("gallery_images").delete().eq("id",image.id);
    if(deleteError)throw deleteError;
    const {error:storageError}=await db.storage.from("gallery-images").remove([image.storage_path]);
    if(storageError)console.warn("[profile editor] storage cleanup",storageError);
    galleryImages=galleryImages.filter(x=>x.id!==image.id);
    await renderGallery();
    toast("Fotografia bola odstránená.");
  }catch(error){
    console.error("[profile editor] gallery delete",error);
    toast("Fotografiu sa nepodarilo odstrániť.","err");
  }
}
async function uploadAvatar(file){
  if(!validateImage(file))return;
  $("avatarButton").disabled=true;
  try{
    const ext=extFromFile(file);
    const storagePath=`${session.user.id}/avatar-profile.${ext}`;
    const {error:uploadError}=await db.storage.from("avatars").upload(storagePath,file,{
      cacheControl:"3600",upsert:true,contentType:file.type
    });
    if(uploadError)throw uploadError;
    const {data:urlData}=db.storage.from("avatars").getPublicUrl(storagePath);
    const avatarUrl=urlData?.publicUrl;
    if(!avatarUrl)throw new Error("Avatar URL");
    const {error:updateError}=await db.from("profiles").update({avatar_url:avatarUrl}).eq("id",session.user.id);
    if(updateError)throw updateError;
    profile.avatar_url=avatarUrl+"?v="+Date.now();
    renderAvatar();
    toast("Profilová fotografia bola uložená.");
  }catch(error){
    console.error("[profile editor] avatar",error);
    toast("Profilovú fotografiu sa nepodarilo uložiť.","err");
  }finally{
    $("avatarInput").value="";
    $("avatarButton").disabled=false;
  }
}
async function saveProfile(){
  const button=$("saveButton");button.disabled=true;
  try{
    const fullName=$("fullName").value.trim();
    const bio=$("bio").value.trim();
    const sport=$("sport").value.trim();
    const discipline=$("discipline").value.trim();
    if(!fullName)throw new Error("Meno nemôže byť prázdne.");

    const {error:profileError}=await db.from("profiles")
      .update({full_name:fullName,bio:bio||null})
      .eq("id",session.user.id);
    if(profileError)throw profileError;

    if(primaryDiscipline?.id){
      const {error:disciplineError}=await db.from("player_disciplines")
        .update({sport:sport||primaryDiscipline.sport,discipline:discipline||primaryDiscipline.discipline})
        .eq("id",primaryDiscipline.id);
      if(disciplineError)throw disciplineError;
    }else if(sport || discipline){
      const {data:newRow,error:disciplineError}=await db.from("player_disciplines").insert({
        player_id:session.user.id,
        sport:sport||"Šport",
        discipline:discipline||null,
        is_primary:true
      }).select("id,sport,discipline,is_primary").single();
      if(disciplineError)throw disciplineError;
      primaryDiscipline=newRow;
    }

    profile.full_name=fullName;profile.bio=bio;
    $("profileNameHero").textContent=fullName;
    $("avatarInitials").textContent=initials(fullName);
    toast("Verejný profil bol uložený.");
  }catch(error){
    console.error("[profile editor] save",error);
    toast(error.message==="Meno nemôže byť prázdne."?error.message:"Profil sa nepodarilo uložiť.","err");
  }finally{
    button.disabled=false;
  }
}
async function init(){
  try{
    if(!db)throw new Error("Supabase klient nie je dostupný.");
    const {data:{session:currentSession},error:sessionError}=await db.auth.getSession();
    if(sessionError)throw sessionError;
    if(!currentSession){
      location.replace("/login/?redirect=/profil/moj-profil/");
      return;
    }
    session=currentSession;

    const {data:profileRow,error:profileError}=await db.from("profiles")
      .select("id,full_name,role,plan,is_admin,avatar_url,bio,created_at")
      .eq("id",session.user.id).single();
    if(profileError)throw profileError;

    const role=String(profileRow.role||"player").toLowerCase();
    if(profileRow.is_admin===true || role==="admin" || role==="club" || role==="organization"){
      location.replace("/profil-ul/");
      return;
    }
    profile=profileRow;

    const {data:disciplines,error:discError}=await db.from("player_disciplines")
      .select("id,sport,discipline,is_primary,created_at")
      .eq("player_id",session.user.id)
      .order("is_primary",{ascending:false})
      .order("created_at",{ascending:true});
    if(discError)throw discError;
    primaryDiscipline=(disciplines||[])[0]||null;

    $("fullName").value=profile.full_name||"";
    $("bio").value=profile.bio||"";
    $("bioCount").textContent=String($("bio").value.length);
    $("sport").value=primaryDiscipline?.sport||"";
    $("discipline").value=primaryDiscipline?.discipline||"";
    $("profileNameHero").textContent=profile.full_name||"Hráč";
    const ownPublicUrl=`/profil/?id=${encodeURIComponent(session.user.id)}&view=public`;
    $("publicProfileLink").href=ownPublicUrl;
    $("editorOverviewLink").href=ownPublicUrl;
    renderAvatar();

    await loadGallery();

    $("loading").classList.add("hidden");
    $("app").classList.remove("hidden");
  }catch(error){
    console.error("[profile editor] init",error);
    $("loading").innerHTML='<div>Profil sa nepodarilo načítať.<br><br><a class="btn" href="/profil/">Späť na profil</a></div>';
  }
}

$("bio").addEventListener("input",()=>{$("bioCount").textContent=String($("bio").value.length)});
$("avatarButton").addEventListener("click",()=>$("avatarInput").click());
$("avatarInput").addEventListener("change",()=>uploadAvatar($("avatarInput").files?.[0]));
$("galleryButton").addEventListener("click",()=>$("galleryInput").click());
$("galleryInput").addEventListener("change",()=>uploadGalleryImage($("galleryInput").files?.[0]));
$("saveButton").addEventListener("click",saveProfile);

init();
</script>
<script src="/assets/csp-translate.js?v=20260814-3" defer></script>
</body>
</html>
