name: RR standings and scoreboard starter fix

on:
  push:
    paths:
      - '.github/workflows/rr-scoreboard-starter-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch RR tiebreak and scoreboard starter
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(s, old, new, label):
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1, found {n}')
              return s.replace(old,new,1)

          p=Path('turnament/index.html')
          s=p.read_text(encoding='utf-8')
          s=replace_once(s,
              'const rows=Object.values(tab).map(s=>({...s,pct:(s.gw+s.gl)?Math.round(100*s.gw/(s.gw+s.gl)):0,h2hPoints:0,h2hScoreFor:0}));',
              'const rows=Object.values(tab).map(s=>({...s,pct:(s.gw+s.gl)?Math.round(100*s.gw/(s.gw+s.gl)):0,h2hPoints:0,h2hScoreFor:0,h2hScoreAgainst:0,h2hDiff:0}));',
              'RR row init')
          s=replace_once(s,
              'const mini=new Map(tied.map(row=>[row.name,{points:0,scoreFor:0}]));',
              'const mini=new Map(tied.map(row=>[row.name,{points:0,scoreFor:0,scoreAgainst:0}]));',
              'RR mini init')
          s=replace_once(s,
              'mini.get(match.p1.name).scoreFor+=s1;\n      mini.get(match.p2.name).scoreFor+=s2;',
              'mini.get(match.p1.name).scoreFor+=s1;\n      mini.get(match.p1.name).scoreAgainst+=s2;\n      mini.get(match.p2.name).scoreFor+=s2;\n      mini.get(match.p2.name).scoreAgainst+=s1;',
              'RR mini score')
          s=replace_once(s,
              'row.h2hScoreFor=headToHead.scoreFor;',
              'row.h2hScoreFor=headToHead.scoreFor;\n      row.h2hScoreAgainst=headToHead.scoreAgainst;\n      row.h2hDiff=headToHead.scoreFor-headToHead.scoreAgainst;',
              'RR H2H assign')
          s=replace_once(s,
              'b.h2hPoints-a.h2hPoints ||\n    b.h2hScoreFor-a.h2hScoreFor ||\n    b.gw-a.gw ||',
              'b.h2hPoints-a.h2hPoints ||\n    b.h2hDiff-a.h2hDiff ||\n    b.h2hScoreFor-a.h2hScoreFor ||\n    (b.gw-b.gl)-(a.gw-a.gl) ||\n    b.gw-a.gw ||',
              'RR sort')
          p.write_text(s,encoding='utf-8')

          for rel in ['scoreboard/index.html','scoreboard-te/index.html']:
              p=Path(rel); s=p.read_text(encoding='utf-8')
              s=replace_once(s,
                  'const breakerIndex=()=>state.alternateBreak ? (state.period-1)%state.playerCount : state.starter;',
                  'const breakerIndex=()=>state.alternateBreak ? (state.starter+state.period-1)%state.playerCount : state.starter;',
                  f'{rel} breaker')
              head='    <div class="head">${playerIdentityMarkup(p)}${starterBadge}</div>\n'
              starter='''    <div class="head">${playerIdentityMarkup(p)}${starterBadge}</div>\n    <div class="player-starter-select" style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 4px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.025)">\n      <span style="font-size:.68rem;font-weight:850;letter-spacing:.08em;color:${i===state.starter?'var(--gold)':'var(--muted)'}">ZAČÍNA HRU</span>\n      <label class="switch"><input type="checkbox" data-starting-player="${i}" ${i===state.starter?'checked':''}/><span class="slider"></span></label>\n    </div>\n'''
              s=replace_once(s,head,starter,f'{rel} starter UI')
              wire='function wireCardButtons(m){\n'
              selector='''function selectStartingPlayer(i){\n  if(!Number.isInteger(i)||i<0||i>=state.playerCount)return;\n  const previous=state.starter;\n  state.starter=i;\n  if(state.period===1&&state.currentIndex===previous)state.currentIndex=i;\n  addLog(`Začína hru: ${activePlayers()[i].name}`);\n  render();\n}\n\nfunction wireCardButtons(m){\n'''
              s=replace_once(s,wire,selector,f'{rel} starter selector')
              evt='  document.querySelectorAll("[data-score-event]").forEach(b=>b.onclick=()=>handleScoreEvent(+b.dataset.i,b.dataset.scoreEvent));\n'
              s=replace_once(s,evt,'  document.querySelectorAll("[data-starting-player]").forEach(b=>b.onchange=()=>selectStartingPlayer(+b.dataset.startingPlayer));\n'+evt,f'{rel} starter wire')
              old_keep='const keep={sport:state.sport,discipline:state.discipline,customLabel:state.customLabel,playerCount:state.playerCount,raceTo:state.raceTo,pointsTarget:state.pointsTarget,setTarget:state.setTarget,doubleOut:state.doubleOut,names:state.players.map(p=>p.name)};'
              new_keep='const keep={sport:state.sport,discipline:state.discipline,customLabel:state.customLabel,playerCount:state.playerCount,raceTo:state.raceTo,pointsTarget:state.pointsTarget,setTarget:state.setTarget,doubleOut:state.doubleOut,alternateBreak:state.alternateBreak,starter:state.starter,names:state.players.map(p=>p.name)};'
              s=replace_once(s,old_keep,new_keep,f'{rel} reset keep')
              old_assign='Object.assign(state,{sport:keep.sport,discipline:keep.discipline,customLabel:keep.customLabel,playerCount:keep.playerCount,raceTo:keep.raceTo,pointsTarget:keep.pointsTarget,setTarget:keep.setTarget,doubleOut:keep.doubleOut});'
              new_assign='Object.assign(state,{sport:keep.sport,discipline:keep.discipline,customLabel:keep.customLabel,playerCount:keep.playerCount,raceTo:keep.raceTo,pointsTarget:keep.pointsTarget,setTarget:keep.setTarget,doubleOut:keep.doubleOut,alternateBreak:keep.alternateBreak,starter:Math.min(keep.starter,keep.playerCount-1),currentIndex:Math.min(keep.starter,keep.playerCount-1)});'
              s=replace_once(s,old_assign,new_assign,f'{rel} reset assign')
              p.write_text(s,encoding='utf-8')

          p=Path('scripts/test-rr-ko-engine.mjs')
          s=p.read_text(encoding='utf-8')
          s=replace_once(s,
              "sourceGuard(/b\\.h2hPoints-a\\.h2hPoints\\s*\\|\\|\\s*b\\.h2hScoreFor-a\\.h2hScoreFor\\s*\\|\\|\\s*b\\.gw-a\\.gw/, 'RR tiebreak must use mini-table points, mini-table score-for, then total score-for');",
              "sourceGuard(/b\\.h2hPoints-a\\.h2hPoints\\s*\\|\\|\\s*b\\.h2hDiff-a\\.h2hDiff\\s*\\|\\|\\s*b\\.h2hScoreFor-a\\.h2hScoreFor\\s*\\|\\|\\s*\\(b\\.gw-b\\.gl\\)-\\(a\\.gw-a\\.gl\\)\\s*\\|\\|\\s*b\\.gw-a\\.gw/, 'RR tiebreak must use H2H points, H2H diff, H2H score-for, total diff, then total score-for');",
              'test source guard')
          s=replace_once(s,
              'const rows=Object.values(tab).map(s=>({...s,pct:(s.gw+s.gl)?Math.round(100*s.gw/(s.gw+s.gl)):0,h2hPoints:0,h2hScoreFor:0}));',
              'const rows=Object.values(tab).map(s=>({...s,pct:(s.gw+s.gl)?Math.round(100*s.gw/(s.gw+s.gl)):0,h2hPoints:0,h2hScoreFor:0,h2hScoreAgainst:0,h2hDiff:0}));',
              'test RR row')
          s=replace_once(s,'const mini=new Map(tied.map(r=>[r.name,{points:0,scoreFor:0}]));','const mini=new Map(tied.map(r=>[r.name,{points:0,scoreFor:0,scoreAgainst:0}]));','test mini')
          s=replace_once(s,'mini.get(m.p1.name).scoreFor+=s1;\n      mini.get(m.p2.name).scoreFor+=s2;','mini.get(m.p1.name).scoreFor+=s1;mini.get(m.p1.name).scoreAgainst+=s2;\n      mini.get(m.p2.name).scoreFor+=s2;mini.get(m.p2.name).scoreAgainst+=s1;','test mini score')
          s=replace_once(s,'tied.forEach(r=>{r.h2hPoints=mini.get(r.name).points;r.h2hScoreFor=mini.get(r.name).scoreFor;});','tied.forEach(r=>{const h=mini.get(r.name);r.h2hPoints=h.points;r.h2hScoreFor=h.scoreFor;r.h2hScoreAgainst=h.scoreAgainst;r.h2hDiff=h.scoreFor-h.scoreAgainst;});','test mini assign')
          s=replace_once(s,'return rows.sort((a,b)=>b.p-a.p||b.h2hPoints-a.h2hPoints||b.h2hScoreFor-a.h2hScoreFor||b.gw-a.gw||a.seed-b.seed);','return rows.sort((a,b)=>b.p-a.p||b.h2hPoints-a.h2hPoints||b.h2hDiff-a.h2hDiff||b.h2hScoreFor-a.h2hScoreFor||(b.gw-b.gl)-(a.gw-a.gl)||b.gw-a.gw||a.seed-b.seed);','test sort')
          s=replace_once(s,"assert.deepEqual(rows.map(r=>r.name),['A','C','B'], '3-way mini-table must sort by score-for when mini points are equal');","assert.deepEqual(rows.map(r=>r.name),['A','C','B'], '3-way mini-table must sort by H2H score difference before H2H score-for');",'test message')
          anchor="""{
            const opp=comboFirstRoundOpponents(16);
          """
          case="""{
            const A={name:'A',seed:1},B={name:'B',seed:2},C={name:'C',seed:3},D={name:'D',seed:4};
            const rows=rrTable([A,B,C,D],[
              {p1:A,p2:B,s1:5,s2:4,winner:1},
              {p1:B,p2:C,s1:5,s2:4,winner:1},
              {p1:C,p2:A,s1:5,s2:4,winner:1},
              {p1:A,p2:D,s1:5,s2:4,winner:1},
              {p1:B,p2:D,s1:5,s2:1,winner:1},
              {p1:C,p2:D,s1:5,s2:3,winner:1},
            ]);
            const a=rows.find(r=>r.name==='A'),b=rows.find(r=>r.name==='B'),c=rows.find(r=>r.name==='C');
            assert.equal(a.p,b.p,'fixture requires equal points');
            assert.equal(b.p,c.p,'fixture requires a 3-way tie');
            assert.equal(a.h2hPoints,b.h2hPoints,'H2H points must be equal');
            assert.equal(a.h2hDiff,b.h2hDiff,'H2H difference must be equal');
            assert.equal(a.h2hScoreFor,b.h2hScoreFor,'H2H score-for must be equal');
            assert.ok((b.gw-b.gl)>(c.gw-c.gl)&&(c.gw-c.gl)>(a.gw-a.gl),'fixture must differ only on total score difference after H2H');
            assert.deepEqual(rows.slice(0,3).map(r=>r.name),['B','C','A'],'total score difference must break a fully equal H2H mini-table');
          }

          {
            const opp=comboFirstRoundOpponents(16);
          """
          s=replace_once(s,anchor,case,'test total diff case')
          s=replace_once(s,"console.log('RR→KO engine tests: OK (7 suites)');","console.log('RR→KO engine tests: OK (8 suites)');",'test count')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Run RR regression test
        run: node scripts/test-rr-ko-engine.mjs turnament/index.html
      - name: Verify scoreboard starter logic
        run: |
          grep -q 'state.starter+state.period-1' scoreboard/index.html
          grep -q 'data-starting-player' scoreboard/index.html
          grep -q 'state.starter+state.period-1' scoreboard-te/index.html
          grep -q 'data-starting-player' scoreboard-te/index.html
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turnament/index.html scoreboard/index.html scoreboard-te/index.html scripts/test-rr-ko-engine.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Fix RR tiebreak and alternating starter"
          git push origin HEAD:main
