name: League team edit and standings fix
on:
  push:
    paths:
      - '.github/workflows/league-team-edit-standings-fix.yml'
      - 'scripts/patch_league_team_edit.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch leagues UI
        run: python scripts/patch_league_team_edit.py
      - name: Verify
        run: |
          grep -q "Upraviť tím" ligy/index.html
          grep -q "Skóre +" ligy/index.html
          grep -q "Úspešnosť" ligy/index.html
          grep -q "editParticipant" ligy/index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ligy/index.html
          git commit -m "Add league team editing and richer standings" || exit 0
          git push origin main
