name: Scoreboard TE lifecycle cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove obsolete manual station start flow
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('scoreboard-te/index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          old = '''  const running=row.match_status==="in_progress"||row.match_status==="live";
  $("stationStartBtn").disabled=!row.can_start||stationBusy;
  $("stationStartBtn").textContent=running?"ZÁPAS PREBIEHA":row.can_start?"ZAČAŤ ZÁPAS":"ČAKÁM NA OBOCH HRÁČOV";

  if(running && stationActiveMatchId!==row.match_id){'''
          new = '''  const running=row.match_status==="in_progress"||row.match_status==="live";
  $("stationStartBtn")?.classList.add("hidden");

  if(running && stationActiveMatchId!==row.match_id){'''
          if old not in s:
              raise SystemExit('renderStationState start-button block not found')
          s = s.replace(old, new, 1)

          s, count = re.subn(
              r'\nasync function startAssignedStationMatch\(\)\{.*?\n\}\nfunction initFixedStationTablet\(\)\{',
              '\nfunction initFixedStationTablet(){',
              s,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('startAssignedStationMatch function block not found')

          binding = '  $("stationStartBtn").onclick=startAssignedStationMatch;\n'
          if binding not in s:
              raise SystemExit('manual start button binding not found')
          s = s.replace(binding, '', 1)

          if s == original:
              raise SystemExit('no changes produced')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scoreboard-te/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove obsolete manual station start flow"
          git push
