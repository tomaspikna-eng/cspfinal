name: Build CSP Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-app
    paths:
      - ".github/workflows/build-csp-android.yml"
      - "mobile/csp-android/**"

jobs:
  build-android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile/csp-android

    steps:
      - name: Checkout Android branch
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/csp-android/package-lock.json

      - name: Install Capacitor dependencies
        run: npm ci

      - name: Sync Android project
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build installable APK
        run: ./android/gradlew -p android assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Connect-Sports-Pro-1.0.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Connect-Sports-Pro-Android-APK
          path: mobile/csp-android/dist/Connect-Sports-Pro-1.0.2.apk
          if-no-files-found: error
          retention-days: 30
