name: Build CSP Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - android-app
    paths:
      - ".github/workflows/build-csp-android.yml"
      - "mobile/csp-android/**"

jobs:
  build-android-release:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile/csp-android

    steps:
      - name: Checkout Android branch
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/csp-android/package-lock.json

      - name: Install Capacitor dependencies
        run: npm ci

      - name: Sync Android project
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build release APK and AAB
        run: |
          ./android/gradlew -p android assembleRelease
          ./android/gradlew -p android bundleRelease

      - name: Collect unsigned release files
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/Connect-Sports-Pro-1.0.3-unsigned.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/Connect-Sports-Pro-1.0.3-unsigned.aab

      - name: Collect Android apksigner tool
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BUILD_TOOLS="$(ls -1 "$SDK_ROOT/build-tools" | sort -V | tail -1)"
          mkdir -p dist/android-build-tools
          cp "$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner" dist/android-build-tools/
          cp -R "$SDK_ROOT/build-tools/$BUILD_TOOLS/lib" dist/android-build-tools/
          chmod +x dist/android-build-tools/apksigner
          echo "$BUILD_TOOLS" > dist/android-build-tools/version.txt

      - name: Upload production release bundle
        uses: actions/upload-artifact@v4
        with:
          name: Connect-Sports-Pro-Android-Release-1.0.3
          path: |
            mobile/csp-android/dist/Connect-Sports-Pro-1.0.3-unsigned.apk
            mobile/csp-android/dist/Connect-Sports-Pro-1.0.3-unsigned.aab
            mobile/csp-android/dist/android-build-tools/**
          if-no-files-found: error
          retention-days: 30
