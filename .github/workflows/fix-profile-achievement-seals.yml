name: Fix profile achievement seals
on:
  push:
    paths:
      - '.github/workflows/fix-profile-achievement-seals.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: python scripts/fix_profile_achievement_seals.py
      - name: Commit result
        run: |
          rm -f scripts/fix_profile_achievement_seals.py
          rm -f .github/workflows/fix-profile-achievement-seals.yml
          git config user.name "CSP UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/csp-social.js profil/index.html scripts/fix_profile_achievement_seals.py .github/workflows/fix-profile-achievement-seals.yml
          git commit -m "Use Premium Seal badges on profile achievement summary"
          git push
