name: Add avatar crop UI
on:
  push:
    paths:
      - '.github/workflows/add-avatar-crop-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add avatar crop script to profile pages
        run: |
          python <<'PY'
          from pathlib import Path
          tag='  <script src="/assets/csp-avatar-crop.js?v=20260915-1" defer></script>\n'
          for name in ['profil/index.html','profil/moj-profil/index.html','profil/achievements/index.html']:
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              if '/assets/csp-avatar-crop.js' not in text:
                  if '</body>' not in text:
                      raise SystemExit(f'missing body close: {name}')
                  text=text.replace('</body>',tag+'</body>',1)
                  p.write_text(text,encoding='utf-8')
          PY
      - name: Commit result
        run: |
          rm -f .github/workflows/add-avatar-crop-ui.yml
          git config user.name "CSP UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add profil/index.html profil/moj-profil/index.html profil/achievements/index.html .github/workflows/add-avatar-crop-ui.yml
          git commit -m "Enable avatar centering and zoom on profiles"
          git push
