name: CSP RR seeding copy fix

on:
  push:
    paths:
      - '.github/workflows/csp-rr-seeding-copy-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Align tournament wizard copy with seeding engine
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('turnament/index.html')
          text=p.read_text(encoding='utf-8')
          old="Víťazi skupín idú do opačných polovíc — stretnú sa najskôr vo finále. Krížové nasadenie (1. zo skupiny A vs 3. zo skupiny B…) finalizujeme v engine."
          new="Víťazi skupín tvoria prvé seed pásmo a v prvom kole KO sa nestretnú. Druhé miesta tvoria ďalšie seed pásmo; ostatní postupujúci sa rozlosujú do nižších seedov. Zápasom hráčov z rovnakej skupiny sa v prvom kole vyhneme, pokiaľ je to matematicky možné."
          if old not in text:
              raise SystemExit('wizard copy not found')
          text=text.replace(old,new,1)
          old2="Krížové nasadenie finalizujeme v engine. Konfigurácia sa uloží."
          new2="Nasadenie sa vytvorí podľa seed pásiem a ochrany skupín. Konfigurácia sa uloží."
          if old2 not in text:
              raise SystemExit('preview copy not found')
          text=text.replace(old2,new2,1)
          old_comment="""   The cross-seed order is a conventional snake by finishing position:\n   1. miesto naprieč skupinami then the next position in reverse group order, then forward\n   again. With two groups this is poradie krížom medzi skupinami; it is the existing\n   UI's promised cross-group cross-group principle (same-group\n   qualifiers are distributed through opposite halves where possible)."""
          new_comment="""   Qualifiers are split into seed bands: group winners first, runners-up\n   second, lower positions afterward. Lower qualifiers are deterministically\n   shuffled, while first-round same-group rematches are avoided where possible.\n   The special 2-group / top-3 format uses fixed cross-group preliminaries."""
          if old_comment in text:
              text=text.replace(old_comment,new_comment,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Verify copy
        run: |
          grep -q "Víťazi skupín tvoria prvé seed pásmo" turnament/index.html
          grep -q "Nasadenie sa vytvorí podľa seed pásiem" turnament/index.html
      - name: Commit patch
        run: |
          git config user.name "CSP Automation"
          git config user.email "actions@users.noreply.github.com"
          git add turnament/index.html
          git commit -m "Align RR seeding wizard copy with engine"
          git push origin HEAD:main
