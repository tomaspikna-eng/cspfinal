name: CSP RR seeding fix v2

on:
  push:
    paths:
      - '.github/workflows/csp-rr-seeding-fix-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch tournament RR to KO seeding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path=Path('turnament/index.html')
          text=path.read_text(encoding='utf-8')

          start=text.index('function comboCrossSeed(rows,groupCount,advance){')
          end=text.index('\nfunction comboOverallTop',start)
          new='''function comboSeedCompare(a,b){
            return b.stat.p-a.stat.p || b.stat.w-a.stat.w ||
              (b.stat.gw-b.stat.gl)-(a.stat.gw-a.stat.gl) ||
              b.stat.pct-a.stat.pct || a.groupIndex-b.groupIndex ||
              Number(a.player.seed||999999)-Number(b.player.seed||999999);
          }
          function comboDrawHash(value){
            let h=2166136261;
            for(let i=0;i<value.length;i++){h^=value.charCodeAt(i);h=Math.imul(h,16777619);}
            return h>>>0;
          }
          function comboFirstRoundOpponents(N){
            const order=TM.seedKO(N),map=new Map();
            for(let i=0;i<order.length;i+=2){map.set(order[i],order[i+1]);map.set(order[i+1],order[i]);}
            return map;
          }
          function comboSeedBandName(rank){
            if(rank===1)return 'group_winner';
            if(rank===2)return 'runner_up';
            return 'random_lower';
          }
          function comboCrossSeed(rows,groupCount,advance,drawKey=''){
            const winners=rows.filter(r=>r.rank===1).sort(comboSeedCompare);
            const runners=rows.filter(r=>r.rank===2).sort(comboSeedCompare);
            const lower=rows.filter(r=>r.rank>=3).sort((a,b)=>{
              const ah=comboDrawHash(`${drawKey}|${a.player.id||a.player.name}|${a.groupIndex}|${a.rank}`);
              const bh=comboDrawHash(`${drawKey}|${b.player.id||b.player.name}|${b.groupIndex}|${b.rank}`);
              return ah-bh || comboSeedCompare(a,b);
            });
            const total=rows.length,N=TM.nextPow2(Math.max(2,total));
            const opponents=comboFirstRoundOpponents(N),seeded=Array(total).fill(null);
            winners.forEach((row,index)=>{if(index<total)seeded[index]=row;});
            const placeBand=(candidates,startSeed)=>{
              const pool=[...candidates],endSeed=Math.min(total,startSeed+pool.length-1);
              for(let seed=startSeed;seed<=endSeed;seed++){
                const opponentSeed=opponents.get(seed);
                const opponent=opponentSeed&&opponentSeed<=total?seeded[opponentSeed-1]:null;
                let pick=opponent?pool.findIndex(row=>row.groupIndex!==opponent.groupIndex):-1;
                if(pick<0)pick=0;
                seeded[seed-1]=pool.splice(pick,1)[0];
              }
            };
            placeBand(runners,winners.length+1);
            placeBand(lower,winners.length+runners.length+1);
            const bandOfSeed=seed=>seed<=winners.length?1:(seed<=winners.length+runners.length?2:3);
            const conflictAt=seed=>{
              const opp=opponents.get(seed);
              if(!opp||opp>total||seed>opp)return false;
              const a=seeded[seed-1],b=seeded[opp-1];
              return !!(a&&b&&a.groupIndex===b.groupIndex);
            };
            const conflicts=()=>Array.from({length:total},(_,i)=>i+1).filter(conflictAt);
            for(const seed of conflicts()){
              const opp=opponents.get(seed),movable=bandOfSeed(seed)>=bandOfSeed(opp)?seed:opp,band=bandOfSeed(movable);
              for(let other=1;other<=total;other++){
                if(other===movable||bandOfSeed(other)!==band)continue;
                const before=conflicts().length;
                [seeded[movable-1],seeded[other-1]]=[seeded[other-1],seeded[movable-1]];
                if(conflicts().length<before)break;
                [seeded[movable-1],seeded[other-1]]=[seeded[other-1],seeded[movable-1]];
              }
            }
            return seeded.filter(Boolean);
          }'''
          text=text[:start]+new+text[end:]

          old="const crossSeeded=comboCrossSeed(standings,t.grp.groups.length,t.grp.advance);"
          if old not in text: raise SystemExit('crossSeeded line not found')
          text=text.replace(old,"const crossSeeded=comboCrossSeed(standings,t.grp.groups.length,t.grp.advance,t.id||'');",1)

          old="const k=t.format==='rr_sko'?Math.min(Math.max(0,+t.protectedSeeds||0),Math.max(0,crossSeeded.length-1)):0;"
          if old not in text: raise SystemExit('protected seed line not found')
          text=text.replace(old,"""const twoGroupTopThree=t.format==='rr_sko'&&isTwoGroupTopThreeCrossing(crossSeeded,2);
            const k=t.format==='rr_sko'
              ? (twoGroupTopThree?2:Math.min(Math.max(0,+t.protectedSeeds||0),Math.max(0,crossSeeded.length-1)))
              : 0;""",1)

          a=text.index("const mainPlayers=t.phase2.crossingMode==='two-groups-top-three'")
          b=text.index('      t.phase2.main=TM.buildSKO(mainPlayers);',a)
          block=text[a:b]
          if 'A1 vs winner(A2–B3)' not in block: raise SystemExit('unexpected semifinal block')
          replacement="""const mainPlayers=t.phase2.crossingMode==='two-groups-top-three' &&
                t.phase2.protected.length===2 && qualifiedSurvivors.length===2
                // buildSKO uses slot order 1–4 / 2–3. Required crossing:
                // A1 vs winner(B2–A3), B1 vs winner(A2–B3).
                ? [t.phase2.protected[0],t.phase2.protected[1],qualifiedSurvivors[0],qualifiedSurvivors[1]]
                : [...t.phase2.protected,...qualifiedSurvivors];
"""
          text=text[:a]+replacement+text[b:]

          a=text.index('function comboQualifierPayload(t){')
          b=text.index('\n}\n\nlet comboTransitionPromise',a)+2
          payload="""function comboQualifierPayload(t){
            const standings=comboStandings(t);
            const ordered=comboCrossSeed(standings,t.grp.groups.length,t.grp.advance,t.id||'');
            return ordered.map((row,index)=>({
              tournament_player_id:row.player.id,
              source_group:row.groupIndex+1,
              source_position:row.rank,
              qualification_position:index+1,
              seed:index+1,
              metadata:{seed_band:comboSeedBandName(row.rank),seeding_policy:'rr_rank_bands_v1'}
            }));
          }"""
          text=text[:a]+payload+text[b:]

          text=text.replace('${grp.groups.length} skupín · z každej postupuje ${grp.advance} → následne ${koType} pavúk (krížové nasadenie). Najprv dohraj skupiny.','${grp.groups.length} skupín · z každej postupuje ${grp.advance} → následne ${koType}. Víťazi skupín tvoria prvé seed pásmo, druhé miesta druhé pásmo, ostatní sa losujú do nižších seedov. Najprv dohraj skupiny.',1)
          text=text.replace('Po dohraní skupín sa postupujúci nasadia krížom do ${koType} pavúka (1. zo skupiny A vs 3. zo skupiny B…).','${grp.groups.length===2&&grp.advance===3?`Víťazi skupín idú priamo do semifinále. Predkolo: A2 – B3 a B2 – A3; víťaz A2 – B3 ide na B1 a víťaz B2 – A3 na A1.`:`Po dohraní skupín sa vytvoria seed pásma. Víťazi skupín sa v 1. kole nestretnú; druhé miesta sú v ďalšom pásme a ostatní sa rozlosujú s ochranou proti opakovaniu zápasu z rovnakej skupiny, pokiaľ je to matematicky možné.`}',1)

          path.write_text(text,encoding='utf-8')
          PY
      - name: Verify patched rules
        run: |
          grep -q "rr_rank_bands_v1" turnament/index.html
          grep -q "A1 vs winner(B2–A3)" turnament/index.html
          grep -q "twoGroupTopThree?2" turnament/index.html
      - name: Commit patch
        run: |
          git config user.name "CSP Automation"
          git config user.email "actions@users.noreply.github.com"
          git add turnament/index.html
          git commit -m "Fix RR to KO seed bands and group crossing"
          git push origin HEAD:main
