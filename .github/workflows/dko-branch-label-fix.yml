name: DKO branch label fix
on:
  push:
    paths:
      - '.github/workflows/dko-branch-label-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix DKO branch labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('turnament/index.html')
          s=p.read_text(encoding='utf-8')
          old="const sideLabel=side==='loser'?'A':(side==='start'||side==='winner')?'B':'Finálová fáza';"
          new="const sideLabel=side==='loser'?'B':(side==='start'||side==='winner')?'A':'Finálová fáza';"
          if s.count(old)!=1:
              raise SystemExit(f'Expected exactly one DKO sideLabel marker, got {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q "const sideLabel=side==='loser'?'B':(side==='start'||side==='winner')?'A':'Finálová fáza';" turnament/index.html
          grep -q "dko-bracket-column.loser .dko-column-side,.dko-bracket-column.loser .bracket-column-title{color:var(--red)}" turnament/index.html
          grep -q "dko-bracket-column.winner .dko-column-side{color:var(--green)}" turnament/index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turnament/index.html
          git commit -m "Fix DKO A B branch labels"
          git push origin main
