[package]
name = "connect-sports-pro"
version = "1.1.0"
description = "Connect Sports Pro desktop application"
authors = ["Connect Sports Pro"]
edition = "2021"

[lib]
name = "connect_sports_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
