<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ligová stanica – Connect Sports Pro</title>
<link rel="icon" type="image/png" href="/assets/csp-logo-mark.png">
<style>
:root{--bg:#07080a;--card:#11141a;--line:rgba(255,255,255,.1);--text:#f6f7f9;--muted:#969ca8;--gold:#d4a843;--green:#27cf7d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.card{width:min(680px,calc(100% - 28px));padding:28px;border:1px solid var(--line);border-radius:22px;background:var(--card);text-align:center}.eyebrow{color:var(--green);font-size:.75rem;font-weight:900;letter-spacing:.13em;text-transform:uppercase}h1{font-size:clamp(2.2rem,7vw,4.5rem);letter-spacing:-.05em;margin:12px 0}.muted{color:var(--muted)}.match{margin:24px 0;padding:20px;border:1px solid rgba(212,168,67,.35);border-radius:15px;background:rgba(212,168,67,.06)}.match b{font-size:1.25rem}.btn{min-height:52px;padding:0 20px;border:0;border-radius:12px;background:var(--green);color:#062216;font:800 1rem Inter,system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}.hide{display:none}.error{color:#ff9a94}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js" integrity="sha384-AkNSQdptcXlJ0/NBZc4qGk86cDVXcCevwoWgEKIpHOEfbvlXGLlIkimQtONt8KNf" crossorigin="anonymous"></script>
<script src="/assets/csp-auth.js"></script>
</head>
<body>
<main class="card"><div class="eyebrow">Connect Sports Pro · League tablet</div><h1 id="stationName">Ligová stanica</h1><p class="muted" id="leagueName">Pripájam tablet…</p><div class="match" id="state">Načítavam pridelený duel…</div><a class="btn hide" id="openMatch" href="#">Otvoriť zápis duelu</a><a class="btn hide" id="login" href="/login/">Prihlásiť kapitána</a></main>
<script>
const token=new URLSearchParams(location.search).get('device_token');
const state=document.getElementById('state'),openMatch=document.getElementById('openMatch'),login=document.getElementById('login');
async function load(){
  if(!token){state.textContent='Chýba identifikátor stanice.';state.classList.add('error');return}
  const auth=await cspAuth.getSession();if(!auth.data?.session){state.textContent='Výsledky môže zapisovať iba prihlásený kapitán s plánom PRO+ alebo vyšším.';login.href='/login/?returnTo='+encodeURIComponent(location.pathname+location.search);login.classList.remove('hide');return}
  const {data,error}=await cspAuth.client.rpc('get_league_station_state',{p_device_token:token});const row=Array.isArray(data)?data[0]:data;
  if(error||!row){state.textContent=error?.message||'Stanica sa nenašla.';state.classList.add('error');openMatch.classList.add('hide');return}
  document.getElementById('stationName').textContent=row.resource_label;document.getElementById('leagueName').textContent=row.league_name;
  if(!row.match_id){state.textContent='Stanica je voľná. Čaká na pridelenie duelu.';openMatch.classList.add('hide');return}
  state.innerHTML=`<b>${escapeHtml(row.home_team)} vs ${escapeHtml(row.away_team)}</b><br><span class="muted">Duel #${Number(row.rubber_number)}</span>`;openMatch.href=`/ligy/zapis/?match=${encodeURIComponent(row.match_id)}&rubber=${Number(row.rubber_number)}`;openMatch.classList.remove('hide');
}
function escapeHtml(value=''){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
load();setInterval(load,5000);
</script>
<script src="/assets/csp-translate.js?v=20260814-3" defer></script>
</body>
</html>
