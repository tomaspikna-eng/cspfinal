<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ligy – Connect Sports Pro</title><style>
:root{--bg:#07080a;--card:#111319;--line:#2a2d35;--text:#f5f6f8;--muted:#9ba0aa;--gold:#d4a843;--green:#26d07d;--red:#e35149}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.top{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:900}.brand span{color:var(--gold)}button,.btn,input,select,textarea{font:inherit}.btn{border:1px solid var(--line);background:#171920;color:var(--text);padding:11px 15px;border-radius:10px;font-weight:800;cursor:pointer}.green{background:var(--green);color:#062416;border:0}.gold{background:var(--gold);color:#171005;border:0}.hero{padding:42px 0 20px}.hero h1{font-size:clamp(2.4rem,6vw,4.5rem);margin:0 0 10px}.muted{color:var(--muted)}.panel{display:none;padding:20px 0 60px}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.league{cursor:pointer}.league:hover{border-color:var(--gold)}.tabs,.row{display:flex;gap:10px;flex-wrap:wrap}.tab.active{color:var(--gold);border-color:var(--gold)}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.full{grid-column:1/-1}.input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0b0d11;color:var(--text)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:.88rem}.table{overflow:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.stat b{font-size:1.4rem;display:block}.hide{display:none!important}.notice{padding:12px;border:1px solid var(--line);border-radius:10px;margin:12px 0}.ok{color:var(--green)}.err{color:#ff817b}.match{display:grid;grid-template-columns:80px 1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0}.score{width:58px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.stats{grid-template-columns:1fr 1fr}.match{grid-template-columns:1fr}}@media(max-width:520px){.grid,.stats{grid-template-columns:1fr}.top{height:auto;padding:14px 0}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/csp-auth.js"></script></head><body>
<header class="wrap top"><a class="brand" href="/"><span>Connect</span> Sports Pro</a><div class="row"><a class="btn" href="/profil/">Profil</a><button class="btn green" id="newBtn">Vytvoriť ligu</button></div></header>
<main class="wrap"><section class="hero"><p class="muted">LIGOVÉ PROSTREDIE</p><h1>Sezóna. Zápasy. Tabuľka.</h1><p class="muted">Liga jednotlivcov od registrácie hráčov po konečné poradie.</p></section>
<section id="list" class="panel active"><div class="tabs"><button class="btn tab active" data-filter="public">Verejné ligy</button><button class="btn tab" data-filter="mine">Moje ligy</button></div><div id="leagueList" class="grid"></div><div id="listNotice" class="notice hide"></div></section>
<section id="create" class="panel"><div class="head"><h2>Vytvoriť ligu</h2><button class="btn" id="cancel">Späť</button></div><form id="leagueForm" class="card form"><label class="field full">Názov<input class="input" name="name" required minlength="3"></label><label class="field">Šport<select class="input" name="sport"><option>Biliard</option><option>Šípky</option><option>Bowling</option><option>Karty</option></select></label><label class="field">Disciplína<input class="input" name="discipline" placeholder="8-ball"></label><label class="field">Sezóna<input class="input" name="season_name" required value="2026"></label><label class="field">Systém<select class="input" name="competition_format"><option value="round_robin_single">Každý s každým – 1×</option><option value="round_robin_double">Každý s každým – 2×</option><option value="round_robin_playoff">Základná časť + play-off</option></select></label><label class="field">Rozpis<select class="input" name="scheduling_mode"><option value="rounds">Pevné kolá</option><option value="open_deadline">Voľné odohranie</option></select></label><label class="field">Viditeľnosť<select class="input" name="visibility"><option value="public">Verejná</option><option value="unlisted">Cez odkaz</option><option value="private">Súkromná</option></select></label><label class="field">Začiatok<input class="input" type="date" name="starts_on"></label><label class="field">Koniec<input class="input" type="date" name="ends_on"></label><label class="field">Body za výhru<input class="input" type="number" step=".5" name="win_points" value="3"></label><label class="field">Body za prehru<input class="input" type="number" step=".5" name="loss_points" value="0"></label><label class="field full">Opis<textarea class="input" name="description"></textarea></label><button class="btn green full">Vytvoriť ligu</button><div id="createNotice" class="notice hide full"></div></form></section>
<section id="detail" class="panel"><div class="head"><div><button class="btn" id="back">← Ligy</button><h2 id="title"></h2><p id="meta" class="muted"></p></div><button class="btn gold" id="generate">Vygenerovať rozpis</button></div><div class="stats"><div class="card stat"><b id="sp">0</b><small>Hráči</small></div><div class="card stat"><b id="sm">0</b><small>Zápasy</small></div><div class="card stat"><b id="sd">0</b><small>Odohrané</small></div><div class="card stat"><b id="sx">0 %</b><small>Priebeh</small></div></div><div class="tabs"><button class="btn tab active" data-tab="standings">Tabuľka</button><button class="btn tab" data-tab="matches">Zápasy</button><button class="btn tab" data-tab="players">Hráči</button></div><div id="detailNotice" class="notice hide"></div><div id="standings" class="card tabpane"><div class="table"><table><thead><tr><th>#</th><th>Hráč</th><th>Z</th><th>V</th><th>R</th><th>P</th><th>Skóre</th><th>+/-</th><th>Body</th></tr></thead><tbody id="standingsBody"></tbody></table></div></div><div id="matches" class="card tabpane hide"><div id="matchList"></div></div><div id="players" class="card tabpane hide"><form id="playerForm" class="row"><input class="input" name="display_name" placeholder="Meno hráča" required><input class="input" name="seed" type="number" min="1" placeholder="Nasadenie"><button class="btn green">Pridať hráča</button></form><div class="table"><table><thead><tr><th>Hráč</th><th>Nasadenie</th><th>Stav</th></tr></thead><tbody id="playersBody"></tbody></table></div></div></section></main>
<script>
const db=cspAuth.client,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let session,current,isManager=false,filter='public';const panels=['list','create','detail'];function show(id){panels.forEach(x=>$('#'+x).classList.toggle('active',x===id))}function msg(el,t,c=''){el.textContent=t;el.className='notice '+c}function hide(el){el.className='notice hide'}function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function slug(v){return v.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Math.random().toString(36).slice(2,7)}
async function init(){session=(await cspAuth.getSession()).data?.session||null;bind();const id=new URLSearchParams(location.search).get('id');id?openLeague(id):loadLeagues()}
function bind(){$('#newBtn').onclick=()=>session?show('create'):location.href='/login/?returnTo=%2Fligy%2F';$('#cancel').onclick=()=>show('list');$('#back').onclick=()=>{history.pushState({},'', '/ligy/');show('list');loadLeagues()};$('#leagueForm').onsubmit=createLeague;$('#playerForm').onsubmit=addPlayer;$('#generate').onclick=generate;$$('[data-filter]').forEach(b=>b.onclick=()=>{$$('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;loadLeagues()});$$('[data-tab]').forEach(b=>b.onclick=()=>{$$('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$$('.tabpane').forEach(x=>x.classList.add('hide'));$('#'+b.dataset.tab).classList.remove('hide')})}
async function loadLeagues(){const el=$('#leagueList'),n=$('#listNotice');hide(n);el.innerHTML='';let q=db.from('leagues').select('*').order('created_at',{ascending:false});if(filter==='mine'){if(!session)return msg(n,'Prihlás sa pre zobrazenie vlastných líg.','err');q=q.eq('owner_id',session.user.id)}else q=q.neq('status','draft').in('visibility',['public','unlisted']);const {data,error}=await q;if(error)return msg(n,error.message,'err');el.innerHTML=(data||[]).map(l=>`<article class="card league" data-id="${l.id}"><b>${esc(l.name)}</b><p class="muted">${esc(l.sport)}${l.discipline?' · '+esc(l.discipline):''}<br>${esc(l.season_name)} · ${esc(l.status)}</p></article>`).join('')||'<div class="card">Zatiaľ žiadna liga.</div>';$$('.league').forEach(x=>x.onclick=()=>openLeague(x.dataset.id))}
async function createLeague(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const row={owner_id:session.user.id,name:f.name.trim(),public_slug:slug(f.name),sport:f.sport,discipline:f.discipline||null,season_name:f.season_name,description:f.description||null,competition_format:f.competition_format,scheduling_mode:f.scheduling_mode,visibility:f.visibility,starts_on:f.starts_on||null,ends_on:f.ends_on||null,win_points:+f.win_points,loss_points:+f.loss_points,status:'draft'};const {data,error}=await db.from('leagues').insert(row).select().single();if(error)return msg($('#createNotice'),error.message,'err');openLeague(data.id)}
async function openLeague(id){show('detail');history.pushState({},'',`/ligy/?id=${id}`);const {data,error}=await db.from('leagues').select('*').eq('id',id).single();if(error)return msg($('#detailNotice'),error.message,'err');current=data;isManager=!!session&&session.user.id===data.owner_id;$('#generate').classList.toggle('hide',!isManager);$('#playerForm').classList.toggle('hide',!isManager);$('#title').textContent=data.name;$('#meta').textContent=[data.sport,data.discipline,data.season_name,data.status].filter(Boolean).join(' · ');await Promise.all([loadPlayers(),loadMatches(),loadStandings()])}
async function loadPlayers(){const {data,error}=await db.from('league_players').select('*').eq('league_id',current.id).order('seed',{ascending:true,nullsFirst:false});if(error)return msg($('#detailNotice'),error.message,'err');$('#sp').textContent=data.length;$('#playersBody').innerHTML=data.map(p=>`<tr><td data-player-name>${esc(p.display_name)}</td><td>${p.seed??'–'}</td><td>${p.status}</td></tr>`).join('')||'<tr><td colspan="3">Bez hráčov</td></tr>'}
async function addPlayer(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const {error}=await db.from('league_players').insert({league_id:current.id,display_name:f.display_name.trim(),seed:f.seed?+f.seed:null,status:'active'});if(error)return msg($('#detailNotice'),error.message,'err');e.target.reset();loadPlayers()}
async function generate(){const {data,error}=await db.rpc('generate_league_schedule',{p_league_id:current.id});if(error)return msg($('#detailNotice'),error.message,'err');msg($('#detailNotice'),`Rozpis vytvorený: ${data.matches} zápasov.`,'ok');await Promise.all([loadMatches(),loadStandings()])}
async function loadStandings(){const {data,error}=await db.rpc('get_league_standings',{p_league_id:current.id});if(error)return msg($('#detailNotice'),error.message,'err');$('#standingsBody').innerHTML=(data||[]).map(r=>`<tr><td>${r.standing_position}</td><td data-player-name>${esc(r.display_name)}</td><td>${r.played}</td><td>${r.wins}</td><td>${r.draws}</td><td>${r.losses}</td><td>${r.score_for}:${r.score_against}</td><td>${r.score_difference}</td><td><b>${r.points}</b></td></tr>`).join('')||'<tr><td colspan="9">Tabuľka je prázdna.</td></tr>'}
async function loadMatches(){const {data,error}=await db.from('league_matches').select('*,player1:league_players!league_matches_player1_id_fkey(display_name),player2:league_players!league_matches_player2_id_fkey(display_name)').eq('league_id',current.id).order('round_number').order('match_number');if(error)return msg($('#detailNotice'),error.message,'err');const done=data.filter(m=>['completed','forfeited'].includes(m.status)).length;$('#sm').textContent=data.length;$('#sd').textContent=done;$('#sx').textContent=data.length?Math.round(done/data.length*100)+' %':'0 %';$('#matchList').innerHTML=data.map(m=>`<div class="match"><b>Kolo ${m.round_number}</b><div><span data-player-name>${esc(m.player1?.display_name||'')}</span> vs <span data-player-name>${esc(m.player2?.display_name||'')}</span></div>${isManager?`<div><input class="input score" id="a${m.id}" type="number" min="0" value="${m.score1??''}"> : <input class="input score" id="b${m.id}" type="number" min="0" value="${m.score2??''}"> <button class="btn green" onclick="saveResult('${m.id}','${m.player1_id}','${m.player2_id}')">Uložiť</button></div>`:`<b>${m.score1??'–'} : ${m.score2??'–'}</b>`}</div>`).join('')||'Rozpis ešte nebol vytvorený.'}
async function saveResult(id,p1,p2){const s1=+$('#a'+id).value,s2=+$('#b'+id).value,draw=s1===s2,w=draw?null:(s1>s2?p1:p2);const now=new Date().toISOString();const {error}=await db.from('league_matches').update({score1:s1,score2:s2,winner_id:w,result_type:draw?'draw':'normal',status:'completed',reported_by:session.user.id,reported_at:now,confirmed_by:session.user.id,confirmed_at:now,completed_at:now}).eq('id',id);if(error)return msg($('#detailNotice'),error.message,'err');await Promise.all([loadMatches(),loadStandings()])}window.saveResult=saveResult;init();
</script><script src="/assets/csp-translate.js" defer></script></body></html>
